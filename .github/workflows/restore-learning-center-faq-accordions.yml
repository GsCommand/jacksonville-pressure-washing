name: Restore Learning Center FAQ accordions
on:
  push:
    paths:
      - '.github/workflows/restore-learning-center-faq-accordions.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore accordion FAQs on Learning Center articles
        shell: python
        run: |
          from pathlib import Path
          import re
          files=sorted(Path('learning-center').glob('*/*/index.html'))
          if len(files)!=53: raise SystemExit(f'Expected 53 articles, found {len(files)}')
          sec=re.compile(r'<section class="lc-common-questions"><h2>Common questions</h2>(.*?)</section>',re.S)
          pairs=re.compile(r'<h3>(.*?)</h3><p>(.*?)</p>',re.S)
          css="""<style id="lc-faq-accordion-style">.faq{margin-top:36px;padding-top:4px}.faq h2{margin-bottom:12px}.faq details{border-top:1px solid #dce5ea}.faq details:last-child{border-bottom:1px solid #dce5ea}.faq summary{cursor:pointer;padding:16px 34px 16px 0;font-weight:900;color:#0b4a67;list-style:none;position:relative}.faq summary::-webkit-details-marker{display:none}.faq summary::after{content:'+';position:absolute;right:4px;top:50%;transform:translateY(-50%);color:#0877b9;font-size:1.35rem;font-weight:800}.faq details[open] summary::after{content:'−'}.faq p{margin:0 0 18px;line-height:1.7}</style>"""
          for p in files:
              s=p.read_text(encoding='utf-8')
              m=sec.search(s)
              if not m: raise SystemExit(f'Missing Common questions section: {p}')
              qa=pairs.findall(m.group(1))
              if not qa: raise SystemExit(f'No FAQ pairs: {p}')
              block='<div class="faq"><h2>Common questions</h2>'+''.join(f'<details><summary>{q}</summary><p>{a}</p></details>' for q,a in qa)+'</div>'
              s=s[:m.start()]+block+s[m.end():]
              if 'id="lc-faq-accordion-style"' not in s: s=s.replace('</head>',css+'</head>',1)
              p.write_text(s,encoding='utf-8')
      - name: Verify commit and self-delete
        run: |
          python - <<'PY'
          from pathlib import Path
          files=sorted(Path('learning-center').glob('*/*/index.html'))
          assert len(files)==53
          for p in files:
              s=p.read_text(encoding='utf-8')
              assert '<div class="faq"><h2>Common questions</h2>' in s
              assert '<details><summary>' in s
              assert '<section class="lc-common-questions">' not in s
              assert '"@type":"FAQPage"' in s
          print('Verified 53 Learning Center article accordions with FAQ schema preserved')
          PY
          rm .github/workflows/restore-learning-center-faq-accordions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learning-center .github/workflows/restore-learning-center-faq-accordions.yml
          git commit -m 'Use accordions for Learning Center common questions'
          git push
