name: Swap homepage gutter card image
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update homepage gutter card image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<a class="service-card service-area-card" href="/Gutter-Cleaning-Jacksonville-Fl/"><img class="service-area-card__image" src="/images/gutter-cleaning.webp" alt="Gutter cleaning in Jacksonville" loading="lazy" decoding="async">'
          new = '<a class="service-card service-area-card" href="/Gutter-Cleaning-Jacksonville-Fl/"><img class="service-area-card__image" src="/images/dirty-gutter.jpeg" alt="Gutter cleaning in Jacksonville" loading="lazy" decoding="async">'
          if old not in s:
              raise SystemExit('Homepage gutter card image target not found')
          p.write_text(s.replace(old, new, 1))
          Path('.github/workflows/swap-home-gutter-card-image.yml').unlink()
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/swap-home-gutter-card-image.yml
          git commit -m "Use dirty gutter image on homepage card"
          git push