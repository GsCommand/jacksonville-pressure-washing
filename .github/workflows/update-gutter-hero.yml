name: Update Gutter Hero

on:
  push:
    paths:
      - '.github/workflows/update-gutter-hero.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update gutter hero image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Gutters-Jacksonville-Fl/index.html')
          s = p.read_text()
          old = '<img src="/nocatee-roof-washing.webp" alt="Gutter cleaning service in Jacksonville, Florida">'
          new = '<img src="/images/gutter-cleaning.webp" alt="Gutter cleaning service in Jacksonville, Florida">'
          if old not in s:
              raise SystemExit('Expected gutter hero image markup not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit update and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Gutters-Jacksonville-Fl/index.html
          git rm .github/workflows/update-gutter-hero.yml
          git commit -m 'Update gutter cleaning hero image'
          git push
