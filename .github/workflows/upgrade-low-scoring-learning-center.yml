name: Upgrade low-scoring Learning Center articles
on:
  push:
    paths:
      - '.github/workflows/upgrade-low-scoring-learning-center.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand 18 articles and strengthen internal linking
        shell: python
        run: |
          from pathlib import Path
          import re, json, html

          upgrades = {
          'learning-center/decks/deck-cleaning-before-staining/index.html': {
            'meta': 'Learn how to clean and prepare a deck before staining, including drying, mildew, old coatings, pressure risks and Florida humidity.',
            'intro': '''<p><strong>Jacksonville context:</strong> In Jacksonville and Northeast Florida, humidity, shade, afternoon rain and morning dew can keep deck boards wetter longer than they look from the surface. Before staining, use the coating manufacturer’s preparation and moisture requirements rather than assuming a fixed drying window. See our <a href="/service-areas/jacksonville/">Jacksonville service area</a> for local exterior-cleaning coverage.</p>''',
            'block': '''<h2>Build the cleaning plan around the coating you want to apply</h2><p>The goal is not simply to make the deck look brighter for a day. The goal is to leave a surface that is compatible with the next coating step. If an old film-forming stain is peeling, ordinary washing may remove loose material but leave sound coating behind. If the new stain requires bare or uniformly weathered wood, the preparation may need stripping, sanding or another coating-specific step beyond washing.</p><p>That distinction matters because aggressive pressure can create a false sense of progress. A board may look lighter after a close high-pressure pass while the wood fibers are actually being raised or scarred. Those marks can become more obvious once stain adds color and contrast.</p><h2>A Northeast Florida pre-stain checklist</h2><ul class="checklist"><li><strong>Confirm the surface:</strong> Identify pressure-treated wood, cedar, hardwood, composite or another product before choosing chemistry or pressure.</li><li><strong>Identify the old finish:</strong> Determine whether the deck is bare, weathered, sealed, painted or previously stained.</li><li><strong>Watch the weather window:</strong> Check the stain maker’s temperature, rain and moisture limits instead of relying on a generic number of hours.</li><li><strong>Inspect shaded areas:</strong> Boards near walls, landscaping and covered sections can dry more slowly than open areas.</li></ul><h2>What to verify before the stain can go down</h2><ul class="checklist"><li>The surface is clean without visible active organic buildup.</li><li>Loose coating and damaged wood have been addressed separately from cleaning.</li><li>The wood moisture level meets the stain manufacturer’s instructions when a moisture limit is specified.</li><li>The forecast provides enough time for application and cure under the product instructions.</li></ul><h2>Related guides</h2><ul class="checklist"><li><a href="/learning-center/decks/deck-cleaning-jacksonville/">Deck Cleaning in Jacksonville: Wood, Composite and Trex</a></li><li><a href="/learning-center/house-washing/pressure-washing-before-painting/">Pressure Washing Before Painting</a></li><li><a href="/learning-center/fences/wood-vs-vinyl-fence-cleaning/">Wood Fence vs. Vinyl Fence Cleaning</a></li></ul><p>If you want help determining whether a deck needs routine cleaning or more involved coating preparation, <a href="/contact/">request an exterior-cleaning estimate</a> and include photos of the surface and existing finish.</p>'''
          },
          'learning-center/gutters/gutter-tiger-stripes/index.html': {
            'title': 'Gutter Tiger Stripes: Causes & Gutter Brightening Guide',
            'intro': '''<p><strong>Jacksonville context:</strong> Jacksonville and Northeast Florida gutters deal with frequent rain, humidity, roof runoff and airborne organic debris. That makes it especially important to separate a drainage problem from an exterior appearance problem. Our <a href="/service-areas/jacksonville/">Jacksonville service area</a> covers homes where both issues may be present at the same time.</p>''',
            'block': '''<h2>Why tiger stripes need a different evaluation from gutter debris</h2><p>Tiger stripes are an exterior-face condition, so the first question is whether the gutter coating is still sound. A painted aluminum gutter with bonded surface streaking is a different job from a faded or oxidized gutter where the coating itself has changed. Cleaning may improve removable contamination, but it should not be presented as paint restoration.</p><p>The practical homeowner test is simple: look at drainage and appearance as two separate scopes. Leaves, roof grit and compacted debris affect flow inside the channel. Dark vertical streaks affect the visible face. One service can be completed correctly while the other issue remains.</p><h2>What should be checked before gutter brightening</h2><ul class="checklist"><li><strong>Paint condition:</strong> Look for chalking, fading, peeling or previous abrasion before stronger exterior chemistry is used.</li><li><strong>Streak pattern:</strong> Confirm the marks are on the exterior face rather than overflow staining coming from a drainage problem.</li><li><strong>Nearby finishes:</strong> Painted fascia, siding, windows and landscaping below the gutter can affect how runoff is managed.</li><li><strong>Expectations:</strong> Ask whether the quoted service is a basic exterior wash or a dedicated gutter-brightening treatment.</li></ul><h2>Questions worth asking before service</h2><ul class="checklist"><li>Is interior debris removal included, exterior brightening included, or both?</li><li>Will oxidation or coating wear limit the final appearance?</li><li>Are downspouts being checked for drainage separately from the cosmetic work?</li></ul><h2>Related gutter guides</h2><ul class="checklist"><li><a href="/learning-center/gutters/gutter-cleaning-vs-gutter-brightening/">Gutter Cleaning vs. Gutter Brightening</a></li><li><a href="/learning-center/gutters/interior-gutter-cleaning-vs-exterior-gutter-washing/">Interior Gutter Cleaning vs. Exterior Gutter Washing</a></li><li><a href="/learning-center/cost/gutter-cleaning-cost-jacksonville/">Gutter Cleaning Cost in Jacksonville</a></li></ul><p>If the exterior gutter face is the concern, <a href="/contact/">request a gutter-brightening estimate</a> and send one wide photo plus a close-up of the streaking.</p>'''
          },
          'learning-center/fences/wood-vs-vinyl-fence-cleaning/index.html': {
            'intro': '''<p><strong>Jacksonville context:</strong> Jacksonville and Northeast Florida fences can see strong sun, humidity, irrigation overspray and recurring organic growth, but wood and vinyl do not respond the same way. Start with the material—not the stain color—before choosing pressure or chemistry. See our <a href="/service-areas/jacksonville/">Jacksonville service area</a> for local coverage.</p>''',
            'block': '''<h2>The failure modes are different on wood and vinyl</h2><p>Wood can be physically altered when pressure is too concentrated. Raised fibers, wand marks and uneven erosion can become more visible after the wood dries or receives stain. Vinyl and PVC are not vulnerable in exactly the same way, but aggressive cleaning can still force water through joints, damage weak components or expose oxidation and uneven fading that were previously hidden by dirt.</p><p>That is why a good cleaning plan starts with what can be damaged. On wood, the concern is often the fiber and any existing coating. On vinyl, the concern may be oxidation, brittle components, loose caps, painted sections or staining that is not purely organic.</p><h2>Material-specific inspection checklist</h2><ul class="checklist"><li><strong>Wood:</strong> Check for splintering, loose boards, failing stain, exposed fasteners and soft or deteriorated sections.</li><li><strong>Vinyl/PVC:</strong> Check for chalking, cracks, loose caps, warped panels and irrigation staining.</li><li><strong>Painted fences:</strong> Treat the paint film as the surface being cleaned rather than assuming the substrate controls the method.</li><li><strong>Mixed materials:</strong> Gates, metal hardware, masonry columns and nearby landscaping may require separate handling.</li></ul><h2>How to set realistic expectations</h2><ul class="checklist"><li>Organic growth may clean differently from rust, irrigation minerals or oxidation.</li><li>Cleaning does not replace damaged boards, failed paint or sun-faded vinyl.</li><li>A test area is valuable when the material, coating or previous maintenance history is uncertain.</li></ul><h2>Related fence and surface guides</h2><ul class="checklist"><li><a href="/learning-center/fences/vinyl-fence-cleaning-florida/">Vinyl Fence Cleaning in Florida</a></li><li><a href="/learning-center/fences/fence-cleaning/">Fence Cleaning Jacksonville Guide</a></li><li><a href="/learning-center/patios/patio-cleaning-jacksonville/">Patio Cleaning in Jacksonville</a></li></ul><p>For a fence with mixed staining or an unknown coating, <a href="/contact/">send photos for a fence-cleaning estimate</a> so the material and problem can be separated before quoting.</p>'''
          },
          'learning-center/gutters/clogged-downspout-signs/index.html': {
            'intro': '''<p><strong>Jacksonville context:</strong> Heavy rain in Jacksonville and Northeast Florida can expose a restricted downspout quickly. Leaves, pine needles, roof grit and compacted organic debris may collect at outlets or elbows even when the visible gutter channel does not look completely full. Review our <a href="/service-areas/jacksonville/">Jacksonville service area</a> for local gutter-cleaning coverage.</p>''',
            'block': '''<h2>Where a downspout clog can hide</h2><p>A blockage is not always sitting at the top where it can be seen from a ladder. Debris can bridge over the outlet, lodge at an elbow, compact inside a narrow section or collect where the downspout transitions into an underground drain. That location matters because cleaning the open gutter channel does not automatically clear a restriction farther downstream.</p><p>During rain, the clues are often more useful than a dry visual inspection. Water backing up directly above one outlet, little or no discharge from the bottom of the downspout, or overflow concentrated in one section can all point toward restricted flow. By contrast, water spilling along the entire gutter may indicate a broader capacity, pitch or debris problem.</p><h2>Safe checks before assuming the gutter is fixed</h2><ul class="checklist"><li><strong>Inspect the outlet:</strong> Remove visible material where the gutter feeds the downspout.</li><li><strong>Observe discharge:</strong> Confirm water exits where expected instead of backing up at an elbow.</li><li><strong>Separate underground drains:</strong> A buried drain problem may require different equipment than a normal gutter cleanout.</li><li><strong>Look for repair issues:</strong> Loose sections, crushed downspouts and poor pitch are not solved by debris removal.</li></ul><h2>Warning signs worth documenting</h2><ul class="checklist"><li>Overflow repeatedly occurs at the same outlet.</li><li>Water stains appear on fascia or siding directly below a trouble spot.</li><li>One downspout stays dry while nearby downspouts are flowing.</li><li>Water exits from a joint or seam instead of the bottom outlet.</li></ul><h2>Related gutter guides</h2><ul class="checklist"><li><a href="/learning-center/gutters/how-often-should-gutters-be-cleaned-florida/">How Often Should Gutters Be Cleaned in Florida?</a></li><li><a href="/learning-center/gutters/are-gutter-guards-worth-it-florida/">Are Gutter Guards Worth It in Florida?</a></li><li><a href="/learning-center/gutters/interior-gutter-cleaning-vs-exterior-gutter-washing/">Interior Gutter Cleaning vs. Exterior Gutter Washing</a></li></ul><p>If the overflow location is repeatable, <a href="/contact/">request a gutter-cleaning estimate</a> and include a photo of the outlet and where the downspout discharges.</p>'''
          },
          'learning-center/gutters/gutter-cleaning-vs-gutter-brightening/index.html': {
            'intro': '''<p><strong>Jacksonville context:</strong> On Jacksonville and Northeast Florida homes, the same gutter can have a drainage issue inside the channel and visible streaking outside. Treating those as separate scopes makes quotes easier to compare and prevents a basic cleanout from being mistaken for cosmetic restoration. See the <a href="/service-areas/jacksonville/">Jacksonville service area</a> we cover.</p>''',
            'block': '''<h2>Compare the scope before comparing the price</h2><p>Two gutter quotes can sound similar while covering very different work. A cleanout may focus on leaves, roof grit, outlets and accessible downspouts. Exterior washing may remove loose organic film from the gutter face. Brightening is a more specific appearance-focused treatment for bonded streaking. A useful quote should state which of those tasks is actually included.</p><p>This distinction also protects expectations. A gutter can be draining correctly but still look stained from the street. It can also look bright outside while a hidden outlet restriction remains inside. Neither appearance nor flow proves the other scope has been completed.</p><h2>What each service should answer</h2><ul class="checklist"><li><strong>Interior cleaning:</strong> Is debris removed from the channel and are accessible outlets checked?</li><li><strong>Exterior washing:</strong> Is the face simply rinsed/washed as part of another service or treated separately?</li><li><strong>Brightening:</strong> Are bonded streaks being targeted, and how will oxidation or aged paint affect expectations?</li><li><strong>Downspouts:</strong> Is flow confirmation included, and what happens if the restriction is below grade?</li></ul><h2>Homeowner quote checklist</h2><ul class="checklist"><li>Ask for interior cleaning and exterior appearance work to be listed as separate line items or clearly defined inclusions.</li><li>Ask whether debris is collected or left on the property.</li><li>Ask whether photos are provided when roofline areas cannot be inspected from the ground.</li></ul><h2>Related gutter guides</h2><ul class="checklist"><li><a href="/learning-center/gutters/gutter-tiger-stripes/">What Are Gutter Tiger Stripes?</a></li><li><a href="/learning-center/gutters/interior-gutter-cleaning-vs-exterior-gutter-washing/">Interior Gutter Cleaning vs. Exterior Gutter Washing</a></li><li><a href="/learning-center/cost/gutter-cleaning-cost-jacksonville/">Gutter Cleaning Cost in Jacksonville</a></li></ul><p>To compare the correct scope for your home, <a href="/contact/">request a gutter estimate</a> and specify whether the priority is drainage, exterior appearance or both.</p>'''
          },
          'learning-center/roof-cleaning/can-you-pressure-wash-roof-shingles/index.html': {
            'title': 'Can You Pressure Wash Roof Shingles? | Florida Roof Guide',
            'intro': '''<p><strong>Jacksonville context:</strong> Asphalt-shingle roofs in Jacksonville and Northeast Florida can develop dark organic streaking in a humid Florida climate, but the presence of staining does not make high pressure appropriate. Roof material and manufacturer guidance should control the cleaning method. See our <a href="/service-areas/jacksonville/">Jacksonville service area</a> for local roof-cleaning coverage.</p>''',
            'block': '''<h2>Why shingles should be evaluated as a roofing product, not flatwork</h2><p>A driveway is designed to tolerate foot and vehicle traffic on a dense cement surface. Asphalt shingles are layered roofing components with granules, seal strips, edges and flashings that perform as a system. Cleaning decisions should protect that system rather than simply remove discoloration as quickly as possible.</p><p>Visible black streaks may be organic growth, but a roof can also show granule loss, age-related color change, repairs or previous cleaning marks. Those conditions should be separated before anyone promises that washing will make the roof look uniformly new.</p><h2>What to inspect before an asphalt-shingle roof is cleaned</h2><ul class="checklist"><li><strong>Roof age and condition:</strong> Look for curling, missing tabs, exposed mat, repairs or obvious deterioration.</li><li><strong>Streak pattern:</strong> Distinguish organic staining from areas where shingles are physically worn or replaced.</li><li><strong>Runoff path:</strong> Identify gutters, landscaping, siding, hardscape and pool areas below the roof.</li><li><strong>Manufacturer instructions:</strong> Follow roof-product cleaning guidance when it is available.</li></ul><h2>Questions a homeowner should ask</h2><ul class="checklist"><li>What pressure reaches the shingles during the cleaning process?</li><li>How are plants and surfaces below the roof protected from runoff?</li><li>What roof defects would cause the cleaner to stop and recommend a roofer instead?</li></ul><h2>Related roof-cleaning guides</h2><ul class="checklist"><li><a href="/learning-center/roof-cleaning/asphalt-shingle-roof-cleaning/">Asphalt Shingle Roof Cleaning</a></li><li><a href="/learning-center/roof-cleaning/soft-washing-roof-vs-pressure-washing/">Soft Washing a Roof vs. Pressure Washing</a></li><li><a href="/learning-center/roof-cleaning/black-roof-streaks-algae-removal/">Black Roof Streaks in Florida</a></li></ul><p>If you are unsure whether the discoloration is cleanable staining or roof deterioration, <a href="/contact/">request a roof-cleaning estimate</a> and include wide photos plus close-ups of any damaged areas.</p>'''
          },
          'learning-center/roof-cleaning/metal-roof-cleaning-florida/index.html': {
            'intro': '''<p><strong>Jacksonville context:</strong> In Jacksonville and Northeast Florida, painted metal roofs may face humidity, pollen, organic film and—closer to the coast—salt deposits. The Florida environment matters, but the coating system still determines what can safely be used. Our <a href="/service-areas/jacksonville/">Jacksonville service area</a> includes inland and coastal properties.</p>''',
            'block': '''<h2>The coating is often more important than the metal underneath</h2><p>“Metal roof” describes the substrate, not the finish. Factory-painted panels, field-applied coatings, bare metal details and older oxidized finishes can respond differently to the same cleaner. A durable panel can still have a coating that is sensitive to strong chemistry, abrasion or concentrated pressure.</p><p>That is also why oxidation should be discussed before cleaning. Chalky residue or fading can become more noticeable after surface dirt is removed. Routine roof washing can remove compatible contamination, but it should not be sold as a way to restore a weathered coating to its original color.</p><h2>Metal-roof inspection points that change the cleaning plan</h2><ul class="checklist"><li><strong>Panel system:</strong> Note standing-seam versus exposed-fastener construction and visible penetrations.</li><li><strong>Coating condition:</strong> Look for chalking, fading, peeling, corrosion or previous touch-up areas.</li><li><strong>Fasteners and seams:</strong> Cleaning does not correct failed washers, loose fasteners or leaking penetrations.</li><li><strong>Runoff:</strong> Plan for gutters, landscaping, siding, hardscape and nearby pool areas below the work.</li></ul><h2>Questions worth answering before cleaning starts</h2><ul class="checklist"><li>Is the discoloration organic buildup, oxidation, corrosion or a mixture?</li><li>Does the roof or coating manufacturer publish cleaning restrictions?</li><li>Are there fragile skylights, solar attachments, sealants or repairs that change access?</li></ul><h2>Related roof guides</h2><ul class="checklist"><li><a href="/learning-center/roof-cleaning/soft-washing-roof-vs-pressure-washing/">Soft Washing a Roof vs. Pressure Washing</a></li><li><a href="/learning-center/roof-cleaning/tile-roof-cleaning-florida/">Tile Roof Cleaning in Florida</a></li><li><a href="/learning-center/roof-cleaning/how-long-does-roof-cleaning-last/">How Long Does Roof Cleaning Last in Florida?</a></li></ul><p>For an older or oxidized metal roof, <a href="/contact/">request a roof-cleaning estimate</a> with photos that show both the overall roof and the coating condition up close.</p>'''
          },
          'learning-center/roof-cleaning/tile-roof-cleaning-florida/index.html': {
            'intro': '''<p><strong>Jacksonville context:</strong> Tile roofs around Jacksonville and Northeast Florida can collect organic staining in Florida’s humid climate, but clay tile, concrete tile, coatings and repair history can change the cleaning limits. A local roof-cleaning plan should start with the actual tile system. See our <a href="/service-areas/jacksonville/">Jacksonville service area</a>.</p>''',
            'block': '''<h2>Clay tile and concrete tile should not be treated as identical</h2><p>Both are commonly described as “tile roofs,” yet their surface condition, porosity, coatings and age can differ. A glazed or coated tile can react differently from an older uncoated concrete tile. Before choosing chemistry or pressure, identify the material and inspect whether the visible finish is intact.</p><p>Broken or displaced tiles are also a roofing condition, not a cleaning problem. If access requires moving across the roof, existing cracks and fragile areas matter because a cleaning plan should not create a repair issue while trying to improve appearance.</p><h2>Tile-roof conditions to document before cleaning</h2><ul class="checklist"><li><strong>Tile type and finish:</strong> Identify clay versus concrete and note coatings, glaze or previous treatments.</li><li><strong>Cracked or loose pieces:</strong> Photograph visible damage before work begins.</li><li><strong>Valleys and penetrations:</strong> Note areas where debris, runoff or previous repairs concentrate.</li><li><strong>Below-roof surfaces:</strong> Landscaping, gutters, siding, patios and pool areas all influence runoff management.</li></ul><h2>Questions that separate cleaning from repair</h2><ul class="checklist"><li>Are the dark areas removable organic staining or permanent color variation?</li><li>Is the roof safe to access without stressing damaged tiles?</li><li>Would a roofing contractor need to address broken pieces before cleaning?</li></ul><h2>Related roof-cleaning guides</h2><ul class="checklist"><li><a href="/learning-center/roof-cleaning/soft-washing-roof-vs-pressure-washing/">Soft Washing a Roof vs. Pressure Washing</a></li><li><a href="/learning-center/roof-cleaning/metal-roof-cleaning-florida/">Metal Roof Cleaning in Florida</a></li><li><a href="/learning-center/roof-cleaning/black-roof-streaks-algae-removal/">Black Roof Streaks in Florida</a></li></ul><p>If the roof has mixed staining, repairs or an unknown coating, <a href="/contact/">request a roof-cleaning estimate</a> and send photos before anyone recommends a method.</p>'''
          },
          'learning-center/gutters/interior-gutter-cleaning-vs-exterior-gutter-washing/index.html': {
            'title': 'Interior Gutter Cleaning vs Exterior Gutter Washing',
            'intro': '''<p><strong>Jacksonville context:</strong> Jacksonville and Northeast Florida homes often need gutter work for two different reasons: water flow and curb appeal. Interior debris affects drainage; exterior staining affects appearance. Keeping those scopes separate makes it easier to compare quotes. See our <a href="/service-areas/jacksonville/">Jacksonville service area</a>.</p>''',
            'block': '''<h2>Interior service should be judged by drainage, not by curb appeal</h2><p>The inside of a gutter can contain leaves, pine needles, roof grit and compacted debris that are barely visible from the ground. A useful interior cleanout focuses on restoring an open channel, clearing accessible outlets and confirming that water has a path into the downspout. Exterior color does not prove whether that work was completed.</p><p>Likewise, a bright gutter face does not prove the downspout is open. Exterior washing targets the visible surface and may be performed with a house wash or as a separate service. Bonded streaking may require dedicated brightening beyond routine washing.</p><h2>What to include when requesting a quote</h2><ul class="checklist"><li><strong>Interior debris:</strong> Ask whether leaves and roof grit are physically removed and how cleanup is handled.</li><li><strong>Downspout checks:</strong> Confirm whether accessible outlets and discharge are evaluated.</li><li><strong>Exterior face:</strong> Ask whether washing the visible gutter is included or excluded.</li><li><strong>Tiger stripes:</strong> Clarify whether dedicated brightening is a separate add-on.</li></ul><h2>How to tell which service you actually need</h2><ul class="checklist"><li>Overflow or standing water points toward a drainage evaluation first.</li><li>Dark streaks with normal drainage point toward exterior appearance work.</li><li>Both problems can exist at the same time and should be quoted as separate scopes.</li></ul><h2>Related gutter guides</h2><ul class="checklist"><li><a href="/learning-center/gutters/gutter-cleaning-vs-gutter-brightening/">Gutter Cleaning vs. Gutter Brightening</a></li><li><a href="/learning-center/gutters/gutter-tiger-stripes/">Gutter Tiger Stripes & Brightening</a></li><li><a href="/learning-center/gutters/how-often-should-gutters-be-cleaned-florida/">How Often Should Gutters Be Cleaned in Florida?</a></li></ul><p>For a quote that separates drainage from appearance work, <a href="/contact/">request a gutter estimate</a> and tell us which problem you are seeing from the ground.</p>'''
          },
          'learning-center/house-washing/vinyl-siding-oxidation-house-washing/index.html': {
            'title': 'Vinyl Siding Oxidation: What House Washing Can Reveal',
            'intro': '''<p><strong>Jacksonville context:</strong> Strong sun, heat and humidity in Jacksonville and Northeast Florida can make oxidation and fading more noticeable on older vinyl siding. Florida weather can contribute to the condition, but oxidation is not the same thing as removable dirt. See our <a href="/service-areas/jacksonville/">Jacksonville service area</a>.</p>''',
            'block': '''<h2>A cleaner surface can make an old finish problem easier to see</h2><p>Oxidation is often described as a chalky residue or uneven faded appearance on the siding face. Dirt and organic growth can partially mask that condition. After ordinary soil is removed, the underlying color variation may stand out more clearly. That does not automatically mean the cleaning created the oxidation.</p><p>The important distinction is between cleaning and restoration. A normal house wash is intended to remove compatible surface contamination. Correcting severe oxidation, restoring faded color or removing embedded streaking may require a different process and should be quoted with different expectations.</p><h2>What to inspect before washing oxidized-looking siding</h2><ul class="checklist"><li><strong>Chalk transfer:</strong> A light wipe on an inconspicuous area can help reveal powdery surface oxidation.</li><li><strong>Sun exposure:</strong> Compare shaded and sun-facing walls for uneven fading.</li><li><strong>Previous repairs:</strong> Replacement panels may be newer and therefore a different color.</li><li><strong>Painted components:</strong> Shutters, trim and doors can have different coatings from the vinyl itself.</li></ul><h2>Set expectations before the entire wall is cleaned</h2><ul class="checklist"><li>Use a small test area when oxidation is obvious or the siding history is unknown.</li><li>Do not promise that routine washing will restore faded material to factory color.</li><li>Document pre-existing chalking, streaking and color mismatch before service.</li></ul><h2>Related house-washing guides</h2><ul class="checklist"><li><a href="/learning-center/house-washing/can-you-pressure-wash-vinyl-siding/">Can You Pressure Wash Vinyl Siding?</a></li><li><a href="/learning-center/house-washing/what-does-professional-house-wash-include/">What Does a Professional House Wash Include?</a></li><li><a href="/learning-center/house-washing/why-green-algae-keeps-coming-back-on-siding/">Why Green Algae Keeps Coming Back on Siding</a></li></ul><p>If you see chalking or uneven fading before service, <a href="/contact/">request a house-washing estimate</a> and send close-up photos so cleaning and oxidation can be discussed separately.</p>'''
          },
          'learning-center/house-washing/what-does-professional-house-wash-include/index.html': {
            'title': 'What Does a Professional House Wash Include? | Jacksonville',
            'intro': '''<p><strong>Jacksonville context:</strong> A professional house wash in Jacksonville and Northeast Florida should be defined by surfaces and scope—not by one generic spray method. Florida homes may combine stucco, vinyl, fiber cement, painted trim, soffits and other finishes on the same elevation. See our <a href="/service-areas/jacksonville/">Jacksonville service area</a>.</p>''',
            'block': '''<h2>The quote should define what “house wash” actually means</h2><p>One contractor may use “house wash” to mean siding only. Another may include exterior faces of soffits, fascia and trim. Windows may be rinsed as part of the process without being detailed as a separate window-cleaning service. The homeowner should not have to guess. A written scope should identify the surfaces being cleaned and any exclusions.</p><p>That written scope is especially useful on homes with mixed materials. Stucco walls, vinyl siding, painted doors, stained wood, screens and masonry accents do not automatically receive the same pressure or chemistry. A professional process adapts to the material instead of forcing one setting across the entire exterior.</p><h2>What a clear house-wash scope should address</h2><ul class="checklist"><li><strong>Primary walls:</strong> Identify siding, stucco, painted masonry or fiber-cement surfaces being washed.</li><li><strong>Roofline surfaces:</strong> State whether accessible soffits, fascia and exterior gutter faces are included.</li><li><strong>Property protection:</strong> Note plants, exterior electrical components, cameras, door hardware and other sensitive items.</li><li><strong>Stain limitations:</strong> Separate normal organic buildup from rust, oxidation, paint failure and other specialty conditions.</li></ul><h2>Questions to ask before approving the quote</h2><ul class="checklist"><li>Which surfaces are included and specifically excluded?</li><li>How will the cleaning method change between stucco, siding and painted trim?</li><li>Are specialty stains evaluated before the job or after basic washing?</li></ul><h2>Related house-washing guides</h2><ul class="checklist"><li><a href="/learning-center/house-washing/soft-washing-vs-pressure-washing-a-house/">Soft Washing vs. Pressure Washing a House</a></li><li><a href="/learning-center/house-washing/soffit-fascia-cleaning-jacksonville/">Soffit & Fascia Cleaning in Jacksonville</a></li><li><a href="/learning-center/house-washing/house-washing-companies-near-me/">House Washing Companies Near Me</a></li></ul><p>For a property-specific scope, <a href="/contact/">request a house-washing estimate</a> and include wide photos showing each side of the home.</p>'''
          },
          'learning-center/driveways/how-to-remove-tire-marks-concrete-driveway/index.html': {
            'intro': '''<p><strong>Jacksonville context:</strong> Tire marks on Jacksonville and Northeast Florida driveways can be ordinary rubber transfer, heat-related discoloration or a reaction with a sealer/coating. Florida heat can make vehicle-related marks more noticeable, so identify the concrete finish before choosing pressure or chemistry. See our <a href="/service-areas/jacksonville/">Jacksonville service area</a>.</p>''',
            'block': '''<h2>Start by identifying the driveway finish</h2><p>Bare broom-finished concrete is a different surface from painted concrete, epoxy, a clear topical sealer or a decorative coating. A black mark that looks removable on bare concrete may actually be embedded in or reacting with a coating. Before increasing pressure, determine what finish is present and whether the mark changes when the surface is wet.</p><p>Fresh rubber transfer can sometimes respond to a compatible cleaner, agitation and controlled rinsing. Older or heat-related marks may leave a shadow. If the slab is sealed, the treatment must also protect the sealer; otherwise the “clean” area can become a lighter damaged patch that looks worse than the original mark.</p><h2>What to check before treating tire marks</h2><ul class="checklist"><li><strong>Surface type:</strong> Bare concrete, sealed concrete and coatings require different decisions.</li><li><strong>Age of the mark:</strong> Fresh transfer may behave differently from long-term discoloration.</li><li><strong>Existing wear:</strong> Look for previous wand marks, etching, spalling or sealer failure.</li><li><strong>Test area:</strong> Start small before expanding chemistry or pressure across the driveway.</li></ul><h2>Avoid these common mistakes</h2><ul class="checklist"><li>Do not chase a stubborn black mark with a narrow high-pressure tip.</li><li>Do not assume every dark mark is rubber; oil and other vehicle fluids can look similar.</li><li>Do not use an aggressive solvent on an unknown sealer or coating without compatibility guidance.</li></ul><h2>Related concrete guides</h2><ul class="checklist"><li><a href="/learning-center/driveways/driveway-pressure-washing/">Driveway Pressure Washing Process Guide</a></li><li><a href="/learning-center/driveways/oil-stains-on-concrete/">Oil Stains on Concrete</a></li><li><a href="/learning-center/comparisons/can-pressure-washing-damage-concrete/">Can Pressure Washing Damage Concrete?</a></li></ul><p>If you are unsure whether the mark is rubber, oil or coating damage, <a href="/contact/">request a concrete-cleaning estimate</a> and include a close-up plus a wide driveway photo.</p>'''
          },
          'learning-center/comparisons/can-pressure-washing-damage-concrete/index.html': {
            'title': 'Can Pressure Washing Damage Concrete? | Etching & Surface Marks',
            'intro': '''<p><strong>Jacksonville context:</strong> Concrete driveways and sidewalks in Jacksonville and Northeast Florida are often cleaned repeatedly over their service life. Florida sun, moisture, previous sealers and earlier cleaning can all affect what is visible before the next wash. See our <a href="/service-areas/jacksonville/">Jacksonville service area</a> for local concrete-cleaning coverage.</p>''',
            'block': '''<h2>Differentiate cleaning marks from pre-existing concrete defects</h2><p>Not every line or light patch seen after washing was created during that cleaning. Concrete may already have curing variation, repairs, sealers, tire wear, old pressure marks, scaling or aggregate exposure. Photographing the slab before work is useful because removing surface dirt can reveal differences that were already there.</p><p>Actual pressure damage usually follows the path of the equipment: wand arcs, narrow stripes, concentrated edge marks or repeating surface-cleaner patterns. The important point is that once cement paste has been mechanically removed, additional cleaning cannot replace it.</p><h2>Why PSI alone does not tell you whether the process is safe</h2><ul class="checklist"><li><strong>Nozzle and distance:</strong> The same machine can deliver very different force depending on tip and working distance.</li><li><strong>Flow and equipment:</strong> Surface-cleaner size, nozzle setup and travel speed affect consistency.</li><li><strong>Concrete condition:</strong> Weak, young, scaled or previously coated concrete needs more caution.</li><li><strong>Stain type:</strong> Rust, oil and tire marks may need chemistry rather than more mechanical force.</li></ul><h2>What to document before cleaning</h2><ul class="checklist"><li>Existing cracks, patches, spalling and exposed aggregate.</li><li>Topical sealer, paint or other coatings.</li><li>Old wand lines or circular cleaning patterns.</li><li>Sections that remain darker or lighter when the slab is dry.</li></ul><h2>Related concrete guides</h2><ul class="checklist"><li><a href="/learning-center/driveways/driveway-pressure-washing/">Driveway Pressure Washing: Professional Process</a></li><li><a href="/learning-center/driveways/oil-stains-on-concrete/">Can Pressure Washing Remove Oil Stains?</a></li><li><a href="/learning-center/driveways/how-to-remove-tire-marks-concrete-driveway/">How to Remove Tire Marks From Concrete</a></li></ul><p>For older, patched or previously sealed concrete, <a href="/contact/">request a concrete-cleaning estimate</a> and send photos of any questionable areas before the work is scheduled.</p>'''
          },
          'learning-center/fences/vinyl-fence-cleaning-florida/index.html': {
            'intro': '''<p><strong>Jacksonville context:</strong> Vinyl and PVC fences in Jacksonville and Northeast Florida can develop green organic buildup quickly in shaded, humid areas, while Florida sun and irrigation can create separate fading or mineral-stain issues. Cleaning works best when those conditions are identified separately. See our <a href="/service-areas/jacksonville/">Jacksonville service area</a>.</p>''',
            'block': '''<h2>Green growth, oxidation and irrigation stains are different problems</h2><p>A fence that looks generally green may respond well to a surface-safe organic cleaning process. Chalky white residue, uneven fading or orange irrigation staining tells a different story. Stronger pressure is not a universal solution because it may leave the non-organic condition unchanged while increasing the chance of marks around seams, posts or accessories.</p><p>Vinyl fences also include more than broad flat panels. Caps, decorative inserts, gates, hinges, fasteners and sections next to masonry or landscaping may need different handling. A good inspection identifies those transitions before the entire run is cleaned.</p><h2>Vinyl-fence inspection checklist</h2><ul class="checklist"><li><strong>Panel condition:</strong> Look for cracks, warping, loose sections and brittle components.</li><li><strong>Surface residue:</strong> Separate green growth from chalking, rust or hard-water deposits.</li><li><strong>Hardware:</strong> Note metal hinges, screws and latches that can stain surrounding vinyl.</li><li><strong>Irrigation:</strong> Check whether sprinkler overspray is repeatedly hitting the same panels.</li></ul><h2>What cleaning should and should not be expected to do</h2><ul class="checklist"><li>Remove compatible surface dirt and organic buildup without treating the fence like concrete.</li><li>Improve appearance without claiming to reverse sun fading or aged material.</li><li>Identify specialty stains that may require separate treatment or may remain visible.</li></ul><h2>Related fence guides</h2><ul class="checklist"><li><a href="/learning-center/fences/wood-vs-vinyl-fence-cleaning/">Wood Fence vs. Vinyl Fence Cleaning</a></li><li><a href="/learning-center/fences/fence-cleaning/">Fence Cleaning Jacksonville Guide</a></li><li><a href="/learning-center/comparisons/does-pressure-washing-remove-mold-mildew-algae/">Does Pressure Washing Remove Mold, Mildew & Algae?</a></li></ul><p>For a fence with mixed green growth and irrigation staining, <a href="/contact/">request a fence-cleaning estimate</a> and send photos from both the shaded and sun-facing sides.</p>'''
          },
          'learning-center/house-washing/can-you-pressure-wash-stucco/index.html': {
            'title': 'Can You Pressure Wash Stucco? | Florida Soft-Wash Guide',
            'meta': 'Learn when stucco can be pressure washed, why painted and textured finishes need controlled cleaning, and what Florida homeowners should inspect first.',
            'intro': '''<p><strong>Jacksonville context:</strong> Stucco homes are common throughout Jacksonville and Northeast Florida, where Florida humidity can support recurring organic growth. The cleaning method should still be based on paint condition, cracks, texture and water-entry risk—not simply on how dirty the wall looks. See our <a href="/service-areas/jacksonville/">Jacksonville service area</a>.</p>''',
            'block': '''<h2>“Stucco” can describe several different visible finishes</h2><p>The wall may be traditional cement stucco, a painted stucco surface, a textured coating or another exterior system that resembles stucco from the ground. The visible coating is often the part most affected by cleaning. If paint is chalking, peeling or poorly bonded, ordinary washing can reveal those conditions even when the underlying stucco is sound.</p><p>Cracks and penetrations matter too. Windows, doors, light fixtures, hose bibs and wall openings create places where directing water aggressively at the wall is unnecessary. The goal is to remove compatible contamination while controlling pressure and runoff around vulnerable details.</p><h2>Stucco conditions to inspect before washing</h2><ul class="checklist"><li><strong>Paint condition:</strong> Look for chalking, peeling, blistering or mismatched repair areas.</li><li><strong>Cracks:</strong> Note open cracks and failed sealant around windows or penetrations.</li><li><strong>Texture:</strong> Rough finishes can hold organic buildup without needing concrete-level pressure.</li><li><strong>Stain type:</strong> Rust, irrigation minerals and oxidation may require a different treatment from algae.</li></ul><h2>Questions to ask before cleaning starts</h2><ul class="checklist"><li>Will the wall be cleaned with controlled pressure appropriate for the finish?</li><li>How will electrical fixtures, doors, windows and landscaping be protected?</li><li>What existing paint or stucco conditions may remain visible afterward?</li></ul><h2>Related house-washing guides</h2><ul class="checklist"><li><a href="/learning-center/house-washing/is-soft-washing-safe-for-stucco-and-siding/">Is Soft Washing Safe for Stucco and Siding?</a></li><li><a href="/learning-center/house-washing/what-is-soft-washing/">What Is Soft Washing?</a></li><li><a href="/learning-center/house-washing/soft-washing-vs-pressure-washing-a-house/">Soft Washing vs. Pressure Washing a House</a></li></ul><p>If the stucco has cracks, chalking or recent paint repairs, <a href="/contact/">request a house-washing estimate</a> and include close-up photos before cleaning.</p>'''
          },
          'learning-center/pool-areas/pool-cage-vs-screen-enclosure-cleaning/index.html': {
            'title': 'Pool Cage vs Screen Enclosure Cleaning | Florida Guide',
            'intro': '''<p><strong>Jacksonville context:</strong> Pool cages and screen enclosures in Jacksonville and Northeast Florida collect humidity-driven organic buildup, pollen and spider debris, but Florida sun can also expose oxidation on painted aluminum frames. Cleaning should protect both the screen material and the frame finish. See our <a href="/service-areas/jacksonville/">Jacksonville service area</a>.</p>''',
            'block': '''<h2>The screen and the frame are two different cleaning surfaces</h2><p>A pool enclosure may look like one structure, but the mesh, spline, painted aluminum, fasteners, doors and roof panels can all have different limits. Screens can be stretched or damaged by unnecessarily concentrated pressure. Painted frames may have chalking or oxidation that becomes more obvious once loose organic film is removed.</p><p>The cleaning scope should also identify whether the pool deck is included. Washing frames and screens does not automatically mean the surrounding concrete, pavers, coping or furniture areas are part of the job. Separating those surfaces helps homeowners compare quotes accurately.</p><h2>What to inspect around a pool enclosure</h2><ul class="checklist"><li><strong>Screen condition:</strong> Note tears, loose spline, brittle sections and patched areas.</li><li><strong>Frame finish:</strong> Look for oxidation, fading, corrosion and previous touch-up paint.</li><li><strong>Pool water:</strong> Plan runoff and rinsing so treatment is not unnecessarily directed into the pool.</li><li><strong>Deck material:</strong> Concrete, pavers and coated decks may need different cleaning methods.</li></ul><h2>Scope questions before the estimate is approved</h2><ul class="checklist"><li>Are both inside and outside faces accessible and included?</li><li>Are the enclosure roof panels/screens included or only vertical walls?</li><li>Is the pool deck a separate service?</li><li>How will fragile screens or oxidized frame sections be handled?</li></ul><h2>Related pool-area guides</h2><ul class="checklist"><li><a href="/learning-center/pool-areas/pool-deck-pool-cage-screen-enclosure-cleaning/">Pool Deck, Pool Cage & Screen Enclosure Cleaning</a></li><li><a href="/learning-center/patios/patio-cleaning-jacksonville/">Patio Cleaning in Jacksonville</a></li><li><a href="/learning-center/house-washing/what-is-soft-washing/">What Is Soft Washing?</a></li></ul><p>For an enclosure with torn screens, oxidation or a separate deck-cleaning need, <a href="/contact/">request a pool-area cleaning estimate</a> and send photos of the frame, screens and deck.</p>'''
          },
          'learning-center/roof-cleaning/asphalt-shingle-roof-cleaning/index.html': {
            'intro': '''<p><strong>Jacksonville context:</strong> In Jacksonville and Northeast Florida, asphalt shingles can develop dark organic staining under Florida humidity and shade. The correct response is not to treat the roof like concrete; the roof system, age and manufacturer guidance should lead the cleaning plan. See our <a href="/service-areas/jacksonville/">Jacksonville service area</a>.</p>''',
            'block': '''<h2>Black streak removal and roof restoration are not the same promise</h2><p>Organic streaking can often be addressed without claiming that cleaning will reverse age-related color variation, granule loss, repairs or faded shingles. A roof with replacement patches or uneven sun exposure may still show color differences after the removable staining is gone. Setting that expectation before work is more useful than promising a uniformly “new” appearance.</p><p>Granules also matter because they are part of the shingle surface. A cleaning method should avoid unnecessary mechanical abrasion. When a roof already shows exposed mat, missing tabs, curling or significant wear, a roofing evaluation may be more important than cosmetic cleaning.</p><h2>Asphalt-shingle pre-cleaning checklist</h2><ul class="checklist"><li><strong>Condition:</strong> Note missing, lifted, curled or heavily worn shingles.</li><li><strong>Repairs:</strong> Identify newer patches that may remain a different color.</li><li><strong>Runoff:</strong> Map gutters, landscaping, siding, patios and pool areas below the roof.</li><li><strong>Manufacturer guidance:</strong> Follow published cleaning limits when the shingle product can be identified.</li></ul><h2>What homeowners should ask a roof cleaner</h2><ul class="checklist"><li>How is high mechanical pressure avoided on the shingle surface?</li><li>What is the plan for plant and property protection below the roof?</li><li>Which visible conditions are staining versus permanent roof wear?</li></ul><h2>Related asphalt-roof guides</h2><ul class="checklist"><li><a href="/learning-center/roof-cleaning/can-you-pressure-wash-roof-shingles/">Can You Pressure Wash Roof Shingles?</a></li><li><a href="/learning-center/roof-cleaning/black-roof-streaks-algae-removal/">Black Roof Streaks in Florida</a></li><li><a href="/learning-center/roof-cleaning/soft-washing-roof-vs-pressure-washing/">Soft Washing a Roof vs. Pressure Washing</a></li></ul><p>For a roof with repairs, granule loss or uneven discoloration, <a href="/contact/">request a roof-cleaning estimate</a> and include photos that show those areas before service.</p>'''
          },
          'learning-center/roof-cleaning/how-long-does-roof-cleaning-last/index.html': {
            'meta': 'Learn how long roof cleaning can last in Florida and how shade, trees, roof material, moisture and recurring algae affect when streaks return.',
            'intro': '''<p><strong>Jacksonville context:</strong> There is no single cleaning interval for every Jacksonville or Northeast Florida roof. Florida humidity, shade, nearby trees, roof material and the amount of moisture a roof holds all influence how quickly visible organic staining returns. See our <a href="/service-areas/jacksonville/">Jacksonville service area</a>.</p>''',
            'block': '''<h2>Think in conditions, not a universal calendar</h2><p>Two homes on the same street can age differently after roof cleaning. A roof with open sun and good drying may stay visually cleaner longer than a roof shaded by mature trees. North-facing sections, valleys and areas below overhanging branches can also show returning discoloration before the rest of the roof.</p><p>Roof material changes the comparison too. Asphalt shingles, concrete tile, clay tile and coated metal do not have identical surface characteristics. The appropriate cleaning method and what “clean” looks like should be established first; only then does it make sense to discuss how long the result may remain visible.</p><h2>Factors that can shorten the clean-looking period</h2><ul class="checklist"><li><strong>Persistent shade:</strong> Slower drying can support recurring organic growth.</li><li><strong>Tree coverage:</strong> Leaves, pollen and debris can hold moisture against roof surfaces.</li><li><strong>Roof geometry:</strong> Valleys and low-airflow areas may stay damp longer.</li><li><strong>Material and condition:</strong> Rough, aged or previously coated surfaces may weather differently.</li></ul><h2>What to monitor after a roof is cleaned</h2><ul class="checklist"><li>Watch where streaking returns first instead of waiting for the entire roof to look dark.</li><li>Keep gutters and drainage paths functioning so debris and water do not accumulate unnecessarily.</li><li>Separate new organic staining from permanent fading, repairs or coating wear.</li></ul><h2>Related roof-cleaning guides</h2><ul class="checklist"><li><a href="/learning-center/roof-cleaning/black-roof-streaks-algae-removal/">Black Roof Streaks in Florida</a></li><li><a href="/learning-center/roof-cleaning/soft-washing-roof-vs-pressure-washing/">Soft Washing a Roof vs. Pressure Washing</a></li><li><a href="/learning-center/roof-cleaning/best-roof-cleaning-companies-jacksonville/">Best Roof Cleaning Companies in Jacksonville</a></li></ul><p>If you are trying to decide whether current streaking is enough to justify another cleaning, <a href="/contact/">request a roof-cleaning estimate</a> and send a current roof photo.</p>'''
          },
          }

          assert len(upgrades) == 18, len(upgrades)
          marker = '<!-- lc-depth-upgrade-20260817 -->'

          def strip_tags(value):
              value = re.sub(r'<script\b[^>]*>.*?</script>', ' ', value, flags=re.S|re.I)
              value = re.sub(r'<style\b[^>]*>.*?</style>', ' ', value, flags=re.S|re.I)
              value = re.sub(r'<[^>]+>', ' ', value)
              return re.sub(r'\s+', ' ', html.unescape(value)).strip()

          for filename, cfg in upgrades.items():
              p = Path(filename)
              if not p.exists(): raise SystemExit(f'Missing target {filename}')
              s = p.read_text(encoding='utf-8')
              if marker in s: raise SystemExit(f'Already upgraded {filename}')

              if 'title' in cfg:
                  s = re.sub(r'<title>.*?</title>', f'<title>{cfg["title"]}</title>', s, count=1, flags=re.S|re.I)
                  s = re.sub(r'(<meta property="og:title" content=")[^"]*(")', lambda m:m.group(1)+cfg['title']+m.group(2), s, count=1, flags=re.I)
                  s = re.sub(r'(<meta name="twitter:title" content=")[^"]*(")', lambda m:m.group(1)+cfg['title']+m.group(2), s, count=1, flags=re.I)
              if 'meta' in cfg:
                  s = re.sub(r'(<meta name="description" content=")[^"]*(")', lambda m:m.group(1)+cfg['meta']+m.group(2), s, count=1, flags=re.I)
                  s = re.sub(r'(<meta property="og:description" content=")[^"]*(")', lambda m:m.group(1)+cfg['meta']+m.group(2), s, count=1, flags=re.I)
                  s = re.sub(r'(<meta name="twitter:description" content=")[^"]*(")', lambda m:m.group(1)+cfg['meta']+m.group(2), s, count=1, flags=re.I)

              qm = re.search(r'(<p class="quick-answer">.*?</p>)', s, re.S|re.I)
              if not qm: raise SystemExit(f'Missing quick answer {filename}')
              s = s[:qm.end()] + marker + cfg['intro'] + s[qm.end():]

              insertion = cfg['block']
              note = re.search(r'<p class="article-note">', s, re.I)
              if note:
                  s = s[:note.start()] + insertion + s[note.start():]
              else:
                  related = re.search(r'<div class="related">', s, re.I)
                  if not related: raise SystemExit(f'Missing insertion point {filename}')
                  s = s[:related.start()] + insertion + s[related.start():]

              # Keep WebPage/BlogPosting descriptions aligned with updated meta where changed,
              # and update truthful visible article word count in BlogPosting schema.
              article_m = re.search(r'<div class="article-content"[^>]*>(.*?)(?:</div>\s*</article>)', s, re.S|re.I)
              if not article_m: raise SystemExit(f'Cannot measure article body {filename}')
              wc = len(re.findall(r"[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)?", strip_tags(article_m.group(1))))

              script_re = re.compile(r'(<script\s+type="application/ld\+json"[^>]*>)(.*?)(</script>)', re.S|re.I)
              scripts = list(script_re.finditer(s))
              replacements=[]
              for sm in scripts:
                  try: data=json.loads(sm.group(2))
                  except Exception as exc: raise SystemExit(f'Invalid JSON-LD {filename}: {exc}')
                  nodes=data.get('@graph') if isinstance(data,dict) and isinstance(data.get('@graph'),list) else ([data] if isinstance(data,dict) else [])
                  touched=False
                  for node in nodes:
                      if not isinstance(node,dict): continue
                      if node.get('@type') == 'BlogPosting':
                          node['wordCount']=wc
                          node['dateModified']='2026-08-17'
                          if 'meta' in cfg: node['description']=cfg['meta']
                          touched=True
                      if node.get('@type') == 'WebPage':
                          node['dateModified']='2026-08-17'
                          if 'meta' in cfg: node['description']=cfg['meta']
                          touched=True
                  if touched:
                      rendered=sm.group(1)+json.dumps(data,ensure_ascii=False,separators=(',',':'))+sm.group(3)
                      replacements.append((sm.start(),sm.end(),rendered))
              for a,b,rendered in reversed(replacements):
                  s=s[:a]+rendered+s[b:]

              s = re.sub(r'(<meta property="article:modified_time" content=")[^"]*(")', r'\g<1>2026-08-17\2', s, count=1, flags=re.I)
              p.write_text(s, encoding='utf-8')
              print(f'upgraded {filename} -> {wc} visible article words')

          # Validate structural requirements on every upgraded page.
          for filename in upgrades:
              s=Path(filename).read_text(encoding='utf-8')
              if marker not in s: raise SystemExit(f'Marker missing {filename}')
              if s.count('<h2>Related') < 1: raise SystemExit(f'Related guides missing {filename}')
              if len(re.findall(r'href="/learning-center/[^"#]+/"', s)) < 3: raise SystemExit(f'Not enough LC links {filename}')
              if 'href="/contact/"' not in s: raise SystemExit(f'CTA missing {filename}')
              if 'href="/service-areas/jacksonville/"' not in s: raise SystemExit(f'Jacksonville context link missing {filename}')
              if '"@type":"FAQPage"' not in s: raise SystemExit(f'FAQ schema missing {filename}')
              if '<div class="faq"><h2>Common questions</h2>' not in s: raise SystemExit(f'Visible FAQ missing {filename}')
          print('PASS: 18 articles expanded with contextual links and schema preserved')

      - name: Commit upgrades and self-delete workflow
        run: |
          rm .github/workflows/upgrade-low-scoring-learning-center.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learning-center .github/workflows/upgrade-low-scoring-learning-center.yml
          git commit -m 'Upgrade 18 Learning Center articles for SEO depth and linking'
          git push
