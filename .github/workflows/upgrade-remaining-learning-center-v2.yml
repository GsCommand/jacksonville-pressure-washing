        run: |
          rm -f .github/workflows/upgrade-remaining-learning-center.yml .github/workflows/upgrade-remaining-learning-center-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learning-center .github/workflows
          git commit -m 'Upgrade remaining 35 Learning Center articles for 90 plus SEO quality'
          git push