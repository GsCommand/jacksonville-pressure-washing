        shell: python
        run: |
          from pathlib import Path
          import re, json, html

          U={
          'commercial/commercial-pressure-washing-jacksonville':('Jacksonville commercial properties add traffic, public access, loading zones, storefronts and scheduling constraints to the cleaning plan. Northeast Florida rain, humidity and year-round use can also make sidewalks, dumpster areas and common spaces soil quickly.','Build a commercial scope around operations, not just square footage','A useful commercial proposal should identify surfaces, traffic level, access restrictions, water availability and acceptable work windows before pricing is finalized. A retail entrance that must stay open needs a different plan from a closed warehouse apron. Property managers should also separate routine organic buildup from oil, rust, gum and other specialty staining because those conditions may require different treatment and expectations.',['hiring/what-professional-pressure-washing-should-include','cost/pressure-washing-cost-jacksonville','comparisons/can-pressure-washing-damage-concrete']),
          'comparisons/power-washing-vs-pressure-washing-vs-pressure-cleaning':('Jacksonville homeowners will see contractors use pressure washing, power washing and pressure cleaning almost interchangeably. The wording matters less than whether the company chooses the right pressure, flow, chemistry and technique for the actual Northeast Florida surface.','Choose the method by surface risk, not by the service label','Concrete may tolerate a controlled mechanical cleaning process that would be inappropriate for painted siding, roofing or screens. A homeowner comparing quotes should ask what method reaches each surface, what pretreatment is used, how runoff is managed and which stains are considered specialty work. That comparison is more useful than assuming “power washing” is automatically stronger or better.',['house-washing/soft-washing-vs-pressure-washing-a-house','comparisons/can-pressure-washing-damage-concrete','hiring/what-professional-pressure-washing-should-include']),
          'cost/driveway-cleaning-cost-jacksonville':('Jacksonville driveway-cleaning prices can vary even when two properties have similar square footage. Northeast Florida driveways differ in access, staining, edging, drainage, coatings and setup time, so a useful quote should explain what is included instead of relying on one per-square-foot number.','Separate base driveway cleaning from specialty treatment','For ordinary concrete, the base scope may include pretreatment, surface cleaning, edge work and rinsing. Oil, rust, irrigation staining, tire marks, paint, sealer failure or heavy organic buildup can change the process. Homeowners should also compare whether adjoining sidewalks or aprons are included and whether a minimum service charge applies.',['driveways/driveway-pressure-washing','driveways/oil-stains-on-concrete','driveways/how-to-remove-tire-marks-concrete-driveway']),
          'cost/gutter-cleaning-cost-jacksonville':('Gutter-cleaning cost in Jacksonville is influenced by more than linear footage. Roof height, access, gutter guards, debris volume, downspout restrictions and cleanup expectations can all change labor, especially on Northeast Florida homes surrounded by pines or mature trees.','Compare gutter quotes by access and scope','A lower quote may cover only debris removal from open gutter channels, while another may include accessible downspout checks, bagging debris, photos or handling some gutter guards. Exterior gutter washing and gutter brightening are separate appearance services and should not be assumed to be part of an interior cleanout unless the quote says so.',['gutters/how-often-should-gutters-be-cleaned-florida','gutters/are-gutter-guards-worth-it-florida','gutters/interior-gutter-cleaning-vs-exterior-gutter-washing']),
          'cost/house-washing-cost-jacksonville':('House-washing cost in Jacksonville depends on more than the home’s footprint. Stories, wall material, heavy algae, access, porches, attached garages, soffits and the protection needed around landscaping or fixtures can all affect the Northeast Florida scope.','A strong house-wash quote defines surfaces before price','Homeowners should know whether the quote covers siding or stucco only, or also accessible soffits, fascia, exterior gutter faces and trim. Specialty stains such as rust, irrigation deposits and oxidation should be separated from routine organic buildup so two proposals can be compared on equal scope.',['house-washing/what-does-professional-house-wash-include','house-washing/soft-washing-vs-pressure-washing-a-house','house-washing/vinyl-siding-oxidation-house-washing']),
          'cost/pressure-washing-cost-jacksonville':('Jacksonville pressure-washing prices can vary because the term can describe anything from a small sidewalk to an entire exterior-cleaning package. In Northeast Florida, surface type, access, staining, setup time and bundled services usually matter more than one advertised headline price.','Compare scope first, then compare price','A useful estimate should list the surfaces being cleaned, the general method, obvious exclusions and specialty stains that may need separate treatment. Driveways, houses, roofs, gutters and pool areas should not be priced as if they require the same equipment or risk level. Bundled work can also change setup efficiency.',['cost/driveway-cleaning-cost-jacksonville','cost/house-washing-cost-jacksonville','cost/roof-cleaning-cost-jacksonville']),
          'cost/roof-cleaning-cost-jacksonville':('Roof-cleaning cost in Jacksonville is shaped by roof material, pitch, height, access, landscaping, runoff management and roof condition. Northeast Florida homes may have asphalt shingles, concrete tile, clay tile or metal roofing, and those systems should not be treated as one generic cleaning job.','Roof condition and access can matter more than square footage','A low-slope single-story shingle roof with clear access is a different project from a steep tile roof above a screened pool enclosure. Quotes should define the cleaning method, whether detached structures are included, how runoff and plants are protected and what pre-existing roof damage may limit the work.',['roof-cleaning/can-you-pressure-wash-roof-shingles','roof-cleaning/tile-roof-cleaning-florida','roof-cleaning/how-long-does-roof-cleaning-last']),
          'driveways/driveway-pressure-washing':('Jacksonville driveways can accumulate organic film, tire traffic, irrigation staining and vehicle-related spots under Northeast Florida heat and humidity. A professional plan should identify concrete condition and stain type before choosing pressure or chemistry.','Consistency matters more than chasing every stain with pressure','The goal is an even result across the slab without creating stripes, wand marks or unnecessary wear. Pretreatment can help loosen compatible buildup, a properly matched surface cleaner can improve consistency, and edge work plus rinsing help finish the job. Specialty stains should be evaluated separately instead of being attacked with progressively stronger pressure.',['comparisons/can-pressure-washing-damage-concrete','driveways/oil-stains-on-concrete','driveways/how-to-remove-tire-marks-concrete-driveway']),
          'driveways/oil-stains-on-concrete':('Oil staining on Jacksonville driveways can range from fresh surface residue to contamination that has migrated deeper into porous concrete. Northeast Florida heat can accelerate how vehicle fluids spread and cure, so age and depth matter when setting expectations.','Improvement is a better promise than guaranteed removal','Fresh oil may respond to absorbent cleanup, compatible degreasing, dwell time and controlled agitation. Older stains can remain as a shadow because contamination has moved below the immediate surface. Sealed or coated concrete needs extra caution because a treatment that attacks oil may also alter the finish.',['driveways/driveway-pressure-washing','driveways/how-to-remove-tire-marks-concrete-driveway','comparisons/can-pressure-washing-damage-concrete']),
          'fences/fence-cleaning':('Fence cleaning in Jacksonville often means green organic buildup, irrigation overspray, sun exposure and mixed materials on the same property. Northeast Florida conditions can affect vinyl, PVC, painted wood and bare wood differently, so material should lead the plan.','Clean a fence as a material system, not as a long wall','Posts, panels, caps, gates, hinges and adjoining masonry can each have different limits. Wood may be vulnerable to raised fibers and wand marks, while vinyl can show oxidation, fading or mineral staining that routine washing will not reverse. A good inspection also looks for loose sections, brittle components and coating failure.',['fences/vinyl-fence-cleaning-florida','fences/wood-vs-vinyl-fence-cleaning','comparisons/does-pressure-washing-remove-mold-mildew-algae']),
          'gutters/best-gutter-cleaning-service-near-me':('When Jacksonville homeowners search for gutter cleaning near them, proximity is only the first filter. Northeast Florida homes can have steep rooflines, guards, buried drains and heavy tree debris, so the best fit is the company that clearly defines access, cleanup and downspout scope.','Use a near-me search to build a shortlist, then verify the work','Ask whether debris is physically removed, where it is placed, whether accessible outlets and downspouts are checked, how gutter guards are handled and whether photos are available. Also separate interior cleaning from exterior gutter washing or brightening because those services solve different problems.',['gutters/how-often-should-gutters-be-cleaned-florida','gutters/gutter-cleaning-vs-gutter-brightening','gutters/are-gutter-guards-worth-it-florida']),
          'gutters/how-often-should-gutters-be-cleaned-florida':('There is no single gutter-cleaning schedule for every Jacksonville home. Northeast Florida properties under pines or mature trees can accumulate debris much faster than open lots, and heavy rain can expose restrictions that were not obvious during dry weather.','Use inspection triggers instead of a rigid calendar','The right interval depends on tree coverage, roof debris, gutter guards, roof pitch and how quickly outlets collect material. Overflow during rain, plants growing from the gutter, standing water, roof grit at outlets and visible debris are practical triggers. Homes with recurring clogs may need attention more frequently than a generic once-a-year recommendation.',['gutters/clogged-downspout-signs','gutters/are-gutter-guards-worth-it-florida','gutters/best-gutter-cleaning-service-near-me']),
          'hiring/best-pressure-washing-companies-in-jacksonville':('A “best pressure washing company in Jacksonville” list is only useful if the comparison criteria match the property. Northeast Florida homes combine concrete, stucco, siding, roofs, gutters and pool enclosures, and strength on one surface does not automatically make a company the best fit for every project.','Define “best” by the service you actually need','Compare current insurance, local service coverage, recent work on similar materials, written scope, stain limitations and the method used on each surface. Reviews are more useful when they describe the same type of job you are planning; a detailed roof-cleaning review is more relevant to a roof project than unrelated driveway reviews.',['hiring/how-to-choose-a-pressure-washing-company','hiring/pressure-washing-near-me','hiring/what-professional-pressure-washing-should-include']),
          'hiring/how-to-choose-a-pressure-washing-company':('Choosing a pressure-washing company in Jacksonville should be based on more than a price and star rating. Northeast Florida properties can include delicate painted surfaces, roofs, screens, pavers and concrete, so the contractor should be able to explain how the process changes by material.','A good contractor can explain what they will not do','Strong operators should be comfortable discussing limitations: oil may leave a shadow, oxidation is not ordinary dirt, failed paint can remain visible, and roof damage is a roofing issue rather than a cleaning issue. That boundary-setting is a better trust signal than promising every stain will disappear.',['hiring/pressure-washing-near-me','hiring/best-pressure-washing-companies-in-jacksonville','hiring/what-professional-pressure-washing-should-include']),
          'hiring/pressure-washing-near-me':('For Jacksonville homeowners, “pressure washing near me” is most useful for finding companies that genuinely serve the property. Northeast Florida coverage can span Duval, St. Johns, Clay and Nassau counties, so proximity should be verified rather than assumed from an ad.','The right local company should make the next step easy to verify','After confirming service coverage, compare the exact surface, proposed method, insurance, recent local examples and written scope. Ask what photos are helpful for quoting and what conditions may require an on-site inspection. A company that distinguishes organic buildup, oxidation, rust, oil and coating failure is giving a more useful evaluation than one quoting every surface from square footage alone.',['hiring/how-to-choose-a-pressure-washing-company','hiring/best-pressure-washing-companies-in-jacksonville','cost/pressure-washing-cost-jacksonville']),
          'hiring/what-professional-pressure-washing-should-include':('Professional pressure washing in Jacksonville should be defined by a repeatable process, not simply by owning a pressure washer. Northeast Florida properties often require different approaches for concrete, siding, roofing, screens, gutters and specialty stains.','A professional scope should connect method, protection and expectations','Before work begins, the company should identify material, obvious damage, access, runoff path and stain type. The quote should explain included surfaces, while the crew adapts pressure or chemistry to the substrate and protects reasonable sensitive items. Results should be judged against the agreed scope rather than unrealistic promises.',['hiring/how-to-choose-a-pressure-washing-company','comparisons/power-washing-vs-pressure-washing-vs-pressure-cleaning','comparisons/can-pressure-washing-damage-concrete']),
          'house-washing/house-washing-companies-near-me':('When Jacksonville homeowners search for house-washing companies near them, the important question is whether the company understands the exterior materials on that home. Northeast Florida houses can combine stucco, vinyl, fiber cement, painted masonry, soffits and other finishes that should not all receive the same approach.','Compare house-washing companies by surface judgment','Ask what is included, how the method changes between materials, what happens around electrical fixtures and landscaping, and which stains may remain after routine washing. Recent local examples on a similar home are more useful than generic before-and-after photos. A clear quote should also distinguish house washing from roof cleaning, gutter brightening and other separate services.',['house-washing/what-does-professional-house-wash-include','house-washing/soft-washing-vs-pressure-washing-a-house','hiring/how-to-choose-a-pressure-washing-company']),
          'house-washing/is-soft-washing-safe-for-stucco-and-siding':('Soft washing can be appropriate for many Jacksonville stucco and siding surfaces when the process is matched to material and condition. Northeast Florida humidity supports organic growth, but lower pressure does not remove the need to inspect paint, oxidation, cracks, seals and fixtures first.','Low pressure is only one part of a safe process','Safety also depends on compatible chemistry, controlled dwell time, thorough rinsing and runoff attention. Painted stucco with failing paint, oxidized vinyl and damaged siding can still show problems after a low-pressure wash. A test area is useful when the finish or previous maintenance history is uncertain.',['house-washing/can-you-pressure-wash-stucco','house-washing/can-you-pressure-wash-vinyl-siding','house-washing/what-is-soft-washing']),
          'house-washing/soft-washing-vs-pressure-washing-a-house':('Jacksonville house exteriors should not be cleaned by choosing one machine setting for the entire property. Northeast Florida homes commonly combine siding, stucco, painted trim, masonry and concrete, and each surface can call for a different balance of chemistry, flow and pressure.','The best house-washing method can change within the same elevation','A low-pressure application may be appropriate for organic buildup on siding or stucco while harder adjacent flatwork can tolerate a different mechanical process. The contractor should also distinguish removable growth from oxidation, failing paint, rust and irrigation staining because those conditions may remain or require separate treatment.',['house-washing/what-is-soft-washing','house-washing/is-soft-washing-safe-for-stucco-and-siding','house-washing/what-does-professional-house-wash-include']),
          'local/pressure-washing-by-neighborhood-and-city':('Jacksonville is a large service market, and pressure-washing needs can vary across Duval County and nearby Northeast Florida communities. Coastal exposure, mature trees, newer planned communities, irrigation and property type all influence what a cleaner sees on arrival.','Local pages should verify coverage, not repeat sales copy','The useful local question is whether the company regularly serves the property and can handle the surfaces there. A Jacksonville Beach home may have more salt exposure than an inland subdivision, while tree-heavy neighborhoods may see faster gutter and roof buildup. Geography should connect to practical service considerations rather than pretend every neighborhood has unique cleaning chemistry.',['hiring/pressure-washing-near-me','cost/pressure-washing-cost-jacksonville','house-washing/how-often-pressure-wash-house-florida']),
          'pool-areas/pool-deck-pool-cage-screen-enclosure-cleaning':('Pool areas in Jacksonville combine concrete or pavers, coping, painted aluminum frames, screens, doors and nearby pool water. Northeast Florida humidity can support algae and mildew, while sun and pool chemicals can expose oxidation or coating wear.','Define the pool-area scope one surface at a time','A pool-deck wash does not automatically include the cage, and cleaning the enclosure does not automatically include the deck. Screens and painted aluminum need gentler handling than hard concrete, while runoff must be managed around the pool. A good quote should identify deck material, accessible screen faces and pre-existing oxidation, tears or coating failure.',['pool-areas/pool-cage-vs-screen-enclosure-cleaning','patios/patio-cleaning-jacksonville','comparisons/does-pressure-washing-remove-mold-mildew-algae']),
          'roof-cleaning/best-roof-cleaning-companies-jacksonville':('The best roof-cleaning company in Jacksonville is the one that matches the method to the actual roofing system and clearly explains runoff, access and limitations. Northeast Florida roofs include asphalt shingles, tile and metal, and each presents different risks.','Compare roof cleaners by roofing judgment, not pressure-washing claims','Ask what material is on the roof, what method reaches the surface, how plants and property below are protected and what defects would cause the work to stop. Recent examples on the same roof type are more meaningful than unrelated exterior-cleaning photos. A responsible cleaner also separates removable organic staining from fading, granule loss, corrosion and broken tile.',['roof-cleaning/can-you-pressure-wash-roof-shingles','roof-cleaning/tile-roof-cleaning-florida','hiring/how-to-choose-a-pressure-washing-company']),
          'roof-cleaning/black-roof-streaks-algae-removal':('Black roof streaks are common on Jacksonville and Northeast Florida roofs, but dark discoloration is not automatically one uniform condition. Organic growth, age-related color change, repairs and material wear can overlap visually from the ground.','Identify what can be cleaned before promising what will disappear','On asphalt shingles, dark organic streaking should be addressed with a roof-appropriate process rather than aggressive mechanical pressure. On tile or metal, the roof system and finish still control the method. Cleaning can improve compatible contamination but does not reverse granule loss, faded coatings, corrosion, broken tiles or mismatched replacement sections.',['roof-cleaning/can-you-pressure-wash-roof-shingles','roof-cleaning/how-long-does-roof-cleaning-last','roof-cleaning/soft-washing-roof-vs-pressure-washing']),
          'roof-cleaning/soft-washing-roof-vs-pressure-washing':('Roof cleaning in Jacksonville should begin with roofing material rather than a debate over equipment labels. Northeast Florida roofs can be asphalt shingle, tile or coated metal, and those systems do not have identical cleaning limits.','Protect the roof system while treating the staining','The contractor should inspect age, damage, pitch, runoff paths and visible finish before choosing a method. High mechanical pressure is not appropriate simply because staining is heavy. Low-pressure application still requires compatible chemistry, controlled runoff and realistic expectations about permanent fading, repairs, coating wear or structural defects.',['roof-cleaning/can-you-pressure-wash-roof-shingles','roof-cleaning/tile-roof-cleaning-florida','roof-cleaning/metal-roof-cleaning-florida']),
          'stains/rust-irrigation-stains':('Rust and irrigation stains on Jacksonville concrete, walls and fences are different from ordinary organic buildup. Northeast Florida irrigation systems can repeatedly deposit mineral-rich water on the same surfaces, creating orange or brown discoloration that normal pressure washing may not remove evenly.','Specialty stain treatment starts with identifying the source','A one-time rust spot from metal furniture is different from recurring irrigation overspray. If the source continues, staining can return after treatment. Surface type also matters because bare concrete, painted walls, pavers and vinyl may tolerate different chemistry. A small test area helps establish whether the stain is removable without damaging the surrounding finish.',['driveways/oil-stains-on-concrete','driveways/how-to-remove-tire-marks-concrete-driveway','comparisons/can-pressure-washing-damage-concrete']),
          'house-washing/what-is-soft-washing':('Soft washing is commonly used on Jacksonville homes for surfaces where strong mechanical pressure is unnecessary or undesirable. Northeast Florida humidity can produce recurring algae and mildew, but the method still needs to be adapted to paint, siding, stucco, roofing and landscaping.','Soft washing is a process, not simply “low PSI”','A complete process considers cleaning solution, concentration, dwell time, application pressure, rinse, runoff and material. Lower pressure can reduce mechanical risk, but chemistry can still affect plants, coatings or metals if poorly controlled. The safest approach is the least aggressive compatible method that achieves the cleaning goal while respecting manufacturer guidance and surface condition.',['house-washing/soft-washing-vs-pressure-washing-a-house','house-washing/is-soft-washing-safe-for-stucco-and-siding','roof-cleaning/soft-washing-roof-vs-pressure-washing']),
          'house-washing/how-often-pressure-wash-house-florida':('There is no universal schedule for washing every Jacksonville home. Northeast Florida humidity, shade, tree coverage, irrigation and exterior material can make one side of a property soil much faster than another.','Use visible conditions and material limits instead of a fixed calendar','Green growth, pollen film, spider debris and noticeable dirt are practical triggers. Homes under trees or with shaded north-facing walls may need attention sooner than open, sunny properties. Washing too aggressively or too frequently can expose weak paint, oxidation or aged components, so maintenance should follow actual condition rather than an arbitrary number of months.',['house-washing/why-green-algae-keeps-coming-back-on-siding','house-washing/what-is-soft-washing','house-washing/what-does-professional-house-wash-include']),
          'house-washing/can-you-pressure-wash-vinyl-siding':('Vinyl siding on Jacksonville homes can develop green organic growth in humid, shaded areas while Florida sun creates a separate risk of fading and oxidation. Cleaning should remove compatible contamination without treating the siding like concrete.','The biggest vinyl-siding mistake is confusing dirt with oxidation','Powdery chalking, uneven fading and replacement panels can become more noticeable after dirt is gone. Stronger pressure will not restore oxidized vinyl and can force water behind panels or damage weak accessories. A controlled wash should account for seams, vents, electrical fixtures, windows and siding condition before the whole wall is treated.',['house-washing/vinyl-siding-oxidation-house-washing','house-washing/is-soft-washing-safe-for-stucco-and-siding','house-washing/what-is-soft-washing']),
          'decks/deck-cleaning-jacksonville':('Deck cleaning in Jacksonville can involve pressure-treated wood, older coated wood and composite products with very different maintenance limits. Northeast Florida humidity, shade and rain can support organic buildup, but material and existing finish should determine the process.','Protect the deck surface you want to keep','Wood can be scarred or furred by concentrated pressure, while composites may have manufacturer-specific cleaning limits and older coatings can fail unevenly. Before cleaning, inspect fasteners, splinters, loose boards, previous stain and product type. If the deck will be stained afterward, cleaning should align with the coating manufacturer’s preparation and moisture requirements.',['decks/deck-cleaning-before-staining','fences/wood-vs-vinyl-fence-cleaning','house-washing/pressure-washing-before-painting']),
          'patios/patio-cleaning-jacksonville':('Patios in Jacksonville may be bare concrete, brick, pavers, natural stone or coated surfaces, so one method does not fit every backyard. Northeast Florida shade and humidity can produce organic buildup, while irrigation and furniture can create separate rust or mineral stains.','Identify patio material before choosing pressure or chemistry','Concrete can tolerate a different mechanical process from a painted coating, paver joint system or softer stone. Furniture stains, grill grease, rust and irrigation deposits should be evaluated separately from dirt and algae. A good scope should also define whether adjoining walkways, pool decks, steps or screen-enclosure surfaces are included.',['pool-areas/pool-deck-pool-cage-screen-enclosure-cleaning','stains/rust-irrigation-stains','comparisons/does-pressure-washing-remove-mold-mildew-algae']),
          'comparisons/does-pressure-washing-remove-mold-mildew-algae':('Jacksonville’s warm, humid climate makes green and dark organic buildup a common exterior-cleaning issue. Whether pressure washing removes it safely depends on the surface: concrete, siding, roofs, fences and screens should not all receive the same mechanical force.','Treat the organism and protect the substrate','On durable flatwork, controlled pressure may be part of the process. On siding, roofs or screens, chemistry and lower pressure may do more of the work. The visible color can improve quickly, but recurring shade, moisture and vegetation can allow growth to return. Permanent discoloration, oxidation or material damage should not be mistaken for active organic buildup.',['house-washing/what-is-soft-washing','house-washing/why-green-algae-keeps-coming-back-on-siding','comparisons/can-pressure-washing-damage-concrete']),
          'house-washing/pressure-washing-before-painting':('Exterior cleaning before painting in Jacksonville should be coordinated with the coating system, not treated as an isolated wash. Northeast Florida humidity, afternoon rain and shaded walls can affect drying, while old paint, chalking and mildew influence preparation.','Painting prep is about a sound coating surface, not just a clean-looking wall','Washing can remove compatible dirt and organic buildup, but loose paint, failing caulk, oxidation and damaged substrate may need separate preparation. The painter or coating manufacturer should determine moisture, dry-time and surface-preparation requirements. Cleaning too aggressively can create new damage that remains visible beneath finished paint.',['decks/deck-cleaning-before-staining','house-washing/what-does-professional-house-wash-include','house-washing/can-you-pressure-wash-stucco']),
          'house-washing/soffit-fascia-cleaning-jacksonville':('Soffits and fascia on Jacksonville homes collect spider debris, pollen, mildew and roof runoff, but they may also contain vents, painted surfaces, gutters and electrical components. Northeast Florida humidity can increase organic buildup while age and sun exposure affect the finish.','Roofline cleaning should account for vents, coatings and water direction','Soffit panels are not simply another wall surface. Vented sections, seams and attic openings make spray direction important, while painted fascia can show oxidation, peeling or previous water staining. Exterior gutter faces may be washed with the roofline but bonded tiger stripes can require a separate brightening process.',['house-washing/what-does-professional-house-wash-include','gutters/gutter-tiger-stripes','house-washing/soft-washing-vs-pressure-washing-a-house']),
          'house-washing/why-green-algae-keeps-coming-back-on-siding':('Green algae can return on Jacksonville siding because the conditions that supported the first growth often remain after cleaning. Northeast Florida humidity, shade, nearby vegetation, irrigation and slow-drying walls can make certain elevations soil faster than others.','Recurring algae is usually a site-condition problem, not proof the previous wash failed','A clean wall can begin collecting new spores and moisture immediately. North-facing walls, areas behind shrubs and sections hit by sprinklers may show growth first. Maintenance should follow the exposure of each side of the house. If discoloration returns almost immediately or looks chalky rather than green, oxidation or another surface condition may need evaluation.',['house-washing/how-often-pressure-wash-house-florida','house-washing/what-is-soft-washing','house-washing/vinyl-siding-oxidation-house-washing']),
          'gutters/are-gutter-guards-worth-it-florida':('Gutter guards can reduce large debris entering some Jacksonville gutters, but they do not make a gutter system maintenance-free. Northeast Florida pines, roof grit, small leaves and organic material can collect on top of guards or pass through openings.','Judge gutter guards by local debris and the maintenance they create','A guard that works well under broad leaves may behave differently under pine needles or fine roof debris. Homeowners should consider how the guard can be inspected, whether it must be removed for cleaning, how water reaches the gutter during heavy rain and whether valleys dump concentrated flow onto the system. Overflow can still come from clogged outlets, poor pitch or undersized drainage.',['gutters/how-often-should-gutters-be-cleaned-florida','gutters/clogged-downspout-signs','gutters/best-gutter-cleaning-service-near-me'])}

          assert len(U)==35,len(U)
          marker='<!-- lc-depth-upgrade-remaining-20260817 -->'
          def clean(x):
              x=re.sub(r'<script\b[^>]*>.*?</script>',' ',x,flags=re.S|re.I); x=re.sub(r'<style\b[^>]*>.*?</style>',' ',x,flags=re.S|re.I); x=re.sub(r'<[^>]+>',' ',x); return re.sub(r'\s+',' ',html.unescape(x)).strip()

          for rel,(local,heading,body,links) in U.items():
              p=Path('learning-center')/rel/'index.html'; s=p.read_text(encoding='utf-8')
              if marker in s: raise SystemExit(f'already upgraded {p}')
              q=re.search(r'(<p class="quick-answer">.*?</p>)',s,re.S|re.I)
              if not q: raise SystemExit(f'no quick answer {p}')
              intro=f'{marker}<p><strong>Jacksonville context:</strong> {local} <a href="/service-areas/jacksonville/">View Jacksonville service coverage</a>.</p>'
              s=s[:q.end()]+intro+s[q.end():]
              lis=''.join(f'<li><a href="/learning-center/{u}/">{Path(u).name.replace("-"," ").title()}</a></li>' for u in links)
              block=f'<h2>{heading}</h2><p>{body}</p><h2>Related guides</h2><ul class="checklist">{lis}</ul><p>For a property-specific recommendation, <a href="/contact/">request an exterior-cleaning estimate</a> and include wide photos plus close-ups of the main concern.</p>'
              r=re.search(r'<div class="related">',s,re.I); f=re.search(r'<div class="faq">',s,re.I)
              ins=r.start() if r else (f.start() if f else -1)
              if ins<0: raise SystemExit(f'no insertion point {p}')
              s=s[:ins]+block+s[ins:]
              am=re.search(r'<div class="article-content"[^>]*>(.*?)(?:</div>\s*</article>)',s,re.S|re.I)
              if not am: raise SystemExit(f'cannot measure {p}')
              wc=len(re.findall(r"[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)?",clean(am.group(1))))
              sr=re.compile(r'(<script\s+type="application/ld\+json"[^>]*>)(.*?)(</script>)',re.S|re.I); reps=[]
              for sm in sr.finditer(s):
                  d=json.loads(sm.group(2)); nodes=d.get('@graph',[]) if isinstance(d,dict) else []; touched=False
                  for n in nodes:
                      if isinstance(n,dict) and n.get('@type')=='BlogPosting': n['wordCount']=wc; n['dateModified']='2026-08-17'; touched=True
                      if isinstance(n,dict) and n.get('@type')=='WebPage': n['dateModified']='2026-08-17'; touched=True
                  if touched: reps.append((sm.start(),sm.end(),sm.group(1)+json.dumps(d,ensure_ascii=False,separators=(',',':'))+sm.group(3)))
              for a,b,z in reversed(reps): s=s[:a]+z+s[b:]
              s=re.sub(r'(<meta property="article:modified_time" content=")[^"]*(")',r'\g<1>2026-08-17\2',s,count=1,flags=re.I)
              p.write_text(s,encoding='utf-8'); print(f'upgraded {p} -> {wc} words')

          for rel in U:
              p=Path('learning-center')/rel/'index.html'; s=p.read_text(encoding='utf-8')
              if marker not in s or 'href="/contact/"' not in s or 'href="/service-areas/jacksonville/"' not in s: raise SystemExit(f'validation failed {p}')
              if len(set(re.findall(r'href="(/learning-center/[^"#]+/)"',s,re.I)))<3: raise SystemExit(f'not enough sibling links {p}')
              if '"@type":"FAQPage"' not in s or '<div class="faq"><h2>Common questions</h2>' not in s: raise SystemExit(f'faq missing {p}')
          print('PASS: 35 remaining articles upgraded')
