name: Swap driveway gutter card image
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update related gutter card image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Pressure-Washing-Jacksonville-fl/driveway-cleaning/index.html')
          s = p.read_text()
          old = '<a href="/Gutter-Cleaning-Jacksonville-Fl/"><img src="/images/gutter-cleaning.webp" alt="Gutter cleaning in Jacksonville" loading="lazy"><strong>Gutter Cleaning</strong><span>Interior gutter debris removal and accessible downspout cleaning.</span></a>'
          new = '<a href="/Gutter-Cleaning-Jacksonville-Fl/"><img src="/images/dirty-gutter.jpeg" alt="Gutter cleaning in Jacksonville" loading="lazy"><strong>Gutter Cleaning</strong><span>Interior gutter debris removal and accessible downspout cleaning.</span></a>'
          if old not in s:
              raise SystemExit('Driveway gutter card target not found')
          p.write_text(s.replace(old, new, 1))
          Path('.github/workflows/swap-driveway-gutter-card-image.yml').unlink()
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Pressure-Washing-Jacksonville-fl/driveway-cleaning/index.html .github/workflows/swap-driveway-gutter-card-image.yml
          git commit -m "Use dirty gutter image on driveway related card"
          git push
