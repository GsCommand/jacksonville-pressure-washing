name: Rename gutter cleaning hub
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename hub and update references
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          old_path = Path('Gutters-Jacksonville-Fl/index.html')
          new_path = Path('Gutter-Cleaning-Jacksonville-Fl/index.html')
          old_base = '/Gutters-Jacksonville-Fl/'
          new_base = '/Gutter-Cleaning-Jacksonville-Fl/'
          old_abs = 'https://jacksonvillepressurewashingfl.com/Gutters-Jacksonville-Fl/'
          new_abs = 'https://jacksonvillepressurewashingfl.com/Gutter-Cleaning-Jacksonville-Fl/'

          s = old_path.read_text()
          # Exact hub URL references only; child gutter URLs remain where they are.
          s = s.replace(f'href="{old_base}"', f'href="{new_base}"')
          s = s.replace(f'href="{old_abs}"', f'href="{new_abs}"')
          s = s.replace(f'content="{old_abs}"', f'content="{new_abs}"')
          s = s.replace(f'"url":"{old_abs}"', f'"url":"{new_abs}"')
          s = s.replace(f'"item":"{old_abs}"', f'"item":"{new_abs}"')
          s = s.replace(f'"@id":"{old_abs}#', f'"@id":"{new_abs}#')
          # New hero/share image for the renamed gutter-cleaning hub.
          s = s.replace('<link rel="preload" as="image" href="/images/gutter-cleaning.webp">', '<link rel="preload" as="image" href="/images/dirty-gutter.jpeg">', 1)
          s = s.replace('https://jacksonvillepressurewashingfl.com/images/gutter-cleaning.webp', 'https://jacksonvillepressurewashingfl.com/images/dirty-gutter.jpeg')
          hero_old = '<section class="home-photo-banner" aria-label="Gutter cleaning in Jacksonville"><img src="/images/gutter-cleaning.webp" alt="Professional gutter cleaning in Jacksonville Florida">'
          hero_new = '<section class="home-photo-banner" aria-label="Gutter cleaning in Jacksonville"><img src="/images/dirty-gutter.jpeg" alt="Leaves and organic debris built up inside a rain gutter in Northeast Florida">'
          if hero_old not in s:
              raise SystemExit('Gutter hero target not found')
          s = s.replace(hero_old, hero_new, 1)
          new_path.parent.mkdir(parents=True, exist_ok=True)
          new_path.write_text(s)
          old_path.unlink()

          # Update exact hub links throughout text files while preserving child routes.
          exts = {'.html','.css','.txt','.xml','.json'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in exts or '.git' in p.parts or p == new_path:
                  continue
              try:
                  t = p.read_text()
              except UnicodeDecodeError:
                  continue
              u = t.replace(f'href="{old_base}"', f'href="{new_base}"')
              u = u.replace(f'"item":"{old_abs}"', f'"item":"{new_abs}"')
              u = u.replace(f'>{old_abs}</loc>', f'>{new_abs}</loc>')
              u = u.replace(f'{old_abs}\n', f'{new_abs}\n')
              if u != t:
                  p.write_text(u)

          # Vercel: redirect old hub to new hub and update legacy service redirect.
          vp = Path('vercel.json')
          data = json.loads(vp.read_text())
          redirects = data.get('redirects', [])
          for r in redirects:
              if r.get('destination') == old_base:
                  r['destination'] = new_base
          old_redirects = [
              {'source':'/Gutters-Jacksonville-Fl','destination':new_base,'permanent':True},
              {'source':'/Gutters-Jacksonville-Fl/','destination':new_base,'permanent':True},
          ]
          existing_sources = {r.get('source') for r in redirects}
          inserts = [r for r in old_redirects if r['source'] not in existing_sources]
          data['redirects'] = inserts + redirects
          vp.write_text(json.dumps(data, indent=2) + '\n')

          # Sitemap exact root URL.
          sp = Path('sitemap.xml')
          sm = sp.read_text().replace(f'<loc>{old_abs}</loc>', f'<loc>{new_abs}</loc>')
          sp.write_text(sm)

          Path('.github/workflows/rename-gutter-cleaning-hub.yml').unlink()
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move gutter cleaning hub to Jacksonville service URL"
          git push