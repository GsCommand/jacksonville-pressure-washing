name: Add fence buildup images
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply image placements
        run: |
          echo '' | base64 -d >/tmp/update.py
          python /tmp/update.py
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Pressure-Washing-Jacksonville-fl/fence-cleaning/index.html learning-center/fences/fence-cleaning/index.html .github/workflows/add-fence-buildup-images.yml
          git commit -m "Use fence buildup images in relevant content"
          git push