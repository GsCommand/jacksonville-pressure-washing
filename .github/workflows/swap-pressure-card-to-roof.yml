name: Swap pressure service card to roof cleaning
on:
  push:
    paths:
      - '.github/workflows/swap-pressure-card-to-roof.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace commercial service card with roof cleaning
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Pressure-Washing-Jacksonville-fl/index.html')
          s = p.read_text()
          old = '''      <a class="pw-service-card" href="/Pressure-Washing-Jacksonville-fl/commercial-pressure-washing/"><img src="/images/jacksonville-service-area.webp" alt="Commercial exterior cleaning in Jacksonville Florida" loading="lazy" decoding="async"><div><h3>Commercial Pressure Washing</h3><p>Exterior cleaning for compatible commercial sidewalks, entries, concrete and property surfaces.</p><span>Commercial pressure washing →</span></div></a>'''
          new = '''      <a class="pw-service-card" href="/House-Washing-Jacksonville-FL/roof-washing/"><img src="/images/roof washing.jpg" alt="Roof cleaning and roof washing in Jacksonville Florida" loading="lazy" decoding="async"><div><h3>Roof Cleaning &amp; Roof Washing</h3><p>Low-pressure roof cleaning for compatible roofing systems affected by black streaks and organic growth.</p><span>Roof cleaning →</span></div></a>'''
          if old not in s:
              raise SystemExit('Target commercial service card not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit update and remove workflow
        run: |
          rm .github/workflows/swap-pressure-card-to-roof.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Pressure-Washing-Jacksonville-fl/index.html .github/workflows/swap-pressure-card-to-roof.yml
          git commit -m "Replace commercial service card with roof cleaning"
          git push