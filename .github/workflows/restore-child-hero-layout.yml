name: Restore Child Hero Layout
on:
  push:
    paths:
      - '.github/workflows/restore-child-hero-layout.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original hero size and layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages = {
              Path('Pressure-Washing-Jacksonville-fl/sidewalk-cleaning/index.html'): '''<section class="home-photo-banner" aria-label="Sidewalk cleaning in Jacksonville"><img src="/images/sidewalk-pressure-washing.jpg" alt="Professional sidewalk pressure washing in Jacksonville Florida"><div class="home-photo-overlay"><div class="hero-glass"><p class="eyebrow">Sidewalks • Walkways • Patios • Entries</p><h1>Sidewalk, Patio &amp; Walkway Cleaning in Jacksonville, FL</h1><p>Professional pressure cleaning for concrete sidewalks, walkways, patios, entry paths, curbs and compatible hardscape affected by dirt, algae, pollen and Florida outdoor buildup.</p><div class="actions"><a class="btn primary" href="/contact/">Get Your Free Estimate</a><a class="btn light" href="tel:+19045375000">Call 904.537.5000</a></div></div></div></section>''',
              Path('Pressure-Washing-Jacksonville-fl/pool-deck-cleaning/index.html'): '''<section class="home-photo-banner" aria-label="Pool deck cleaning in Jacksonville"><img src="/images/pool-deck-cleaning.jpg" alt="Professional pool deck cleaning in Jacksonville Florida"><div class="home-photo-overlay"><div class="hero-glass"><p class="eyebrow">Pool Decks • Lanais • Outdoor Living</p><h1>Pool Deck Cleaning &amp; Lanai Pressure Washing in Jacksonville, FL</h1><p>Professional cleaning for concrete and compatible pool-deck and lanai surfaces affected by algae, pollen, grime and Florida outdoor buildup.</p><div class="actions"><a class="btn primary" href="/contact/">Get Your Free Estimate</a><a class="btn light" href="tel:+19045375000">Call 904.537.5000</a></div></div></div></section>'''
          }

          for path, replacement in pages.items():
              text = path.read_text()
              prefix = 'sw' if 'sidewalk-cleaning' in str(path) else 'pd'
              pattern = rf'<section class="{prefix}-hero">.*?</section>'
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Expected one hero block in {path}, replaced {count}')
              path.write_text(updated)
          PY
      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Pressure-Washing-Jacksonville-fl/sidewalk-cleaning/index.html Pressure-Washing-Jacksonville-fl/pool-deck-cleaning/index.html
          git rm .github/workflows/restore-child-hero-layout.yml
          git commit -m "Restore original hero layout on sidewalk and pool deck pages"
          git push
