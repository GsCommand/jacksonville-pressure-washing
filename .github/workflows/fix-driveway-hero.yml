name: Fix Driveway Hero
on:
  push:
    paths:
      - '.github/workflows/fix-driveway-hero.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original driveway hero layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Pressure-Washing-Jacksonville-fl/driveway-cleaning/index.html')
          s=p.read_text()
          old='''  <section class="dw-hero" aria-label="Driveway pressure washing in Jacksonville Florida">\n    <img src="/images/jacksonville-pressure-washing-driveway.webp" alt="Driveway pressure washing and concrete cleaning in Jacksonville Florida">\n    <div class="dw-hero__inner"><div class="dw-shell"><div class="dw-hero__glass">\n      <span class="dw-eyebrow">Driveway &amp; concrete cleaning</span>\n      <h1>Driveway Pressure Washing &amp; Concrete Cleaning in Jacksonville, FL</h1>\n      <p class="dw-hero__sub">Professional driveway pressure washing, driveway pressure cleaning and concrete cleaning for residential driveways, curbs, entry walks and compatible flatwork throughout Jacksonville and nearby Northeast Florida communities.</p>\n      <div class="dw-actions"><a class="btn primary" href="/contact/">Get Your Free Estimate</a><a class="btn light" href="tel:+19045375000">Call 904.537.5000</a></div>\n      <div class="dw-trust"><span>Licensed &amp; Insured</span><span>Concrete Surface Cleaning</span><span>Specialty Stains Evaluated Separately</span></div>\n    </div></div></div>\n  </section>'''
          new='''  <section class="home-photo-banner" aria-label="Driveway pressure washing in Jacksonville Florida"><img src="/images/jacksonville-pressure-washing-driveway.webp" alt="Driveway pressure washing and concrete cleaning in Jacksonville Florida"><div class="home-photo-overlay"><div class="hero-glass"><p class="eyebrow">Driveway &amp; concrete cleaning</p><h1>Driveway Pressure Washing &amp; Concrete Cleaning in Jacksonville, FL</h1><p>Professional driveway pressure washing, driveway pressure cleaning and concrete cleaning for residential driveways, curbs, entry walks and compatible flatwork throughout Jacksonville and nearby Northeast Florida communities.</p><div class="actions"><a class="btn primary" href="/contact/">Get Your Free Estimate</a><a class="btn light" href="tel:+19045375000">Call 904.537.5000</a></div></div></div></section>'''
          if old not in s:
              raise SystemExit('Expected driveway hero not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Pressure-Washing-Jacksonville-fl/driveway-cleaning/index.html
          git rm .github/workflows/fix-driveway-hero.yml
          git commit -m 'Restore original driveway hero layout'
          git push
