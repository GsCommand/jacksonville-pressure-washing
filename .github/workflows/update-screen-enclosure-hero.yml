name: Update Screen Enclosure Hero

on:
  push:
    paths:
      - '.github/workflows/update-screen-enclosure-hero.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update screen enclosure hero image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('House-Washing-Jacksonville-FL/screen-enclosure-cleaning/index.html')
          s = p.read_text()
          old = '<img src="/nocatee-roof-washing.webp" alt="Screen enclosure cleaning service in Jacksonville, Florida">'
          new = '<img src="/images/screen-enclosure.jpeg" alt="Screen enclosure cleaning service in Jacksonville, Florida">'
          if old not in s:
              raise SystemExit('Expected screen enclosure hero image markup not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit update and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add House-Washing-Jacksonville-FL/screen-enclosure-cleaning/index.html
          git rm .github/workflows/update-screen-enclosure-hero.yml
          git commit -m 'Update screen enclosure cleaning hero image'
          git push