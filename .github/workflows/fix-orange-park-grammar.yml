name: Fix Orange Park grammar
on: push
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('service-areas/orange-park/index.html')
          s=p.read_text(encoding='utf-8').replace('a Orange Park pressure-washing quote','an Orange Park pressure-washing quote').replace('Get a Orange Park exterior-cleaning quote','Get an Orange Park exterior-cleaning quote')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-areas/orange-park/index.html
          git commit -m "Fix Orange Park quote wording" || true
          git rm --cached .github/workflows/fix-orange-park-grammar.yml || true
          rm -f .github/workflows/fix-orange-park-grammar.yml
          git add -A
          git commit --amend --no-edit || true
          git push