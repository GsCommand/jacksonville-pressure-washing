    branches: [main]
    paths: ['.github/workflows/learning-center-batch-1.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish 10 homeowner guides
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,html
          W=Path('.github/workflows/learning-center-batch-1.yml')
          BASE='https://jacksonvillepressurewashingfl.com'
          DATE='2026-08-17'
          NAV='''<header class="home-header"><div class="home-nav-wrap"><div class="home-topbar"><a class="home-logo-box" href="/" aria-label="Jacksonville Pressure Washing home"><img src="/pressure-washing-logo.png" alt="Jacksonville Pressure Washing" width="342" height="148"></a><div class="home-top-spacer"></div><div class="home-contact-stack"><div class="home-contact-actions"><a class="btn primary" href="/contact/">Get Your Free Estimate</a></div></div><button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button></div><nav class="home-menubar"><div class="drop"><button class="drop-toggle">Pressure Washing</button><div class="dropdown"><a href="/service-areas/jacksonville/">Pressure Washing &amp; Power Washing</a><a href="/pressure-washing-jacksonville-fl/driveway-cleaning/">Driveway Cleaning</a><a href="/pressure-washing-jacksonville-fl/sidewalk-cleaning/">Sidewalk Cleaning</a><a href="/pressure-washing-jacksonville-fl/pool-deck-cleaning/">Pool Deck Cleaning</a><a href="/pressure-washing-jacksonville-fl/fence-cleaning/">Fence Cleaning</a></div></div><div class="drop"><button class="drop-toggle">House Washing</button><div class="dropdown"><a href="/house-washing-jacksonville-fl/">House Washing</a><a href="/roof-cleaning-jacksonville-fl/">Roof Washing</a><a href="/house-washing-jacksonville-fl/soft-washing/">Soft Washing</a><a href="/house-washing-jacksonville-fl/pool-cage-cleaning/">Pool Cage Cleaning</a><a href="/house-washing-jacksonville-fl/screen-enclosure-cleaning/">Screen Enclosure Cleaning</a></div></div><div class="drop"><button class="drop-toggle">Gutters</button><div class="dropdown"><a href="/gutter-cleaning-jacksonville-fl/">Gutter Cleaning</a><a href="/gutter-cleaning-jacksonville-fl/gutter-brightening/">Gutter Brightening</a><a href="/gutter-cleaning-jacksonville-fl/gutter-cleaning-cost/">Gutter Cleaning Cost</a></div></div><div class="drop"><button class="drop-toggle">Service Areas</button><div class="dropdown"><a href="/service-areas/jacksonville/">Jacksonville</a><a href="/service-areas/st-johns-county/">St. Johns County</a><a href="/service-areas/clay-county/">Clay County</a><a href="/service-areas/nassau-county/">Nassau County</a></div></div><a href="/learning-center/">Learning Center</a><a href="/faq/">FAQ</a></nav></div></header>'''
          STYLE='''<style>body{background:#edf4f8}.article-shell{width:min(980px,calc(100% - 36px));margin:0 auto;padding:28px 0 70px}.article-card{background:#fff;border:1px solid #dce6ec;box-shadow:0 18px 50px rgba(8,47,73,.08);padding:34px 42px 44px}.blog-breadcrumb{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 25px;color:#6b7e8a;font-size:.8rem}.blog-breadcrumb a,.article-content a{color:#0877b9;text-decoration:none}.article-header{padding-bottom:25px;border-bottom:1px solid #e3eaee}.article-category{margin:0 0 10px;color:#0877b9;font-size:.76rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.article-header h1{max-width:830px;margin:0 0 12px;color:#082f49;font-size:clamp(2.15rem,5vw,3.55rem);line-height:1.04}.article-dek{max-width:800px;color:#4e6574;font-size:1.08rem;line-height:1.65}.article-meta,.article-review{color:#70828d;font-size:.86rem}.article-content{font-size:1.02rem;line-height:1.78;color:#253f4e}.article-content h2{margin:38px 0 12px;color:#082f49;font-size:1.7rem}.quick-answer{margin:28px 0 12px;padding:18px 20px;border-left:4px solid #0877b9;background:#f4f8fb}.checklist li{margin:10px 0}.article-note{padding:17px 19px;border-radius:12px;background:#eef6fa}.related{margin-top:36px;padding-top:28px;border-top:1px solid #e0e8ed}.sources{font-size:.94rem}.faq details{border-top:1px solid #dce5ea}.faq summary{cursor:pointer;padding:15px 0;font-weight:900;color:#0b4a67}.faq p{margin-top:0}@media(max-width:650px){.article-shell{width:calc(100% - 20px)}.article-card{padding:24px 18px 32px}}</style>'''
          articles=[
          {'cat':'house-washing','slug':'what-is-soft-washing','title':'What Is Soft Washing? How Soft Washing Works on Florida Homes','desc':'A Jacksonville homeowner guide to soft washing, including how low-pressure application differs from pressure washing and what surfaces need extra care.','quick':'Soft washing is an exterior-cleaning approach that relies more on surface-appropriate cleaning solution and controlled low-pressure application or rinsing than on high mechanical pressure. The exact process should change with the material and its condition.','sections':[('Soft washing is a method, not a promise of zero pressure','The term describes a lower-pressure cleaning strategy for surfaces that should not be treated like concrete. It is commonly discussed for siding, stucco, soffits, painted trim and roofing. The important decision is not the label on the equipment; it is whether the surface, coating, seams and openings can be cleaned without unnecessary force.'),('Why Florida homes are a common fit','Warm weather, humidity, shade, pollen and frequent rain can leave organic buildup on exterior walls and roof surfaces. Chemistry can treat that buildup so the operator does not have to chase every dark area with a narrow high-pressure stream. Rinsing and runoff control still matter around windows, vents, plants, metals and painted finishes.'),('Soft washing versus pressure washing','Concrete driveways and many hard flatwork surfaces can tolerate controlled mechanical cleaning. House exteriors and roofs often require a different approach. A good exterior-cleaning plan may use both methods on the same property, matching each process to the surface instead of choosing one tool for everything.'),('What homeowners should ask before the job','Ask which surfaces will receive low pressure, what existing oxidation or coating problems were found, how landscaping and openings will be protected, and whether specialty stains are part of the standard wash. That conversation is more useful than asking for one universal pressure setting.')], 'service':'/house-washing-jacksonville-fl/','service_name':'House Washing','faqs':[('Is soft washing the same as pressure washing?','No. The terms overlap in everyday searches, but soft washing generally relies on lower mechanical pressure and surface-appropriate treatment.'),('Can every exterior surface be soft washed?','No single process is appropriate for every material. Existing damage, coatings, oxidation, manufacturer guidance and access all matter.'),('Does soft washing remove rust or oxidation?','Those conditions can require separate specialty treatment and should not be assumed to disappear during a standard wash.')], 'sources':[]},
          {'cat':'house-washing','slug':'how-often-pressure-wash-house-florida','title':'How Often Should You Pressure Wash Your House in Florida?','desc':'How Florida weather, shade, trees, irrigation and exterior materials affect how often a home may need exterior washing.','quick':'There is no universal calendar for every Florida home. Wash frequency should be based on visible organic buildup, shade, tree cover, irrigation exposure, siding or stucco condition and how quickly different elevations stay damp.','sections':[('Why a fixed annual rule is too simple','Two homes on the same street can age differently. A shaded north wall behind landscaping may stay damp longer than a sunny elevation. Trees can add pollen, leaves and shade. Irrigation can repeatedly wet lower walls. Those conditions can create a need for cleaning sooner than a bright, open property.'),('Watch the surface instead of the calendar','Green growth, dark organic film, heavy pollen and spider debris are practical signs to inspect. Oxidation, fading, failing paint and irrigation rust are different conditions; more frequent washing does not necessarily solve them. Identifying the type of discoloration first helps avoid unnecessary cleaning.'),('Material changes the cleaning plan','Vinyl siding, painted stucco, fiber cement, brick and soffit assemblies do not all respond the same way. Even when a home needs cleaning, the method should be selected for the material. The goal is to remove removable buildup without turning routine maintenance into coating or water-intrusion damage.'),('A useful maintenance habit','Walk the property after the wet season and again before major exterior projects such as painting. Look at shaded elevations, areas behind shrubs, soffits, fascia and lower walls near irrigation. That inspection is more useful than automatically washing every surface on the same date each year.')], 'service':'/house-washing-jacksonville-fl/','service_name':'House Washing','faqs':[('Should a Florida house be washed every year?','Some homes may benefit from annual cleaning, while others may not need it that often. Site conditions and visible buildup should drive the decision.'),('Does frequent washing prevent algae forever?','No. Cleaning removes existing buildup; shade, moisture and environmental conditions can allow it to return.'),('Should I wash before painting?','Surfaces should be clean and appropriately dry before coating. Existing paint failure and manufacturer instructions should also be reviewed.')], 'sources':[]},
          {'cat':'house-washing','slug':'can-you-pressure-wash-vinyl-siding','title':'Can You Pressure Wash Vinyl Siding? What Jacksonville Homeowners Should Know','desc':'Learn why vinyl siding usually needs controlled cleaning, what can go wrong with aggressive pressure and what to inspect before washing.','quick':'Vinyl siding can be cleaned, but close-range aggressive pressure is usually unnecessary. Low-pressure washing, sensible spray direction and attention to seams, oxidation and openings reduce the risk of forcing water behind the siding or disturbing a chalky finish.','sections':[('Vinyl siding is not concrete','Panels are designed as an exterior cladding system with laps, seams, trim and openings. Directing strong spray upward or into joints can push water where it does not belong. Cleaning should focus on removable dirt and organic buildup while respecting how the siding is assembled.'),('Oxidation can change the result','Older or sun-exposed vinyl can develop a chalky film. A normal wash can make uneven oxidation or fading more obvious, especially if the surface has been previously scrubbed or pressure washed. Oxidation is a surface-condition issue and may require a different restoration conversation than ordinary house washing.'),('Manufacturer guidance matters','The Vinyl Siding Institute describes routine cleaning with a garden hose and soft-bristle washing methods and warns against abrasive cleaning. Professional washing should follow the same principle: use the least aggressive method that achieves the cleaning goal and protect nearby landscaping and finishes.'),('What to inspect first','Look for loose panels, damaged trim, open penetrations, failed caulk, chalking, oxidized shutters and nearby electrical fixtures. A good pre-wash inspection separates existing conditions from removable buildup before water is introduced.')], 'service':'/house-washing-jacksonville-fl/','service_name':'House Washing','faqs':[('Can high pressure damage vinyl siding?','It can contribute to water intrusion, surface marking or uneven results when used too aggressively or directed into seams.'),('Will washing remove vinyl siding oxidation?','Standard house washing is not an oxidation-restoration process. Chalky oxidation may remain or become more visible.'),('What official guidance is available?','The Vinyl Siding Institute publishes installation and cleaning guidance for vinyl siding.')], 'sources':[('Vinyl Siding Institute installation and cleaning guidance','https://vinylsiding.org/wp-content/uploads/2020/06/2020-VSI-Installation-Manual.pdf')]},
          {'cat':'house-washing','slug':'can-you-pressure-wash-stucco','title':'Can You Pressure Wash Stucco? Pressure vs. Soft Washing Stucco in Florida','desc':'A practical guide to cleaning painted and textured stucco without treating the wall like a concrete driveway.','quick':'Stucco can be cleaned, but the finished wall includes texture, paint, cracks, sealants, windows and penetrations. Lower-pressure cleaning is often the safer starting point, especially when the coating or wall condition is uncertain.','sections':[('The wall system matters more than the word stucco','Exterior stucco is a cement-based finish, but homeowners see the complete assembly: texture, paint or color coat, joints, trim, sealants and openings. A durable cementitious surface does not mean every coating or penetration can accept aggressive pressure.'),('Cracks and paint failure deserve attention first','Hairline cracks, patched areas, peeling paint and failed caulk can become water-entry points or show additional damage during cleaning. Pre-existing conditions should be documented before washing so the cleaning method can be adjusted.'),('Why soft washing is commonly considered','Organic growth on painted stucco often responds to appropriate treatment without the need for close-range high pressure. Controlled rinsing reduces mechanical impact on texture and coatings. Specialty stains such as irrigation rust or efflorescence should be identified separately.'),('Florida exposure is uneven','Shaded walls, landscape-heavy sides of the house and areas repeatedly hit by irrigation can discolor faster than sunny elevations. Cleaning the affected buildup is different from fixing the moisture, irrigation or coating condition that allowed it to develop.')], 'service':'/house-washing-jacksonville-fl/','service_name':'House Washing','faqs':[('Can pressure washing crack stucco?','Aggressive pressure can damage weak areas, coatings or existing cracks. The surface should be inspected before choosing pressure and distance.'),('Is soft washing always safe for stucco?','No method is automatically safe. Existing cracks, paint condition, chemistry, spray direction and rinsing all matter.'),('Does stucco need special stain treatment?','Rust, efflorescence and oxidation-like coating issues can require different treatment from ordinary organic buildup.')], 'sources':[]},
          {'cat':'roof-cleaning','slug':'how-long-does-roof-cleaning-last','title':'How Long Does Roof Cleaning Last in Florida?','desc':'What affects how quickly roof streaks and organic discoloration return after cleaning in Florida.','quick':'Roof cleaning is not permanent. How long the visible result lasts depends on roof material, shade, tree cover, moisture, drainage, nearby vegetation and the type of growth or staining that was treated.','sections':[('Why recurrence varies from roof to roof','A roof under heavy tree cover can stay shaded and collect more debris than an open roof with good sun exposure. Valleys, north-facing slopes and areas near overhanging branches may dry more slowly. Those site conditions influence how quickly organic discoloration can return.'),('Cleaning does not change the environment','A professional cleaning can address existing organic staining, but it does not remove surrounding trees, humidity or future rainfall. Homeowners should think of roof cleaning as maintenance rather than a one-time permanent cure.'),('Roof material and manufacturer guidance matter','Asphalt shingles, tile and metal roofs have different surfaces, coatings and manufacturer requirements. The method used for the first cleaning can also affect the roof condition. Aggressive pressure on asphalt shingles is not an appropriate shortcut.'),('What can help between cleanings','Keeping gutters clear, removing roof debris safely and managing overhanging vegetation can reduce some moisture and debris retention. Any work on or near a roof involves fall risk, so access and safety should be considered before maintenance.')], 'service':'/roof-cleaning-jacksonville-fl/','service_name':'Roof Cleaning','faqs':[('Is roof cleaning permanent?','No. Environmental conditions can allow organic discoloration to return over time.'),('Does shade make roof streaks return faster?','Shade and slower drying can contribute to conditions that favor recurring organic growth.'),('Should I pressure wash a shingle roof when stains return?','Asphalt-roofing guidance warns against power washing asphalt shingles. Roof-specific low-pressure methods should be used instead.')], 'sources':[('Asphalt Roofing Manufacturers Association algae-discoloration bulletin','https://www.asphaltroofing.org/wp-content/uploads/2017/05/Algae-Discoloration-of-Roofs_20240606_FINAL.pdf')]},
          {'cat':'roof-cleaning','slug':'can-you-pressure-wash-roof-shingles','title':'Can You Pressure Wash Roof Shingles? Why Asphalt Roofs Need a Different Method','desc':'Why asphalt-shingle roofs should not be cleaned like concrete and what roofing-industry guidance says about power washing.','quick':'Asphalt-shingle roofs should not be power washed. Roofing-industry guidance warns that high pressure and scrubbing can loosen or remove granules. Roof cleaning should use a roof-specific low-pressure process consistent with the shingle manufacturer’s instructions.','sections':[('High pressure can damage the shingle surface','Asphalt shingles depend on a protective granule surface. A pressure washer or aggressive brushing can remove granules and create mechanical damage that ordinary roof staining did not cause.'),('Black streaks are commonly organic discoloration','Dark roof streaks are often associated with algae discoloration rather than ordinary dirt. That is why simply increasing pressure is the wrong response. Treatment, dwell time and gentle rinsing are more important than blasting the surface.'),('Roof access is a separate safety issue','Cleaning solutions and algae can make roofing slippery. Working from a roof also creates fall hazards that do not exist when cleaning a driveway. Homeowners should consider access, pitch and professional safety practices before attempting roof work.'),('Follow the roofing manufacturer','Even within asphalt roofing, products and warranties differ. The roof manufacturer’s cleaning instructions should take priority over generic internet advice. A roof-cleaning company should be able to explain how its process aligns with that guidance.')], 'service':'/roof-cleaning-jacksonville-fl/','service_name':'Roof Cleaning','faqs':[('Can a pressure washer remove black roof streaks?','It may remove material mechanically, but asphalt-roofing guidance warns that high-pressure washing can damage shingles and should not be used.'),('Should roof shingles be scrubbed?','ARMA guidance warns against brushing or brooming algae from asphalt-roof surfaces.'),('What should be used instead?','Use a roof-specific method that follows the roofing manufacturer’s instructions and avoids aggressive mechanical cleaning.')], 'sources':[('ARMA: Algae Discoloration of Roofs','https://www.asphaltroofing.org/wp-content/uploads/2017/05/Algae-Discoloration-of-Roofs_20240606_FINAL.pdf')]},
          {'cat':'roof-cleaning','slug':'asphalt-shingle-roof-cleaning','title':'Asphalt Shingle Roof Cleaning: Soft Washing, Algae & Black Stains','desc':'A Florida guide to asphalt-shingle roof discoloration, low-pressure cleaning and the risks of scrubbing or power washing.','quick':'Asphalt-shingle roof cleaning should focus on treating organic discoloration without damaging the granule surface. Black streaks are commonly associated with algae, and industry guidance warns against power washing and abrasive scrubbing.','sections':[('Why black streaks appear','Roof discoloration can be caused by algae that becomes visible as dark streaking, especially on lighter roofing. Warm, humid conditions and moisture retention can make Florida roofs a common place for homeowners to notice the problem.'),('Why soft-wash language is common','The cleaning objective is to treat the staining while avoiding the mechanical force used on concrete. Low-pressure application and rinsing fit that goal better than a surface cleaner, turbo nozzle or close-range wand work.'),('Granules are part of the roof system','The visible mineral granules are not dirt to be blasted away. Removing them can accelerate wear and permanently change the shingle surface. That is why roof cleaning needs a different risk calculation from driveway washing.'),('Cleaning is maintenance, not reroofing','A cleaning can improve organic discoloration, but it does not repair cracked shingles, failed flashing, leaks or end-of-life roofing. Cleaning and roofing repairs are separate scopes and should be evaluated separately.')], 'service':'/roof-cleaning-jacksonville-fl/','service_name':'Roof Cleaning','faqs':[('Are black streaks always dirt?','No. Roofing-industry guidance identifies algae discoloration as a common cause of dark roof staining.'),('Can asphalt shingles be power washed?','ARMA advises against power washing asphalt roofing because high pressure can damage the shingles.'),('Will cleaning fix roof leaks?','No. Cleaning does not replace roofing repairs or correct flashing, shingle or underlayment failures.')], 'sources':[('ARMA technical bulletin on algae discoloration','https://www.asphaltroofing.org/wp-content/uploads/2017/05/Algae-Discoloration-of-Roofs_20240606_FINAL.pdf')]},
          {'cat':'roof-cleaning','slug':'metal-roof-cleaning-florida','title':'Metal Roof Cleaning in Florida: Soft Washing vs. Pressure Washing','desc':'What to consider before cleaning a painted or coated metal roof in Florida, including coatings, seams, oxidation and runoff.','quick':'Metal roofs are durable, but the visible finish, seams, fasteners, oxidation and manufacturer instructions still control the cleaning method. Do not assume that a strong substrate means aggressive pressure is appropriate for the coating.','sections':[('Metal roof does not mean one surface type','Standing-seam panels, exposed-fastener systems and different factory coatings can all be called metal roofs. The substrate may be strong while the finish is more sensitive. Identifying the roof system and coating is the first step.'),('Organic buildup and oxidation are different','Algae, pollen and surface grime may be removable with routine cleaning. Faded, chalky or oxidized coating is a finish condition. Washing can reveal oxidation more clearly but should not be represented as coating restoration.'),('Seams and runoff need attention','Roof cleaning introduces water and treatment solution around seams, penetrations, gutters and landscaping below. Spray direction and runoff management matter even when the panel itself is durable.'),('Manufacturer instructions should lead','Metal-roof manufacturers can specify compatible cleaners, concentrations and methods for their coatings. When those instructions are available, they should take priority over a generic pressure-washing recipe.')], 'service':'/roof-cleaning-jacksonville-fl/','service_name':'Roof Cleaning','faqs':[('Can metal roofs be pressure washed?','Some systems may tolerate controlled cleaning, but coating condition and manufacturer guidance should determine the method.'),('Will washing remove oxidation from a metal roof?','Routine cleaning is not the same as restoring an oxidized or faded coating.'),('Is soft washing used on metal roofs?','Low-pressure treatment can be appropriate for some roof systems, but chemistry and coating compatibility must be checked.')], 'sources':[]},
          {'cat':'roof-cleaning','slug':'tile-roof-cleaning-florida','title':'Tile Roof Cleaning in Florida: Clay and Concrete Tile Roofs','desc':'A homeowner guide to cleaning clay and concrete tile roofs while considering tile condition, coatings, pitch and water management.','quick':'Tile roofs need roof-specific cleaning, not a one-size-fits-all pressure setting. Clay and concrete tiles can differ in finish, age and condition, and cracked or loose tiles can create risks before cleaning begins.','sections':[('Tile type and condition come first','Concrete tile, clay tile and coated tile surfaces can look similar from the ground but behave differently. Age, surface wear, previous coatings and cracked tiles should be identified before cleaning.'),('Walking the roof can be part of the risk','Tile can break under point loads, and wet roof surfaces can be slippery. Access strategy is therefore part of the cleaning decision, not just the chemistry or pressure.'),('Organic growth versus permanent discoloration','Dark organic buildup may respond to roof treatment, while mineral staining, coating wear and color variation can remain. Setting that expectation before the job avoids treating every visible mark as the same problem.'),('Drainage and surrounding surfaces matter','Roof runoff may pass through gutters, over pool areas or near landscaping. A complete roof-cleaning plan should consider where treatment and rinse water travel after leaving the tile surface.')], 'service':'/roof-cleaning-jacksonville-fl/','service_name':'Roof Cleaning','faqs':[('Are clay and concrete tile cleaned the same way?','Not automatically. Material, coating, age and condition can change the appropriate method.'),('Can broken tile be fixed by cleaning?','No. Cracked, loose or damaged tiles are roofing issues, not cleaning issues.'),('Does tile roof cleaning remove every stain?','No. Organic buildup, mineral staining, coating wear and permanent discoloration can respond differently.')], 'sources':[]},
          {'cat':'gutters','slug':'gutter-tiger-stripes','title':'What Are Gutter Tiger Stripes? How Gutter Brightening Removes Black Streaks','desc':'Why dark vertical streaks form on gutter faces and why exterior gutter brightening is different from cleaning debris out of the gutter channel.','quick':'Gutter tiger stripes are dark vertical streaks on the outside face of gutters. They are a different problem from leaves and debris inside the gutter, so an interior gutter cleanout does not automatically brighten the exterior face.','sections':[('Interior cleaning and exterior appearance are separate scopes','Gutter cleaning usually focuses on removing leaves, roof grit and debris from the channel and checking accessible downspouts. Tiger stripes are on the exterior painted face. A gutter can drain correctly and still look streaked from the ground.'),('Why stronger water pressure is not the whole answer','The streaking can bond to the painted gutter surface. More pressure can increase the risk of marking paint without addressing the chemistry of the stain. Exterior brightening is therefore treated as a separate cleaning process.'),('Paint condition still matters','Older gutters can have oxidation, chalking, faded paint or previous abrasion. Those conditions can limit how uniform the final appearance becomes. A professional should distinguish removable streaking from coating deterioration before promising a result.'),('How this fits with a house wash','A standard house wash can remove general organic film from gutters and fascia, but bonded exterior gutter streaks may remain. If appearance of the gutter face matters, ask whether gutter brightening is included or quoted separately.')], 'service':'/gutter-cleaning-jacksonville-fl/gutter-brightening/','service_name':'Gutter Brightening','faqs':[('Are tiger stripes inside the gutter?','No. The term usually refers to vertical staining on the outside face of the gutter.'),('Will normal gutter cleaning remove tiger stripes?','Not necessarily. Interior debris removal and exterior brightening are different scopes.'),('Can gutter paint oxidation affect the result?','Yes. Oxidation and coating wear can limit how evenly the gutter face responds to cleaning.')], 'sources':[]}
          ]
          def render(a):
            path=f"/learning-center/{a['cat']}/{a['slug']}/"; url=BASE+path
            sec=''.join(f'<h2>{html.escape(h)}</h2><p>{html.escape(t)}</p>' for h,t in a['sections'])
            src=''
            if a['sources']:
              src='<h2>Sources &amp; manufacturer guidance</h2><ul class="sources">'+''.join(f'<li><a href="{u}" rel="noopener">{html.escape(n)}</a></li>' for n,u in a['sources'])+'</ul>'
            faqhtml='<div class="faq"><h2>Frequently asked questions</h2>'+''.join(f'<details><summary>{html.escape(q)}</summary><p>{html.escape(ans)}</p></details>' for q,ans in a['faqs'])+'</div>'
            body=f'<p class="quick-answer"><strong>Quick answer:</strong> {html.escape(a["quick"])}</p>{sec}<p class="article-note">For a property-specific cleaning decision, inspect the material, existing damage, access, runoff and specialty staining before choosing pressure or chemistry.</p>{src}<div class="related"><h2>Related Jacksonville service</h2><p><a href="{a["service"]}">{html.escape(a["service_name"])} →</a></p><p><a href="/learning-center/">Browse the Learning Center →</a></p></div>{faqhtml}'
            wc=len(re.findall(r'\b\w+\b',re.sub('<[^>]+>',' ',body)))
            schema={'@context':'https://schema.org','@graph':[{'@type':'WebPage','@id':url+'#webpage','url':url,'name':a['title'],'description':a['desc'],'inLanguage':'en-US','isPartOf':{'@id':BASE+'/#website'},'mainEntity':{'@id':url+'#article'},'breadcrumb':{'@id':url+'#breadcrumb'},'datePublished':DATE,'dateModified':DATE},{'@type':'BlogPosting','@id':url+'#article','mainEntityOfPage':{'@id':url+'#webpage'},'headline':a['title'],'description':a['desc'],'datePublished':DATE,'dateModified':DATE,'author':{'@id':BASE+'/#business'},'publisher':{'@id':BASE+'/#business'},'articleSection':a['cat'].replace('-',' ').title(),'inLanguage':'en-US','isAccessibleForFree':True,'wordCount':wc},{'@type':'BreadcrumbList','@id':url+'#breadcrumb','itemListElement':[{'@type':'ListItem','position':1,'name':'Home','item':BASE+'/'},{'@type':'ListItem','position':2,'name':'Learning Center','item':BASE+'/learning-center/'},{'@type':'ListItem','position':3,'name':a['title'],'item':url}]},{'@type':'FAQPage','@id':url+'#faq','mainEntity':[{'@type':'Question','name':q,'acceptedAnswer':{'@type':'Answer','text':ans}} for q,ans in a['faqs']]}]}
            return f'''<!doctype html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{html.escape(a['title'])}</title><meta name="description" content="{html.escape(a['desc'],quote=True)}"><meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1"><meta name="author" content="Jacksonville Pressure Washing"><link rel="canonical" href="{url}"><link rel="alternate" type="text/plain" href="/llms.txt" title="Jacksonville Pressure Washing AI retrieval reference"><meta property="og:type" content="article"><meta property="og:site_name" content="Jacksonville Pressure Washing"><meta property="og:title" content="{html.escape(a['title'],quote=True)}"><meta property="og:description" content="{html.escape(a['desc'],quote=True)}"><meta property="og:url" content="{url}"><meta property="article:published_time" content="{DATE}"><meta property="article:modified_time" content="{DATE}"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/header.css">{STYLE}<script type="application/ld+json">{json.dumps(schema,separators=(',',':'))}</script></head><body>{NAV}<main><div class="article-shell"><article class="article-card"><nav class="blog-breadcrumb"><a href="/">Home</a><span>›</span><a href="/learning-center/">Learning Center</a><span>›</span><span>{html.escape(a['title'])}</span></nav><header class="article-header"><p class="article-category">{html.escape(a['cat'].replace('-',' ').title())}</p><h1>{html.escape(a['title'])}</h1><p class="article-dek">{html.escape(a['desc'])}</p><p class="article-meta">Updated August 17, 2026 · Jacksonville Pressure Washing field guide</p><p class="article-review">Written and reviewed by Jacksonville Pressure Washing, a licensed and insured exterior-cleaning company serving Jacksonville and surrounding Northeast Florida communities.</p></header><div class="article-content">{body}</div></article></div></main><script>const t=document.querySelector('.home-header .nav-toggle'),m=document.querySelector('.home-menubar');t?.addEventListener('click',()=>{{const o=m.classList.toggle('open');t.setAttribute('aria-expanded',o)}});document.querySelectorAll('.home-menubar .drop-toggle').forEach(b=>b.addEventListener('click',e=>{{if(window.innerWidth<=980){{e.preventDefault();b.parentElement.classList.toggle('open')}}}}));</script></body></html>'''
          newurls=[]
