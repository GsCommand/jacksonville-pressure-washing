name: Swap Homepage Footer Links

on:
  push:
    paths:
      - '.github/workflows/swap-home-footer-links.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap Gutter Brightening and Patio Sidewalk links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<a href="/Gutters-Jacksonville-Fl/gutter-brightening/">Gutter Brightening</a><a href="/Pressure-Washing-Jacksonville-fl/sidewalk-cleaning/">Patio &amp; Sidewalk Cleaning</a>'
          new = '<a href="/Pressure-Washing-Jacksonville-fl/sidewalk-cleaning/">Patio &amp; Sidewalk Cleaning</a><a href="/Gutters-Jacksonville-Fl/gutter-brightening/">Gutter Brightening</a>'
          if old not in s:
              raise SystemExit('Expected homepage footer link sequence not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit update and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/swap-home-footer-links.yml
          git commit -m 'Swap homepage gutter and sidewalk footer links'
          git push
