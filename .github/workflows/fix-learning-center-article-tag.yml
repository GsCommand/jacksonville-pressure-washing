name: Fix Learning Center Article Tag

on:
  push:
    paths:
      - '.github/workflows/fix-learning-center-article-tag.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix doubled article tag delimiter
        run: |
          python - <<'PY'
          from pathlib import Path
          marker = 'itemtype="https://schema.org/BlogPosting">>'
          replacement = 'itemtype="https://schema.org/BlogPosting">'
          changed = 0
          for path in Path('learning-center').glob('**/index.html'):
              if path == Path('learning-center/index.html'):
                  continue
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  text = text.replace(marker, replacement)
                  path.write_text(text, encoding='utf-8')
                  changed += 1
          Path('.github/workflows/fix-learning-center-article-tag.yml').unlink()
          print(f'Fixed {changed} article files')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Learning Center article microdata tag"
          git push
