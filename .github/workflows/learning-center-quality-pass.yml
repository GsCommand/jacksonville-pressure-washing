name: Learning Center quality pass
on:
  push:
    branches: [main]
    paths: ['.github/workflows/learning-center-quality-pass.yml']
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand new guides and sync Learning Center hub
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json,html
          W=Path('.github/workflows/learning-center-quality-pass.yml')
          new_paths=[
          'house-washing/what-is-soft-washing','house-washing/how-often-pressure-wash-house-florida','house-washing/can-you-pressure-wash-vinyl-siding','house-washing/can-you-pressure-wash-stucco','roof-cleaning/how-long-does-roof-cleaning-last','roof-cleaning/can-you-pressure-wash-roof-shingles','roof-cleaning/asphalt-shingle-roof-cleaning','roof-cleaning/metal-roof-cleaning-florida','roof-cleaning/tile-roof-cleaning-florida','gutters/gutter-tiger-stripes','gutters/gutter-cleaning-vs-gutter-brightening','gutters/clogged-downspout-signs','fences/vinyl-fence-cleaning-florida','fences/wood-vs-vinyl-fence-cleaning','decks/deck-cleaning-jacksonville','decks/deck-cleaning-before-staining','patios/patio-cleaning-jacksonville','comparisons/does-pressure-washing-remove-mold-mildew-algae','house-washing/pressure-washing-before-painting','pool-areas/pool-cage-vs-screen-enclosure-cleaning']
          extras={
          'house-washing':'''<h2>What to inspect before exterior house cleaning</h2><ul class="checklist"><li><strong>Paint and coatings:</strong> Peeling, chalking or faded finishes can react differently from ordinary dirt.</li><li><strong>Seams and openings:</strong> Windows, vents, electrical fixtures, failed caulk and penetrations need controlled spray direction.</li><li><strong>Surface material:</strong> Vinyl, stucco, fiber cement, brick and painted trim should not automatically receive the same pressure.</li><li><strong>Specialty stains:</strong> Rust, oxidation and permanent discoloration may need separate treatment.</li></ul><h2>When washing is not the whole repair</h2><p>Exterior cleaning can improve removable organic buildup and surface grime, but it does not repair failed paint, cracked stucco, damaged siding, rotten trim or leaking openings. Those conditions should be identified before cleaning and repaired by the appropriate trade when needed. A clear scope separates cleaning from restoration so the homeowner knows what improvement is realistic.</p>''',
          'roof-cleaning':'''<h2>What to inspect before roof cleaning</h2><ul class="checklist"><li><strong>Roof material:</strong> Asphalt shingles, clay tile, concrete tile and coated metal each have different cleaning limits.</li><li><strong>Age and condition:</strong> Broken tile, loose shingles, failed coatings and flashing issues are roofing conditions, not cleaning problems.</li><li><strong>Pitch and access:</strong> Roof work adds fall and slip hazards that should influence the service plan.</li><li><strong>Runoff path:</strong> Gutters, landscaping, siding, pools and hardscape below the roof can receive cleaning runoff.</li></ul><h2>When roof cleaning is not enough</h2><p>Cleaning can address compatible organic staining, but it does not fix leaks, deteriorated roofing, failed flashing or structural problems. If the roof shows damage beyond surface discoloration, a roofing inspection may be more important than cleaning. Manufacturer cleaning guidance should also take priority over a generic exterior-washing method.</p>''',
          'gutters':'''<h2>What to inspect around a gutter system</h2><ul class="checklist"><li><strong>Channel debris:</strong> Leaves, roof grit and compacted organic material can restrict flow.</li><li><strong>Outlets and downspouts:</strong> A clean-looking gutter can still have a blockage below the visible channel.</li><li><strong>Pitch and attachment:</strong> Sagging, separated or incorrectly pitched gutters may hold water even after cleaning.</li><li><strong>Exterior coating:</strong> Tiger stripes, oxidation and faded paint are appearance issues separate from drainage.</li></ul><h2>Cleaning versus gutter repair</h2><p>Gutter cleaning can restore flow when debris is the cause, but it cannot correct failed seams, loose hangers, poor pitch, undersized drainage or damaged downspouts. Exterior brightening is also a separate cosmetic scope. Identifying the actual problem before service prevents a cleaning job from being expected to solve a repair or coating issue.</p>''',
          'fences':'''<h2>What to inspect before fence cleaning</h2><ul class="checklist"><li><strong>Material:</strong> Wood, vinyl and PVC require different pressure and chemistry decisions.</li><li><strong>Finish:</strong> Paint, stain, oxidation and sun fading can affect the final appearance.</li><li><strong>Hardware:</strong> Hinges, latches, fasteners and decorative caps should not be treated as ordinary flat surface.</li><li><strong>Landscaping:</strong> Shrubs and groundcover often sit directly against fence panels and need protection.</li></ul><h2>Cleaning versus fence restoration</h2><p>A fence can be clean and still look weathered. Gray wood, peeling stain, oxidized vinyl, scratches and permanent discoloration are not the same as removable organic film. Cleaning should remove compatible buildup without promising that age, coating failure or surface damage will disappear.</p>''',
          'decks':'''<h2>What to inspect before deck cleaning</h2><ul class="checklist"><li><strong>Product and age:</strong> Wood species and composite product generations can have different care limits.</li><li><strong>Existing coating:</strong> Stain, paint or sealer may be sound, failing or partially worn.</li><li><strong>Fasteners and boards:</strong> Loose boards, splinters, exposed fasteners and damaged edges deserve attention before washing.</li><li><strong>Future coating plans:</strong> Cleaning before staining should match the coating manufacturer’s preparation requirements.</li></ul><h2>Why a test area matters</h2><p>A small inconspicuous test can reveal raised grain, coating loss, color change or manufacturer-sensitive composite surfaces before the entire deck is cleaned. This is especially important when the deck product or previous coating is unknown. The safest process is the least aggressive method that achieves the cleaning goal without creating a new restoration problem.</p>''',
          'patios':'''<h2>What to inspect before patio cleaning</h2><ul class="checklist"><li><strong>Surface type:</strong> Plain concrete, brick, pavers, coatings and natural stone do not share one cleaning method.</li><li><strong>Joints:</strong> Loose sand or polymeric joint material can be disturbed by pressure.</li><li><strong>Stains:</strong> Oil, rust, irrigation minerals and tannins may require separate chemistry.</li><li><strong>Adjacent areas:</strong> Doors, screens, landscaping, pools and furniture affect spray and runoff control.</li></ul><h2>Cleaning versus restoration</h2><p>General patio cleaning targets removable dirt and organic buildup. Replacing joint sand, stripping failed sealer, repairing pavers or restoring coatings are separate scopes. A useful quote should identify the surface and the visible problem before deciding whether ordinary cleaning is enough.</p>''',
          'comparisons':'''<h2>What to inspect before treating organic buildup</h2><ul class="checklist"><li><strong>Surface:</strong> Concrete, siding, wood and roofing have different pressure and chemistry limits.</li><li><strong>Moisture source:</strong> Shade, drainage, irrigation and leaks can contribute to recurring growth.</li><li><strong>Type of discoloration:</strong> Organic film can be confused with rust, oxidation, mineral staining or coating failure.</li><li><strong>Surroundings:</strong> Plants, metals, painted surfaces and drainage paths influence treatment and rinsing.</li></ul><h2>Why recurring growth is a property condition too</h2><p>Exterior cleaning can remove visible buildup, but it does not change every environmental condition that supports recurrence. Improving drainage, correcting irrigation overspray, removing trapped debris and allowing surfaces to dry can be just as important as the cleaning method when the same area repeatedly turns green or dark.</p>''',
          'pool-areas':'''<h2>What to inspect before pool-area cleaning</h2><ul class="checklist"><li><strong>Frame and screen condition:</strong> Oxidized aluminum, loose spline and damaged mesh need conservative handling.</li><li><strong>Deck material:</strong> Concrete, pavers, coatings and natural stone can require different methods.</li><li><strong>Pool water:</strong> Spray and runoff should be managed so cleaning solution is not carelessly directed into the pool.</li><li><strong>Furniture and landscaping:</strong> Outdoor living areas often have more sensitive items than an open driveway.</li></ul><h2>Why the quote should name each surface</h2><p>“Pool cage cleaning” can mean only the frame and screens to one company and frame, screens and deck to another. Listing the enclosure, doors, tracks, deck, coping and adjacent surfaces separately makes the scope easier to compare and prevents assumptions about what is included.</p>'''}
          for rel in new_paths:
            f=Path('learning-center')/rel/'index.html'; s=f.read_text(); cat=rel.split('/')[0]
            if 'What to inspect before' not in s and 'What to inspect around' not in s:
              marker='<p class="article-note">'
              i=s.find(marker)
              if i<0: raise SystemExit(f'note marker missing {f}')
              s=s[:i]+extras[cat]+s[i:]
            m=re.search(r'<div class="article-content">(.*?)</div></article>',s,re.S)
            if m:
              wc=len(re.findall(r'\b\w+\b',re.sub('<[^>]+>',' ',m.group(1))))
              s=re.sub(r'"wordCount":\d+',f'"wordCount":{wc}',s,count=1)
            f.write_text(s)
          # Hub metadata/schema now reflects 45 article guides.
          hub=Path('learning-center/index.html'); hs=hub.read_text()
          hs=hs.replace('Twenty-five buyer-focused exterior-cleaning guides','Forty-five buyer-focused exterior-cleaning guides')
          hs=hs.replace('<strong>25 live guides</strong><span>All 25 AI-search topics are now published</span>','<strong>45 live guides</strong><span>45 homeowner and AI-search guides are now published</span>')
          scripts=list(re.finditer(r'<script type="application/ld\+json">(.*?)</script>',hs,re.S))
          if scripts:
            mm=scripts[0]; data=json.loads(mm.group(1)); item=next((x for x in data.get('@graph',[]) if x.get('@type')=='ItemList'),None)
            if item:
              existing=item.get('itemListElement',[]); seen={x.get('url') for x in existing}; pos=len(existing)
              titles=[
              ('What Is Soft Washing? How Soft Washing Works on Florida Homes','house-washing/what-is-soft-washing'),('How Often Should You Pressure Wash Your House in Florida?','house-washing/how-often-pressure-wash-house-florida'),('Can You Pressure Wash Vinyl Siding?','house-washing/can-you-pressure-wash-vinyl-siding'),('Can You Pressure Wash Stucco?','house-washing/can-you-pressure-wash-stucco'),('How Long Does Roof Cleaning Last in Florida?','roof-cleaning/how-long-does-roof-cleaning-last'),('Can You Pressure Wash Roof Shingles?','roof-cleaning/can-you-pressure-wash-roof-shingles'),('Asphalt Shingle Roof Cleaning','roof-cleaning/asphalt-shingle-roof-cleaning'),('Metal Roof Cleaning in Florida','roof-cleaning/metal-roof-cleaning-florida'),('Tile Roof Cleaning in Florida','roof-cleaning/tile-roof-cleaning-florida'),('What Are Gutter Tiger Stripes?','gutters/gutter-tiger-stripes'),('Gutter Cleaning vs. Gutter Brightening','gutters/gutter-cleaning-vs-gutter-brightening'),('How to Tell if a Downspout Is Clogged','gutters/clogged-downspout-signs'),('Vinyl Fence Cleaning in Florida','fences/vinyl-fence-cleaning-florida'),('Wood Fence vs. Vinyl Fence Cleaning','fences/wood-vs-vinyl-fence-cleaning'),('Deck Cleaning in Jacksonville','decks/deck-cleaning-jacksonville'),('How to Clean a Deck Before Staining','decks/deck-cleaning-before-staining'),('Patio Cleaning in Jacksonville','patios/patio-cleaning-jacksonville'),('Does Pressure Washing Remove Mold, Mildew and Algae From Concrete?','comparisons/does-pressure-washing-remove-mold-mildew-algae'),('Pressure Washing Before Painting','house-washing/pressure-washing-before-painting'),('Pool Cage vs. Screen Enclosure Cleaning','pool-areas/pool-cage-vs-screen-enclosure-cleaning')]
              for title,rel in titles:
                url='https://jacksonvillepressurewashingfl.com/learning-center/'+rel+'/'
                if url not in seen:
                  pos+=1; existing.append({'@type':'ListItem','position':pos,'name':title,'url':url}); seen.add(url)
              item['numberOfItems']=len(existing); item['itemListElement']=existing
              hs=hs[:mm.start(1)]+json.dumps(data,separators=(',',':'))+hs[mm.end(1):]
          hub.write_text(hs)
          W.unlink()
          PY
      - name: Commit
        run: |
          git config user.name "Greg Soucy"
          git config user.email "GREG@COMMANDLAYER.ORG"
          git add -A
          git commit -m "Expand new Learning Center guides and sync hub schema"
          git push
