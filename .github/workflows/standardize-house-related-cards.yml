name: Standardize House dropdown related cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-related-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update related-service image cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('styles.css')
          css = css_path.read_text()
          marker = '/* House dropdown related-service card images */'
          if marker not in css:
              css += r'''

/* House dropdown related-service card images */
.hw-related a::before,.rw-related a::before,.pc-related a::before,.se-related a::before{content:"";display:block;height:190px;margin:-24px -24px 20px;background-size:cover;background-position:center;border-radius:21px 21px 0 0}
.hw-related a:nth-child(1)::before{background-image:url('/images/roof washing.jpg')}
.hw-related a:nth-child(2)::before{background-image:url('/images/gutter-cleaning.webp')}
.hw-related a:nth-child(3)::before{background-image:url('/images/jacksonville-pressure-washing-driveway.webp')}
.rw-related a:nth-child(1)::before{background-image:url('/images/jackosnville-houe-washing.jpeg')}
.rw-related a:nth-child(2)::before{background-image:url('/images/gutter-cleaning.webp')}
.rw-related a:nth-child(3)::before{background-image:url('/nocatee-roof-washing.webp')}
.pc-related a:nth-child(1)::before{background-image:url('/images/screen-enclosure.jpeg')}
.pc-related a:nth-child(2)::before{background-image:url('/images/pool-deck-cleaning.jpg')}
.pc-related a:nth-child(3)::before{background-image:url('/images/jackosnville-houe-washing.jpeg')}
.pc-related a:nth-child(4)::before{background-image:url('/images/gutter-cleaning.webp')}
.pc-related a:nth-child(5)::before{background-image:url('/images/sidewalk-pressure-washing.jpg')}
.pc-related a:nth-child(6)::before{background-image:url('/nocatee-roof-washing.webp')}
.se-related a:nth-child(1)::before{background-image:url('/images/pool-cage-enclosure-cleaning.jpeg')}
.se-related a:nth-child(2)::before{background-image:url('/images/pool-deck-cleaning.jpg')}
.se-related a:nth-child(3)::before{background-image:url('/images/sidewalk-pressure-washing.jpg')}
.se-related a:nth-child(4)::before{background-image:url('/images/jackosnville-houe-washing.jpeg')}
.se-related a:nth-child(5)::before{background-image:url('/images/fence-cleaning-jacksonville.jpg')}
.se-related a:nth-child(6)::before{background-image:url('/nocatee-roof-washing.webp')}
.soft-related{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}
.soft-related a{display:block;overflow:hidden;border:1px solid #dce5ea;border-radius:22px;background:#fff;text-decoration:none;color:inherit;box-shadow:0 14px 34px rgba(11,45,74,.06);transition:transform .2s ease,box-shadow .2s ease}
.soft-related a:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(11,45,74,.09)}
.soft-related img{display:block;width:100%;height:190px;object-fit:cover}
.soft-related .soft-card-copy{padding:24px}
.soft-related h3{margin:0 0 6px;color:#0b2d4a;font-size:20px}
.soft-related p{margin:0;color:#536475;font-size:14px;line-height:1.5}
@media(max-width:980px){.soft-related{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.hw-related a::before,.rw-related a::before,.pc-related a::before,.se-related a::before{height:180px}.soft-related{grid-template-columns:1fr}.soft-related img{height:180px}}
'''
              css_path.write_text(css)

          soft_path = Path('House-Washing-Jacksonville-FL/soft-washing/index.html')
          soft = soft_path.read_text()
          soft_marker = 'soft-related-services'
          if soft_marker not in soft:
              related = '''<section class="section muted" id="soft-related-services"><div class="shell"><div class="section-heading"><span>Related exterior cleaning</span><h2>Soft washing connects with other exterior-cleaning services</h2><p>Choose the surface-specific service when you know what needs attention, or include multiple areas in one quote request.</p></div><div class="soft-related"><a href="/House-Washing-Jacksonville-FL/"><img src="/images/jackosnville-houe-washing.jpeg" alt="House washing in Jacksonville" loading="lazy"><div class="soft-card-copy"><h3>House Washing</h3><p>Low-pressure exterior cleaning for siding, stucco, soffits, fascia and trim.</p></div></a><a href="/House-Washing-Jacksonville-FL/roof-washing/"><img src="/images/roof washing.jpg" alt="Roof washing in Jacksonville" loading="lazy"><div class="soft-card-copy"><h3>Roof Washing</h3><p>Roof-specific low-pressure cleaning for compatible shingles, tile and metal roofing.</p></div></a><a href="/House-Washing-Jacksonville-FL/pool-cage-cleaning/"><img src="/images/pool-cage-enclosure-cleaning.jpeg" alt="Pool cage cleaning in Jacksonville" loading="lazy"><div class="soft-card-copy"><h3>Pool Cage Cleaning</h3><p>Controlled cleaning for pool enclosure screens, framing and related cage surfaces.</p></div></a><a href="/House-Washing-Jacksonville-FL/screen-enclosure-cleaning/"><img src="/images/screen-enclosure.jpeg" alt="Screen enclosure cleaning in Jacksonville" loading="lazy"><div class="soft-card-copy"><h3>Screen Enclosure Cleaning</h3><p>Cleaning for screened patios, lanais, mesh panels and aluminum framing.</p></div></a><a href="/Gutters-Jacksonville-Fl/"><img src="/images/gutter-cleaning.webp" alt="Gutter cleaning in Jacksonville" loading="lazy"><div class="soft-card-copy"><h3>Gutter Cleaning</h3><p>Interior debris removal and accessible downspout cleaning around the roofline.</p></div></a><a href="/Pressure-Washing-Jacksonville-fl/"><img src="/images/jacksonville-pressure-washing-driveway.webp" alt="Pressure washing in Jacksonville" loading="lazy"><div class="soft-card-copy"><h3>Pressure Washing</h3><p>Controlled pressure cleaning for durable concrete and compatible hard surfaces.</p></div></a></div></div></section>'''
              target = '<section class="cta">'
              if target not in soft:
                  raise SystemExit('Soft washing CTA target not found')
              soft = soft.replace(target, related + target, 1)
              soft_path.write_text(soft)

          workflow = Path('.github/workflows/standardize-house-related-cards.yml')
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css House-Washing-Jacksonville-FL/soft-washing/index.html .github/workflows/standardize-house-related-cards.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add image cards across House Washing dropdown"
          git push
