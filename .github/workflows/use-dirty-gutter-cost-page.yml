name: Use dirty gutter image on cost page
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update gutter cost page images
        run: |
          cp "images/dirty-gutters.jpg" "images/dirty-gutter.jpeg"
          python - <<'PY'
          from pathlib import Path
          p = Path('Gutters-Jacksonville-Fl/gutter-cleaning-cost/index.html')
          s = p.read_text()
          s = s.replace('<link rel="preload" as="image" href="/images/gutter-cleaning.webp">','<link rel="preload" as="image" href="/images/dirty-gutter.jpeg">',1)
          s = s.replace('https://jacksonvillepressurewashingfl.com/images/gutter-cleaning.webp','https://jacksonvillepressurewashingfl.com/images/dirty-gutter.jpeg')
          old = '<section class="home-photo-banner" aria-label="Gutter cleaning cost in Jacksonville"><img src="/images/gutter-cleaning.webp" alt="Gutter cleaning quote and cost planning in Jacksonville Florida">'
          new = '<section class="home-photo-banner" aria-label="Gutter cleaning cost in Jacksonville"><img src="/images/dirty-gutter.jpeg" alt="Leaves and organic debris built up inside a rain gutter in Northeast Florida">'
          if old not in s:
              raise SystemExit('Hero target not found')
          s = s.replace(old,new,1)
          css_anchor = '.gcp-jump span{color:#536475;font-size:13px;line-height:1.45}'
          css_add = css_anchor + '.gcp-jump a[href="/Gutters-Jacksonville-Fl/"]{overflow:hidden;padding:0 20px 20px}.gcp-jump a[href="/Gutters-Jacksonville-Fl/"]::before{content:"";display:block;height:120px;margin:0 -20px 16px;background:url(\'/images/dirty-gutter.jpeg\') center/cover no-repeat}.gcp-links a[href="/Gutters-Jacksonville-Fl/"]::before{background-image:url(\'/images/dirty-gutter.jpeg\')!important}'
          if css_anchor not in s:
              raise SystemExit('CSS anchor not found')
          s = s.replace(css_anchor, css_add, 1)
          p.write_text(s)
          Path('.github/workflows/use-dirty-gutter-cost-page.yml').unlink()
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "images/dirty-gutter.jpeg" Gutters-Jacksonville-Fl/gutter-cleaning-cost/index.html .github/workflows/use-dirty-gutter-cost-page.yml
          git commit -m "Use dirty gutter image across gutter cost page"
          git push