name: Update Fence Hero
on:
  push:
    paths:
      - '.github/workflows/update-fence-hero.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace fence hero image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Pressure-Washing-Jacksonville-fl/fence-cleaning/index.html')
          s = p.read_text()
          old = '<section class="home-photo-banner" aria-label="Fence cleaning in Jacksonville"><img src="/nocatee-roof-washing.webp" alt="Fence cleaning service in Jacksonville Florida">'
          new = '<section class="home-photo-banner" aria-label="Fence cleaning in Jacksonville"><img src="/images/fence-cleaning-jacksonville.jpg" alt="Fence cleaning service in Jacksonville Florida">'
          if old not in s:
              raise SystemExit('Expected fence hero markup not found')
          p.write_text(s.replace(old, new, 1))
          Path('.github/workflows/update-fence-hero.yml').unlink()
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update fence cleaning hero image"
          git push
