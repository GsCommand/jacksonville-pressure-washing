name: Apply related card styles
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply related card styles
        run: |
          echo '' | base64 -d > related-cards.css
          python -c "from pathlib import Path; p=Path('header.css'); s=p.read_text(); imp=\"@import url('/related-cards.css');\\n\"; p.write_text(s if s.startswith(imp) else imp+s)"
          rm -f .github/workflows/apply-related-cards.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add header.css related-cards.css .github/workflows/apply-related-cards.yml
          git commit -m "Add image cards to gutter and service-area bottom links"
          git push
