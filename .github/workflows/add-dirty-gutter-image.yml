name: Add gutter buildup image
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update gutter buildup section image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Gutters-Jacksonville-Fl/index.html')
          s = p.read_text()
          old = '<img src="/images/gutter-cleaning.webp" alt="Rain gutter debris removal on a Jacksonville home" loading="lazy" decoding="async">'
          new = '<img src="/images/dirty-gutters.jpg" alt="Leaves and organic debris built up inside a rain gutter in Northeast Florida" loading="lazy" decoding="async">'
          if old not in s:
              raise SystemExit('Target gutter image not found')
          p.write_text(s.replace(old, new, 1))
          Path('.github/workflows/add-dirty-gutter-image.yml').unlink()
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gutters-Jacksonville-Fl/index.html .github/workflows/add-dirty-gutter-image.yml
          git commit -m "Use dirty gutter photo in debris section"
          git push