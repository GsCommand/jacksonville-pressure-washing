name: Add Learning Center search directory
on:
  push:
    paths:
      - '.github/workflows/add-learning-center-search-directory.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add searchable six-topic directory
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('learning-center/index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="lc-guide-search"' in s:
              raise SystemExit('Learning Center search already exists')

          cats = [
            ('Pressure Washing & Concrete', [
              ('Power Washing vs. Pressure Washing vs. Pressure Cleaning','/learning-center/comparisons/power-washing-vs-pressure-washing-vs-pressure-cleaning/'),
              ('Driveway Pressure Washing','/learning-center/driveways/driveway-pressure-washing/'),
              ('Oil Stains on Concrete','/learning-center/driveways/oil-stains-on-concrete/'),
              ('Does Pressure Washing Remove Mold, Mildew and Algae From Concrete?','/learning-center/comparisons/does-pressure-washing-remove-mold-mildew-algae/'),
              ('Can Pressure Washing Damage Concrete? Etching, Lines and Surface-Cleaner Marks Explained','/learning-center/comparisons/can-pressure-washing-damage-concrete/'),
              ('How to Remove Tire Marks From a Concrete Driveway','/learning-center/driveways/remove-tire-marks-concrete-driveway/'),
            ]),
            ('House Washing & Soft Washing', [
              ('House Washing Companies Near Me','/learning-center/house-washing/house-washing-companies-near-me/'),
              ('Soft Washing vs. Pressure Washing a House','/learning-center/house-washing/soft-washing-vs-pressure-washing-a-house/'),
              ('Is Soft Washing Safe for Stucco and Siding?','/learning-center/house-washing/is-soft-washing-safe-for-stucco-and-siding/'),
              ('What Is Soft Washing? How Soft Washing Works on Florida Homes','/learning-center/house-washing/what-is-soft-washing/'),
              ('How Often Should You Pressure Wash Your House in Florida?','/learning-center/house-washing/how-often-pressure-wash-house-florida/'),
              ('Can You Pressure Wash Vinyl Siding?','/learning-center/house-washing/can-you-pressure-wash-vinyl-siding/'),
              ('Can You Pressure Wash Stucco?','/learning-center/house-washing/can-you-pressure-wash-stucco/'),
              ('Pressure Washing Before Painting','/learning-center/house-washing/pressure-washing-before-painting/'),
              ('What Does a Professional House Wash Include? Siding, Soffits, Fascia & Trim','/learning-center/house-washing/what-does-professional-house-wash-include/'),
              ('Why Does Green Algae Keep Coming Back on Florida House Siding?','/learning-center/house-washing/why-green-algae-keeps-coming-back-on-siding/'),
              ('Vinyl Siding Oxidation: Why a House Wash Can Reveal Chalky or Faded Areas','/learning-center/house-washing/vinyl-siding-oxidation-house-washing/'),
              ('Soffit & Fascia Cleaning in Jacksonville: Algae, Mildew and Spider Webs','/learning-center/house-washing/soffit-fascia-cleaning-jacksonville/'),
            ]),
            ('Roof Cleaning', [
              ('Best Roof Cleaning Companies in Jacksonville','/learning-center/roof-cleaning/best-roof-cleaning-companies-jacksonville/'),
              ('Soft Washing a Roof vs. Pressure Washing','/learning-center/roof-cleaning/soft-washing-roof-vs-pressure-washing/'),
              ('Black Roof Streaks & Algae Removal','/learning-center/roof-cleaning/black-roof-streaks-algae-removal/'),
              ('How Long Does Roof Cleaning Last in Florida?','/learning-center/roof-cleaning/how-long-does-roof-cleaning-last/'),
              ('Can You Pressure Wash Roof Shingles?','/learning-center/roof-cleaning/can-you-pressure-wash-roof-shingles/'),
              ('Asphalt Shingle Roof Cleaning','/learning-center/roof-cleaning/asphalt-shingle-roof-cleaning/'),
              ('Metal Roof Cleaning in Florida','/learning-center/roof-cleaning/metal-roof-cleaning-florida/'),
              ('Tile Roof Cleaning in Florida','/learning-center/roof-cleaning/tile-roof-cleaning-florida/'),
            ]),
            ('Gutters', [
              ('Best Gutter Cleaning Service Near Me','/learning-center/gutters/best-gutter-cleaning-service-near-me/'),
              ('How Often Florida Gutters Should Be Cleaned','/learning-center/gutters/how-often-should-gutters-be-cleaned-florida/'),
              ('What Are Gutter Tiger Stripes?','/learning-center/gutters/gutter-tiger-stripes/'),
              ('Gutter Cleaning vs. Gutter Brightening','/learning-center/gutters/gutter-cleaning-vs-gutter-brightening/'),
              ('How to Tell if a Downspout Is Clogged','/learning-center/gutters/clogged-downspout-signs/'),
              ('Are Gutter Guards Worth It in Florida—and Do They Still Need Cleaning?','/learning-center/gutters/are-gutter-guards-worth-it-florida/'),
              ('Interior Gutter Cleaning vs. Exterior Gutter Washing: What’s the Difference?','/learning-center/gutters/interior-gutter-cleaning-vs-exterior-gutter-washing/'),
            ]),
            ('Outdoor Surfaces', [
              ('Rust & Irrigation Stains','/learning-center/stains/rust-irrigation-stains/'),
              ('Pool Deck, Pool Cage & Screen Enclosure Cleaning','/learning-center/pool-areas/pool-deck-pool-cage-screen-enclosure-cleaning/'),
              ('Fence Cleaning','/learning-center/fences/fence-cleaning/'),
              ('Vinyl Fence Cleaning in Florida','/learning-center/fences/vinyl-fence-cleaning-florida/'),
              ('Wood Fence vs. Vinyl Fence Cleaning','/learning-center/fences/wood-vs-vinyl-fence-cleaning/'),
              ('Deck Cleaning in Jacksonville','/learning-center/decks/deck-cleaning-jacksonville/'),
              ('How to Clean a Deck Before Staining','/learning-center/decks/deck-cleaning-before-staining/'),
              ('Patio Cleaning in Jacksonville','/learning-center/patios/patio-cleaning-jacksonville/'),
              ('Pool Cage vs. Screen Enclosure Cleaning','/learning-center/pool-areas/pool-cage-vs-screen-enclosure-cleaning/'),
            ]),
            ('Cost, Hiring & Local', [
              ('Best Pressure Washing Companies in Jacksonville','/learning-center/hiring/best-pressure-washing-companies-in-jacksonville/'),
              ('Pressure Washing Near Me','/learning-center/hiring/pressure-washing-near-me/'),
              ('Pressure Washing Cost in Jacksonville','/learning-center/cost/pressure-washing-cost-jacksonville/'),
              ('How to Choose a Pressure Washing Company','/learning-center/hiring/how-to-choose-a-pressure-washing-company/'),
              ('What Professional Pressure Washing Should Include','/learning-center/hiring/what-professional-pressure-washing-should-include/'),
              ('House Washing Cost','/learning-center/cost/house-washing-cost-jacksonville/'),
              ('Roof Cleaning Cost','/learning-center/cost/roof-cleaning-cost-jacksonville/'),
              ('Gutter Cleaning Cost','/learning-center/cost/gutter-cleaning-cost-jacksonville/'),
              ('Driveway Cleaning Cost','/learning-center/cost/driveway-cleaning-cost-jacksonville/'),
              ('Commercial Pressure Washing','/learning-center/commercial/commercial-pressure-washing-jacksonville/'),
              ('Pressure Washing by Neighborhood & City','/learning-center/local/pressure-washing-by-neighborhood-and-city/'),
            ]),
          ]

          flat = [(t,u,c) for c,items in cats for t,u in items]
          if len(flat) != 53 or len({u for _,u,_ in flat}) != 53:
              raise SystemExit(f'Category map must contain 53 unique guides; got {len(flat)} / {len({u for _,u,_ in flat})}')

          site = 'https://jacksonvillepressurewashingfl.com'
          listed = set(re.findall(r'"url":"https://jacksonvillepressurewashingfl\.com(/learning-center/[^"#]+/)"', s))
          mapped = {u for _,u,_ in flat}
          if listed != mapped:
              missing = sorted(listed - mapped)
              extra = sorted(mapped - listed)
              raise SystemExit(f'Guide map does not match ItemList. Missing from map: {missing}; extra in map: {extra}')

          css = r'''<style id="lc-search-directory-styles">
          .lc-guide-tools{position:relative;z-index:25;margin:4px 0 30px}
          .lc-guide-search{max-width:790px;margin:0 auto 16px}
          .lc-guide-search label{display:block;margin:0 0 8px;color:#0b4a67;font-size:.78rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
          .lc-guide-search-box{position:relative}
          .lc-guide-search-box::before{content:'⌕';position:absolute;left:17px;top:50%;transform:translateY(-52%);color:#0877b9;font-size:24px;font-weight:900;pointer-events:none}
          #lc-guide-search{width:100%;min-height:54px;padding:13px 18px 13px 49px;border:1px solid #cfdce4;border-radius:16px;background:#fff;color:#0b2d4a;font:inherit;font-size:16px;box-shadow:0 8px 24px rgba(11,45,74,.06);outline:none;box-sizing:border-box}
          #lc-guide-search:focus{border-color:#75b9dd;box-shadow:0 0 0 4px rgba(8,119,185,.11),0 10px 28px rgba(11,45,74,.08)}
          .lc-search-results{max-width:790px;margin:9px auto 18px;padding:9px;border:1px solid #d8e4ea;border-radius:15px;background:#fff;box-shadow:0 16px 35px rgba(11,45,74,.12)}
          .lc-search-results[hidden]{display:none}
          .lc-search-results a{display:block;padding:11px 12px;border-radius:10px;color:#24475b;text-decoration:none;font-size:.92rem;line-height:1.35}
          .lc-search-results a:hover,.lc-search-results a:focus-visible{background:#eef7fb;color:#0b4a67}
          .lc-search-empty{padding:12px;color:#657984;font-size:.92rem}
          .lc-topic-directory{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:18px;background:#eef7fb;border:1px solid #d6eaf5;border-radius:20px;box-sizing:border-box}
          .lc-topic-directory details{position:relative;min-width:0}
          .lc-topic-directory summary{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px;padding:14px 15px;border:1px solid #dce3e9;border-radius:14px;background:#fff;color:#0b4a67;cursor:pointer;list-style:none;font-size:.9rem;font-weight:900;line-height:1.2}
          .lc-topic-directory summary::-webkit-details-marker{display:none}
          .lc-topic-directory summary::after{content:'⌄';flex:0 0 auto;color:#0877b9;font-size:1.05rem;line-height:1;transition:transform .18s ease}
          .lc-topic-directory details[open] summary{border-color:#b8d7e9;box-shadow:0 8px 22px rgba(11,45,74,.08)}
          .lc-topic-directory details[open] summary::after{transform:rotate(180deg)}
          .lc-topic-count{display:inline-flex;align-items:center;justify-content:center;min-width:25px;height:25px;margin-left:auto;padding:0 7px;border-radius:999px;background:#edf6fb;color:#0877b9;font-size:.72rem;font-weight:900;box-sizing:border-box}
          .lc-topic-menu{position:absolute;top:calc(100% + 8px);left:0;width:min(410px,calc(100vw - 36px));max-height:430px;overflow:auto;padding:10px;border:1px solid #dce3e9;border-radius:16px;background:#fff;box-shadow:0 18px 45px rgba(11,45,74,.16);z-index:40}
          .lc-topic-directory details:nth-child(3n) .lc-topic-menu{left:auto;right:0}
          .lc-topic-menu a{display:block;padding:10px 11px;border-radius:10px;color:#334e68;text-decoration:none;font-size:.88rem;line-height:1.35}
          .lc-topic-menu a:hover,.lc-topic-menu a:focus-visible{background:#eef7fb;color:#0b4a67}
          @media(max-width:800px){.lc-topic-directory{grid-template-columns:repeat(2,minmax(0,1fr))}.lc-topic-menu,.lc-topic-directory details:nth-child(3n) .lc-topic-menu{position:static;width:auto;max-height:none;margin-top:7px;box-shadow:none}.lc-topic-directory details[open]{grid-column:span 2}}
          @media(max-width:520px){.lc-guide-tools{margin-top:0}.lc-topic-directory{grid-template-columns:1fr;padding:14px}.lc-topic-directory details[open]{grid-column:auto}}
          </style>'''

          blocks=[]
          for cat, items in cats:
              links=''.join(f'<a data-guide href="{u}">{t}</a>' for t,u in items)
              blocks.append(f'<details><summary>{cat}<span class="lc-topic-count">{len(items)}</span></summary><div class="lc-topic-menu">{links}</div></details>')
          html = '''<section class="lc-guide-tools" aria-label="Search and browse Learning Center guides">
          <div class="lc-guide-search"><label for="lc-guide-search">Search the Learning Center</label><div class="lc-guide-search-box"><input id="lc-guide-search" type="search" placeholder="Search roof cleaning, gutters, concrete, soft washing..." autocomplete="off"></div></div>
          <div class="lc-search-results" id="lc-search-results" hidden aria-live="polite"></div>
          <nav class="lc-topic-directory" aria-label="Browse Learning Center by topic">''' + ''.join(blocks) + '''</nav></section>'''

          js = r'''<script id="lc-guide-search-script">
          (()=>{const input=document.getElementById('lc-guide-search'),results=document.getElementById('lc-search-results'),guides=[...document.querySelectorAll('.lc-topic-menu a[data-guide]')],topics=[...document.querySelectorAll('.lc-topic-directory details')];if(!input||!results)return;const norm=v=>v.toLowerCase().replace(/[–—]/g,'-').trim();input.addEventListener('input',()=>{const q=norm(input.value);results.innerHTML='';if(!q){results.hidden=true;return}const matches=guides.filter(a=>{const topic=a.closest('details')?.querySelector('summary')?.textContent||'';return norm(a.textContent+' '+topic).includes(q)});if(!matches.length){results.innerHTML='<div class="lc-search-empty">No guides matched that search.</div>'}else{matches.forEach(a=>{const link=document.createElement('a');link.href=a.href;link.textContent=a.textContent;results.appendChild(link)})}results.hidden=false});topics.forEach(d=>d.addEventListener('toggle',()=>{if(d.open)topics.forEach(other=>{if(other!==d)other.open=false})}));document.addEventListener('click',e=>{if(!e.target.closest('.lc-topic-directory'))topics.forEach(d=>d.open=false)})})();
          </script>'''

          s = s.replace('</head>', css + '</head>', 1)
          start = s.index('class="lc-summary"')
          end = s.index('</header>', start) + len('</header>')
          s = s[:end] + html + s[end:]
          s = s.replace('</body>', js + '</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify directory and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('learning-center/index.html').read_text()
          assert s.count('data-guide href=') == 53
          assert 'id="lc-guide-search"' in s
          assert s.count('<details><summary>') >= 6
          PY
          rm .github/workflows/add-learning-center-search-directory.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learning-center/index.html .github/workflows/add-learning-center-search-directory.yml
          git commit -m 'Add searchable Learning Center topic directory'
          git push