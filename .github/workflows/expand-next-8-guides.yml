name: Expand next eight guides
on: push
permissions:
  contents: write
jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand article depth and refresh word counts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          additions={
          'learning-center/comparisons/can-pressure-washing-damage-concrete/index.html':'''<h2>What should be checked before concrete is cleaned?</h2><p>Before washing, look for cracks, spalling, scaling, previous pressure marks, patched areas, paint, sealer and sections that stay darker than the surrounding slab. Those conditions can change how the surface responds. A driveway that appears to be plain concrete may also have an older clear coating or topical sealer that reacts very differently from bare concrete.</p><p>Edges and corners deserve special attention because concentrated spray can chip weak material more easily there. Expansion joints, control joints and areas next to pavers, garage doors or painted walls also change how the cleaning equipment should be handled.</p><h2>What should homeowners ask a concrete-cleaning company?</h2><ul class="checklist"><li><strong>How will stains be treated?</strong> Oil, rust and tire marks may need separate chemistry.</li><li><strong>Will a surface cleaner be used?</strong> Large flat areas are generally easier to clean consistently with equipment designed for even coverage.</li><li><strong>How is weak or damaged concrete handled?</strong> Existing scaling, cracks and patches should be noted before cleaning.</li><li><strong>Is the concrete sealed?</strong> Coated concrete may require a different process from bare concrete.</li></ul>''',
          'learning-center/house-washing/what-does-professional-house-wash-include/index.html':'''<h2>A pre-wash inspection protects both the home and the scope</h2><p>Before cleaning starts, the exterior should be checked for loose paint, damaged siding, cracked stucco, failed caulk, open windows, delicate decorations, exposed electrical items and areas where water intrusion is already possible. Those observations do not necessarily prevent washing, but they influence how the work should be approached and what should be documented.</p><p>Older finishes can also have oxidation or sun fading that ordinary cleaning does not correct. Noting those conditions before washing prevents a maintenance clean from being confused with paint restoration.</p><h2>What should the home look like when the wash is complete?</h2><p>A successful house wash should leave compatible exterior surfaces visibly cleaner and more uniform where the buildup was removable. It should not create wand marks, blasted paint, damaged screens or water forced into openings. Some permanent stains, oxidation, faded coatings and material defects may remain because they are not ordinary surface dirt.</p><p>The best estimate explains both sides of that equation: what the cleaning is expected to improve and which existing conditions fall outside normal house-washing scope.</p>''',
          'learning-center/house-washing/why-green-algae-keeps-coming-back-on-siding/index.html':'''<h2>Can homeowners slow down the return of green buildup?</h2><p>Nothing makes an exterior permanently immune to organic growth, but a few property conditions can be reviewed. Sprinklers can sometimes be adjusted so they do not repeatedly wet the same wall. Dense vegetation can be trimmed when appropriate to improve airflow. Leaves and roof debris can be kept from collecting against walls, gutters and shaded outdoor surfaces.</p><p>Those steps are property-maintenance decisions rather than substitutes for cleaning. Their value is simply that surfaces which dry faster and collect less debris may stay visually cleaner longer.</p><h2>When recurring green growth points to another issue</h2><p>If one small area becomes wet repeatedly while neighboring walls remain dry, look for more than ordinary Florida humidity. A misdirected sprinkler, overflowing gutter, roof runoff, plumbing leak or drainage issue can keep a surface damp. Cleaning the wall repeatedly without addressing the moisture source may only treat the symptom.</p><p>That is why pattern matters. Broad shaded growth across an elevation is different from one concentrated vertical wet area below a gutter corner or irrigation head.</p>''',
          'learning-center/house-washing/vinyl-siding-oxidation-house-washing/index.html':'''<h2>Why a test area is useful on older vinyl siding</h2><p>A small inconspicuous test section can show whether the finish is chalky, faded or unusually sensitive before the entire elevation is cleaned. The test is especially useful when the siding age is unknown or when one side of the house receives much more direct sun than the others.</p><p>If wiping the dry siding leaves noticeable powder on a cloth or fingertip, that is an important condition to document. It suggests the visible finish has weathered and that cleaning expectations should be discussed before work starts.</p><h2>Oxidation can also appear on gutters, trim and painted metal</h2><p>Chalky weathering is not limited to vinyl siding. Painted aluminum gutters, fascia wraps and other coated exterior metals can also oxidize over time. A normal house wash may remove dirt around those areas without restoring the original gloss or color.</p><p>That distinction matters when multiple materials meet on the same elevation. Clean siding next to oxidized gutter faces can make the contrast more noticeable even though both surfaces were cleaned appropriately.</p>''',
          'learning-center/gutters/are-gutter-guards-worth-it-florida/index.html':'''<h2>Different guard designs handle debris differently</h2><p>Large-opening screens may stop leaves while allowing smaller needles and roof granules through. Fine mesh can block smaller debris but may collect material on the top surface. Surface-tension products depend on water following the guard profile and can still accumulate debris at edges or valleys. There is no single guard style that behaves the same on every roof and tree environment.</p><p>Before buying a system, homeowners should consider the dominant debris around the property. Broad leaves, pine needles, oak tassels and fine roof particles create different maintenance challenges.</p><h2>Inspection after heavy weather still matters</h2><p>After periods of heavy rain, wind or falling debris, look for water overshooting the gutter, overflow at corners, sagging sections and water running behind the gutter. Those signs can indicate a drainage problem even when guards are installed.</p><p>Guards are best viewed as a debris-management tool, not a replacement for observing the roof-drainage system. A system that is easier to inspect and service over time can be more valuable than one marketed only around never cleaning gutters again.</p>''',
          'learning-center/gutters/interior-gutter-cleaning-vs-exterior-gutter-washing/index.html':'''<h2>Downspouts belong to the drainage conversation</h2><p>Interior gutter cleaning is incomplete if the water path is obviously blocked at an accessible outlet. Leaves can be removed from the channel while a downspout remains restricted farther below. The quote should explain whether downspouts are visually checked, flushed, disassembled or treated as a separate problem when a blockage cannot be reached safely.</p><p>That distinction is especially important on multi-story homes or buried drainage systems where the visible downspout connects to piping below grade.</p><h2>Before-and-after photos can clarify what was actually serviced</h2><p>Because homeowners cannot always see inside upper gutters from the ground, photos can document interior debris removal and visible channel condition. Exterior gutter washing is easier to evaluate visually from below, while interior work benefits more from documentation.</p><p>When comparing estimates, ask whether the service is drainage-focused interior cleaning, exterior cosmetic washing, brightening, or a combination. Clear terminology prevents two very different scopes from being compared as if they were identical.</p>''',
          'learning-center/house-washing/soffit-fascia-cleaning-jacksonville/index.html':'''<h2>Organic buildup and oxidation are different roofline problems</h2><p>Green or dark organic film, spider debris and pollen can often respond to normal exterior-cleaning methods. Chalky paint, faded aluminum wrap and failing coatings are different. Cleaning can improve dirt and biological buildup without returning an oxidized finish to its original appearance.</p><p>This distinction is especially visible on white fascia and gutter systems, where clean sections can make pre-existing fading or tiger-striping more obvious.</p><h2>Two-story rooflines change access and rinse control</h2><p>Higher soffits and fascia increase the importance of controlled application, safe access and spray direction. Reaching a surface does not mean it should be attacked with a narrow high-pressure stream. The objective is still to use the least aggressive effective method while keeping water away from vents, openings and sensitive fixtures.</p><p>Homeowners requesting a quote should include wide photos that show roof height, overhang depth and any screened enclosures or landscaping that affects access.</p>''',
          'learning-center/driveways/how-to-remove-tire-marks-concrete-driveway/index.html':'''<h2>Why sealed driveways deserve a different test</h2><p>If water beads strongly or the slab has a visible gloss, color enhancement or coating, identify the sealer before aggressive cleaning. Some tire marks are actually transfer or chemical interaction at the coating surface. Strong solvents or excessive pressure can damage the sealer while trying to remove the mark.</p><p>A small test area can show whether the black mark is lifting, whether the surrounding finish changes and whether the treatment leaves a lighter halo.</p><h2>How to reduce future tire-mark buildup</h2><p>Some marking is unavoidable where vehicles turn sharply or park while tires are hot. Keeping the driveway free of oily film and cleaning new marks before they age can make maintenance easier. On coated concrete, follow the coating manufacturer’s maintenance guidance rather than experimenting with strong cleaners.</p><p>If tire marks repeatedly bond to a sealer, the long-term question may be coating compatibility rather than cleaning power. In that situation, a coating professional may be more useful than increasingly aggressive pressure washing.</p>'''
          }
          tag_re=re.compile(r'<[^>]+>')
          for fn,extra in additions.items():
              p=Path(fn); s=p.read_text(encoding='utf-8')
              if extra[:40] not in s:
                  s=s.replace('<p class="article-note">',extra+'<p class="article-note">')
              m=re.search(r'<script type="application/ld\+json">(.*?)</script>',s,re.S)
              if m:
                  data=json.loads(m.group(1))
                  article=next((x for x in data.get('@graph',[]) if x.get('@type')=='BlogPosting'),None)
                  body=re.search(r'<div class="article-content">(.*?)</div></article>',s,re.S)
                  if article and body:
                      words=re.findall(r"[A-Za-z0-9][A-Za-z0-9’'\-]*",tag_re.sub(' ',body.group(1)))
                      article['wordCount']=len(words)
                  s=s[:m.start(1)]+json.dumps(data,separators=(',',':'))+s[m.end(1):]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning-center
          git commit -m "Expand eight new Learning Center guides" || true
          git rm --cached .github/workflows/expand-next-8-guides.yml || true
          rm -f .github/workflows/expand-next-8-guides.yml
          git add -A
          git commit --amend --no-edit || true
          git push