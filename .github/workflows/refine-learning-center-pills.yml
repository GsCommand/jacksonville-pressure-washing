name: Refine Learning Center category pills
on:
  push:
    paths:
      - '.github/workflows/refine-learning-center-pills.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine category pills
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('learning-center/index.html')
          s=p.read_text(encoding='utf-8')
          before=s
          s=re.sub(r'<span class="lc-topic-count">\d+</span>','',s)
          s=s.replace('.lc-topic-directory{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:18px;', '.lc-topic-directory{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px;')
          s=s.replace('.lc-topic-directory summary{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px;padding:14px 15px;', '.lc-topic-directory summary{position:relative;display:flex;align-items:center;justify-content:center;gap:0;min-height:52px;padding:11px 38px;text-align:center;')
          s=s.replace('font-size:.9rem;font-weight:900;line-height:1.2}', 'font-size:.86rem;font-weight:900;line-height:1.18}')
          s=s.replace(".lc-topic-directory summary::after{content:'⌄';flex:0 0 auto;color:#0877b9;font-size:1.05rem;line-height:1;transition:transform .18s ease}", ".lc-topic-directory summary::after{content:'⌄';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#0877b9;font-size:1.05rem;line-height:1;transition:transform .18s ease}")
          s=s.replace(".lc-topic-directory details[open] summary::after{transform:rotate(180deg)}", ".lc-topic-directory details[open] summary::after{transform:translateY(-50%) rotate(180deg)}")
          s=re.sub(r'\.lc-topic-count\{[^}]*\}','',s)
          if s==before:
              raise SystemExit('No Learning Center pill changes applied')
          if 'lc-topic-count' in s:
              raise SystemExit('Guide-count markup/style still present')
          if 'justify-content:center' not in s or 'text-align:center' not in s:
              raise SystemExit('Centered pill styling missing')
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/refine-learning-center-pills.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learning-center/index.html .github/workflows/refine-learning-center-pills.yml
          git commit -m 'Refine Learning Center category pills'
          git push
