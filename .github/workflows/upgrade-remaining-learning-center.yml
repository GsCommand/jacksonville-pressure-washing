        run: |
          rm .github/workflows/upgrade-remaining-learning-center.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learning-center .github/workflows/upgrade-remaining-learning-center.yml
          git commit -m 'Upgrade remaining 35 Learning Center articles above 90 target'
          git push