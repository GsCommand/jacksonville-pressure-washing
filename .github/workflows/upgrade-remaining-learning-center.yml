jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deepen remaining 35 articles and strengthen internal linking
        shell: python
        run: |
          from pathlib import Path
          import re, json, html

          # Each target receives unique topical depth, local context, three sibling links,
          # and a restrained conversion path. Existing URLs, FAQ content and FAQ schema stay intact.
          upgrades = {
            'learning-center/commercial/commercial-pressure-washing-jacksonville/index.html': (
              'Jacksonville commercial properties face a different cleaning problem from a single-family home: larger traffic areas, public access, loading zones, storefronts and scheduling constraints all affect the scope. In Northeast Florida, rain, humidity and year-round use can keep sidewalks, dumpster pads and common areas looking dirty quickly.',
              'Build a commercial scope around operations, not just square footage',
              'A useful commercial proposal should identify the surfaces, traffic level, access restrictions, water availability and acceptable work windows before pricing is finalized. A retail entrance that must remain open needs a different plan from a closed warehouse apron. Property managers should also separate routine organic buildup from oil, rust, gum and other specialty staining because those conditions may require different treatment and expectations.',
              ['/learning-center/hiring/what-professional-pressure-washing-should-include/','/learning-center/cost/pressure-washing-cost-jacksonville/','/learning-center/comparisons/can-pressure-washing-damage-concrete/']),
            'learning-center/comparisons/power-washing-vs-pressure-washing-vs-pressure-cleaning/index.html': (
              'In Jacksonville and Northeast Florida, homeowners will see contractors use the terms pressure washing, power washing and pressure cleaning interchangeably. The wording matters less than whether the company chooses the right pressure, flow, chemistry and technique for the actual surface.',
              'Choose the method by surface risk, not by the label on the service',
              'Concrete may tolerate a controlled mechanical cleaning process that would be inappropriate for painted siding, roofing or screens. A homeowner comparing quotes should ask what method reaches each surface, what pretreatment is used, how runoff is managed and which stains are considered specialty work. That produces a more meaningful comparison than assuming “power washing” is automatically stronger or better.',
              ['/learning-center/house-washing/soft-washing-vs-pressure-washing-a-house/','/learning-center/comparisons/can-pressure-washing-damage-concrete/','/learning-center/hiring/what-professional-pressure-washing-should-include/']),
            'learning-center/cost/driveway-cleaning-cost-jacksonville/index.html': (
              'Jacksonville driveway-cleaning prices can vary even when two properties have similar square footage. Northeast Florida driveways differ in access, staining, edging, drainage, coatings and the amount of setup required, so a useful quote should explain what is included instead of relying on a single per-square-foot number.',
              'The most useful driveway quote separates base cleaning from specialty treatment',
              'For normal concrete, the base scope may include pretreatment, surface cleaning, edge work and rinsing. Oil, rust, irrigation staining, tire marks, paint, sealer failure or heavy organic buildup can change the process. Homeowners should compare whether quotes include those conditions, whether adjoining sidewalks or aprons are included and whether a minimum service charge applies.',
              ['/learning-center/driveways/driveway-pressure-washing/','/learning-center/driveways/oil-stains-on-concrete/','/learning-center/driveways/how-to-remove-tire-marks-concrete-driveway/']),
            'learning-center/cost/gutter-cleaning-cost-jacksonville/index.html': (
              'Gutter-cleaning cost in Jacksonville is influenced by more than linear footage. Roof height, access, gutter guards, debris volume, downspout restrictions and cleanup expectations can all change the labor required, especially on Northeast Florida homes surrounded by pines or mature trees.',
              'Compare gutter quotes by access and scope',
              'A lower quote may cover only debris removal from open gutter channels, while another may include accessible downspout checks, bagging debris, before-and-after photos or removal/reinstallation of some gutter guards. Exterior gutter washing and gutter brightening are separate appearance services and should not be assumed to be part of an interior cleanout unless the quote says so.',
              ['/learning-center/gutters/how-often-should-gutters-be-cleaned-florida/','/learning-center/gutters/are-gutter-guards-worth-it-florida/','/learning-center/gutters/interior-gutter-cleaning-vs-exterior-gutter-washing/']),
            'learning-center/cost/house-washing-cost-jacksonville/index.html': (
              'House-washing cost in Jacksonville depends on more than the home’s footprint. Stories, wall material, heavy algae, access, porches, attached garages, soffits and the amount of protection needed around landscaping or exterior fixtures can all affect the final scope in Northeast Florida.',
              'A strong house-wash quote defines the surfaces before it defines the price',
              'Homeowners should know whether the quote covers siding or stucco only, or also accessible soffits, fascia, exterior gutter faces and trim. Specialty stains such as rust, irrigation deposits and oxidation should be separated from routine organic buildup. That makes it possible to compare two proposals on equal scope instead of comparing two numbers that include different work.',
              ['/learning-center/house-washing/what-does-professional-house-wash-include/','/learning-center/house-washing/soft-washing-vs-pressure-washing-a-house/','/learning-center/house-washing/vinyl-siding-oxidation-house-washing/']),
            'learning-center/cost/pressure-washing-cost-jacksonville/index.html': (
              'Jacksonville pressure-washing prices can vary because “pressure washing” may describe anything from a small sidewalk to an entire exterior-cleaning package. In Northeast Florida, surface type, access, staining, setup time and whether multiple services are bundled usually matter more than one advertised headline price.',
              'Compare scope first, then compare price',
              'A useful estimate should list the surfaces being cleaned, the general method, obvious exclusions and any specialty stains that may need separate treatment. Driveways, houses, roofs, gutters and pool areas should not be priced as if they require the same equipment or risk level. Bundled work can also change setup efficiency, so the cost of one service in isolation may not match the same service when completed with others.',
              ['/learning-center/cost/driveway-cleaning-cost-jacksonville/','/learning-center/cost/house-washing-cost-jacksonville/','/learning-center/cost/roof-cleaning-cost-jacksonville/']),
            'learning-center/cost/roof-cleaning-cost-jacksonville/index.html': (
              'Roof-cleaning cost in Jacksonville is shaped by roof material, pitch, height, access, landscaping, runoff management and the condition of the roof itself. Northeast Florida homes may have asphalt shingles, concrete tile, clay tile or metal roofing, and those systems should not be treated as one generic cleaning job.',
              'Roof condition and access can matter more than raw square footage',
              'A low-slope single-story shingle roof with clear access is a different project from a steep tile roof above a screened pool enclosure. Quotes should define the cleaning method, whether detached structures are included, how runoff and plants are protected and what pre-existing roof damage may limit the work. Cleaning should never be expected to repair broken tiles, failed flashing or worn shingles.',
              ['/learning-center/roof-cleaning/can-you-pressure-wash-roof-shingles/','/learning-center/roof-cleaning/tile-roof-cleaning-florida/','/learning-center/roof-cleaning/how-long-does-roof-cleaning-last/']),
            'learning-center/driveways/driveway-pressure-washing/index.html': (
              'Jacksonville driveways can accumulate organic film, tire traffic, irrigation staining and vehicle-related spots under Northeast Florida heat and humidity. A professional cleaning plan should identify the concrete condition and stain type before choosing pressure or chemistry.',
              'Consistency matters more than chasing every stain with pressure',
              'The goal of a driveway-cleaning process is an even result across the slab without creating stripes, wand marks or unnecessary surface wear. Pretreatment can help loosen compatible buildup, a properly matched surface cleaner can improve consistency, and edge work plus a thorough rinse help finish the job. Specialty stains should be evaluated separately instead of being attacked with progressively stronger pressure.',
              ['/learning-center/comparisons/can-pressure-washing-damage-concrete/','/learning-center/driveways/oil-stains-on-concrete/','/learning-center/driveways/how-to-remove-tire-marks-concrete-driveway/']),
            'learning-center/driveways/oil-stains-on-concrete/index.html': (
              'Oil staining on Jacksonville driveways can range from fresh surface residue to contamination that has migrated deeper into porous concrete. Northeast Florida heat can accelerate how vehicle fluids spread and cure, so the age and depth of the stain matter when setting expectations.',
              'Improvement is a better promise than guaranteed removal',
              'Fresh oil may respond to absorbent cleanup, compatible degreasing, dwell time and controlled agitation. Older stains can remain as a shadow because the contamination has moved below the immediate surface. Sealed or coated concrete needs additional caution because a treatment that attacks the oil may also alter the finish. Testing a small area is more responsible than promising a uniform result before the surface is evaluated.',
              ['/learning-center/driveways/driveway-pressure-washing/','/learning-center/driveways/how-to-remove-tire-marks-concrete-driveway/','/learning-center/comparisons/can-pressure-washing-damage-concrete/']),
            'learning-center/fences/fence-cleaning/index.html': (
              'Fence cleaning in Jacksonville often means dealing with green organic buildup, irrigation overspray, sun exposure and mixed materials on the same property. Northeast Florida conditions can affect vinyl, PVC, painted wood and bare wood differently, so the material should lead the cleaning plan.',
              'A fence should be cleaned as a material system, not as a long wall',
              'Posts, panels, caps, gates, hinges and adjoining masonry can each have different limits. Wood may be vulnerable to raised fibers and wand marks, while vinyl can show oxidation, fading or mineral staining that routine washing will not reverse. A good inspection also looks for loose sections, brittle components and coating failure before the full fence line is cleaned.',
              ['/learning-center/fences/vinyl-fence-cleaning-florida/','/learning-center/fences/wood-vs-vinyl-fence-cleaning/','/learning-center/comparisons/does-pressure-washing-remove-mold-mildew-algae/']),
            'learning-center/gutters/best-gutter-cleaning-service-near-me/index.html': (
              'When Jacksonville homeowners search for a gutter-cleaning service near them, proximity is only the first filter. Northeast Florida homes can have steep rooflines, gutter guards, buried drains and heavy tree debris, so the best fit is the company that clearly defines access, cleanup and downspout scope.',
              'Use a near-me search to build a shortlist, then verify the work',
              'Ask whether debris is physically removed, where it is placed, whether accessible outlets and downspouts are checked, how gutter guards are handled and whether before-and-after photos are available. Also separate interior cleaning from exterior gutter washing or brightening. Those services solve different problems and should be quoted separately when needed.',
              ['/learning-center/gutters/how-often-should-gutters-be-cleaned-florida/','/learning-center/gutters/gutter-cleaning-vs-gutter-brightening/','/learning-center/gutters/are-gutter-guards-worth-it-florida/']),
            'learning-center/gutters/how-often-should-gutters-be-cleaned-florida/index.html': (
              'There is no single gutter-cleaning schedule for every Jacksonville home. Northeast Florida properties under pines or mature trees can accumulate debris much faster than open lots, and heavy seasonal rain can expose restrictions that were not obvious during dry weather.',
              'Use inspection triggers instead of a rigid calendar',
              'The right interval depends on tree coverage, roof debris, gutter guards, roof pitch and how quickly outlets collect material. Overflow during rain, plants growing from the gutter, standing water, roof grit at outlets and visible debris are practical triggers for inspection. Homes with recurring clogs may need attention more frequently than a generic once-a-year recommendation.',
              ['/learning-center/gutters/clogged-downspout-signs/','/learning-center/gutters/are-gutter-guards-worth-it-florida/','/learning-center/gutters/best-gutter-cleaning-service-near-me/']),
            'learning-center/hiring/best-pressure-washing-companies-in-jacksonville/index.html': (
              'A “best pressure washing company in Jacksonville” list is only useful if the comparison criteria match the property. Northeast Florida homes combine concrete, stucco, siding, roofs, gutters and pool enclosures, and a company that is strong on one surface is not automatically the best fit for every project.',
              'Define “best” by the service you actually need',
              'Homeowners should compare current insurance, local service coverage, recent work on similar materials, written scope, stain limitations and the method used on each surface. Reviews are helpful when they describe the same type of job you are planning. A detailed roof-cleaning review is more relevant to a roof project than a large number of unrelated driveway reviews.',
              ['/learning-center/hiring/how-to-choose-a-pressure-washing-company/','/learning-center/hiring/pressure-washing-near-me/','/learning-center/hiring/what-professional-pressure-washing-should-include/']),
            'learning-center/hiring/how-to-choose-a-pressure-washing-company/index.html': (
              'Choosing a pressure-washing company in Jacksonville should be based on more than a price and star rating. Northeast Florida properties can include delicate painted surfaces, roofs, screens, pavers and concrete, so the contractor should be able to explain how the process changes by material.',
              'A good contractor can explain what they will not do',
              'Strong operators should be comfortable discussing limitations: oil may leave a shadow, oxidation is not ordinary dirt, failed paint can remain visible, and roof damage is a roofing issue rather than a cleaning issue. That kind of boundary-setting is a better trust signal than promising every stain will disappear. A written scope should also make clear what is included, excluded and considered specialty treatment.',
              ['/learning-center/hiring/pressure-washing-near-me/','/learning-center/hiring/best-pressure-washing-companies-in-jacksonville/','/learning-center/hiring/what-professional-pressure-washing-should-include/']),
            'learning-center/hiring/pressure-washing-near-me/index.html': (
              'For Jacksonville homeowners, “pressure washing near me” is most useful for finding companies that genuinely serve the property and can respond efficiently. Northeast Florida coverage can span Duval, St. Johns, Clay and Nassau counties, so local proximity should be verified rather than assumed from an ad.',
              'The right local company should make the next step easy to verify',
              'After confirming service coverage, compare the exact surface you need cleaned, the proposed method, insurance, recent local examples and the written scope. Ask what photos are helpful for quoting and what conditions may require an on-site inspection. A company that can explain the difference between organic buildup, oxidation, rust, oil and coating failure is usually giving you a more useful evaluation than one that quotes every surface from square footage alone.',
              ['/learning-center/hiring/how-to-choose-a-pressure-washing-company/','/learning-center/hiring/best-pressure-washing-companies-in-jacksonville/','/learning-center/cost/pressure-washing-cost-jacksonville/']),
            'learning-center/hiring/what-professional-pressure-washing-should-include/index.html': (
              'Professional pressure washing in Jacksonville should be defined by a repeatable process, not simply by owning a pressure washer. Northeast Florida properties often require different approaches for concrete, siding, roofing, screens, gutters and specialty stains.',
              'A professional scope should connect method, protection and expectations',
              'Before work begins, the company should identify the material, obvious damage, access, runoff path and stain type. The quote should explain the surfaces included, while the crew should protect reasonable sensitive items and adapt pressure or chemistry to the substrate. At completion, the result should be evaluated against the agreed scope rather than against unrealistic promises of making every aged or damaged surface look new.',
              ['/learning-center/hiring/how-to-choose-a-pressure-washing-company/','/learning-center/comparisons/power-washing-vs-pressure-washing-vs-pressure-cleaning/','/learning-center/comparisons/can-pressure-washing-damage-concrete/']),
            'learning-center/house-washing/house-washing-companies-near-me/index.html': (
              'When Jacksonville homeowners search for house-washing companies near them, the important question is whether the company understands the exterior materials on that specific home. Northeast Florida houses can combine stucco, vinyl, fiber cement, painted masonry, soffits and other finishes that should not all receive the same cleaning approach.',
              'Compare house-washing companies by surface judgment',
              'Ask what is included in the house-wash scope, how the method changes between materials, what happens around electrical fixtures and landscaping, and which stains may remain after routine washing. Recent local examples on a similar home are more useful than generic before-and-after photos. A clear quote should also distinguish house washing from roof cleaning, gutter brightening, window detailing and other separate services.',
              ['/learning-center/house-washing/what-does-professional-house-wash-include/','/learning-center/house-washing/soft-washing-vs-pressure-washing-a-house/','/learning-center/hiring/how-to-choose-a-pressure-washing-company/']),
            'learning-center/house-washing/is-soft-washing-safe-for-stucco-and-siding/index.html': (
              'Soft washing can be appropriate for many Jacksonville stucco and siding surfaces when the process is matched to the material and condition. Northeast Florida humidity supports organic growth, but lower pressure does not remove the need to inspect paint, oxidation, cracks, seals and sensitive fixtures first.',
              'Low pressure is only one part of a safe process',
              'Safety also depends on compatible chemistry, controlled dwell time, thorough rinsing and attention to runoff. Painted stucco with failing paint, oxidized vinyl and damaged siding can still show problems after a low-pressure wash. A test area is useful when the finish or previous maintenance history is uncertain, and specialty stains should be separated from ordinary algae or mildew.',
              ['/learning-center/house-washing/can-you-pressure-wash-stucco/','/learning-center/house-washing/can-you-pressure-wash-vinyl-siding/','/learning-center/house-washing/what-is-soft-washing/']),
            'learning-center/house-washing/soft-washing-vs-pressure-washing-a-house/index.html': (
              'Jacksonville house exteriors should not be cleaned by choosing one machine setting for the entire property. Northeast Florida homes commonly combine siding, stucco, painted trim, masonry and concrete, and each surface can call for a different balance of chemistry, flow and pressure.',
              'The best house-washing method can change within the same elevation',
              'A low-pressure application may be appropriate for organic buildup on siding or stucco while harder adjacent flatwork can tolerate a different mechanical process. The contractor should also distinguish removable growth from oxidation, failing paint, rust and irrigation staining. Those conditions may remain or require separate treatment even when the basic house wash is performed correctly.',
              ['/learning-center/house-washing/what-is-soft-washing/','/learning-center/house-washing/is-soft-washing-safe-for-stucco-and-siding/','/learning-center/house-washing/what-does-professional-house-wash-include/']),
            'learning-center/local/pressure-washing-by-neighborhood-and-city/index.html': (
              'Jacksonville is a large service market, and pressure-washing needs can vary across Duval County and nearby Northeast Florida communities. Coastal exposure, mature trees, newer planned communities, irrigation and property type all influence what a cleaner sees on arrival.',
              'Local pages should help homeowners verify coverage, not repeat the same sales copy',
              'The useful local question is whether the company regularly serves the property location and can handle the surfaces there. A Jacksonville Beach home may have more salt exposure than an inland subdivision, while tree-heavy neighborhoods may see faster gutter and roof buildup. Local coverage information should therefore connect geography to practical service considerations instead of pretending every neighborhood has a unique cleaning chemistry.',
              ['/learning-center/hiring/pressure-washing-near-me/','/learning-center/cost/pressure-washing-cost-jacksonville/','/learning-center/house-washing/how-often-pressure-wash-house-florida/']),
            'learning-center/pool-areas/pool-deck-pool-cage-screen-enclosure-cleaning/index.html': (
              'Pool areas in Jacksonville combine several surfaces in a small footprint: concrete or pavers, coping, painted aluminum frames, screens, doors and nearby pool water. Northeast Florida humidity can support algae and mildew, while sun and pool chemicals can expose oxidation or coating wear.',
              'Define the pool-area scope one surface at a time',
              'A pool-deck wash does not automatically include the cage, and cleaning the enclosure does not automatically include the deck. Screens and painted aluminum need gentler handling than hard concrete, while runoff must be managed around the pool itself. A good quote should identify the deck material, whether interior and exterior screen faces are accessible and what pre-existing oxidation, tears or coating failure may limit the result.',
              ['/learning-center/pool-areas/pool-cage-vs-screen-enclosure-cleaning/','/learning-center/patios/patio-cleaning-jacksonville/','/learning-center/comparisons/does-pressure-washing-remove-mold-mildew-algae/']),
            'learning-center/roof-cleaning/best-roof-cleaning-companies-jacksonville/index.html': (
              'The best roof-cleaning company in Jacksonville is the one that matches the cleaning method to the actual roofing system and clearly explains runoff, access and limitations. Northeast Florida roofs include asphalt shingles, tile and metal, and each presents different risks.',
              'Compare roof cleaners by roofing judgment, not by pressure-washing claims',
              'Ask what material the company believes is on the roof, what method will reach the surface, how plants and property below are protected and what roof defects would cause the work to stop. Recent examples on the same roof type are more meaningful than unrelated exterior-cleaning photos. A responsible cleaner should also separate removable organic staining from fading, granule loss, corrosion, broken tile and other roofing conditions.',
              ['/learning-center/roof-cleaning/can-you-pressure-wash-roof-shingles/','/learning-center/roof-cleaning/tile-roof-cleaning-florida/','/learning-center/hiring/how-to-choose-a-pressure-washing-company/']),
            'learning-center/roof-cleaning/black-roof-streaks-algae-removal/index.html': (
              'Black roof streaks are common on Jacksonville and Northeast Florida roofs, but dark discoloration is not automatically one uniform condition. Organic growth, age-related color change, repairs and material wear can overlap visually from the ground.',
              'Identify what can be cleaned before promising what will disappear',
              'On asphalt shingles, dark organic streaking should be addressed with a roof-appropriate process rather than aggressive mechanical pressure. On tile or metal, the roof system and finish still control the method. Cleaning can improve compatible surface contamination, but it does not reverse granule loss, faded coatings, corrosion, broken tiles or mismatched replacement sections.',
              ['/learning-center/roof-cleaning/can-you-pressure-wash-roof-shingles/','/learning-center/roof-cleaning/how-long-does-roof-cleaning-last/','/learning-center/roof-cleaning/soft-washing-roof-vs-pressure-washing/']),
            'learning-center/roof-cleaning/soft-washing-roof-vs-pressure-washing/index.html': (
              'Roof cleaning in Jacksonville should begin with the roofing material rather than with a debate over equipment labels. Northeast Florida roofs can be asphalt shingle, tile or coated metal, and those systems do not have identical cleaning limits.',
              'Roof cleaning is about protecting the roof system while treating the staining',
              'The contractor should inspect age, damage, roof pitch, runoff paths and the visible finish before choosing a method. High mechanical pressure is not appropriate simply because staining is heavy. Low-pressure application still requires compatible chemistry, controlled runoff and realistic expectations about permanent fading, repairs, coating wear or structural roof defects that cleaning cannot correct.',
              ['/learning-center/roof-cleaning/can-you-pressure-wash-roof-shingles/','/learning-center/roof-cleaning/tile-roof-cleaning-florida/','/learning-center/roof-cleaning/metal-roof-cleaning-florida/']),
            'learning-center/stains/rust-irrigation-stains/index.html': (
              'Rust and irrigation stains on Jacksonville concrete, walls and fences are different from ordinary organic buildup. Northeast Florida irrigation systems can repeatedly deposit mineral-rich water on the same surfaces, creating orange or brown discoloration that normal pressure washing may not remove evenly.',
              'Specialty stain treatment starts with identifying the source',
              'A one-time rust spot from metal furniture is different from recurring irrigation overspray. If the source continues, staining can return even after successful treatment. Surface type also matters because bare concrete, painted walls, pavers and vinyl may tolerate different chemistry. A small test area helps establish whether the stain is removable without damaging the surrounding finish.',
              ['/learning-center/driveways/oil-stains-on-concrete/','/learning-center/driveways/how-to-remove-tire-marks-concrete-driveway/','/learning-center/comparisons/can-pressure-washing-damage-concrete/']),
            'learning-center/house-washing/what-is-soft-washing/index.html': (
              'Soft washing is commonly used on Jacksonville homes for surfaces where strong mechanical pressure is unnecessary or undesirable. Northeast Florida humidity can produce recurring algae and mildew, but the method still needs to be adapted to paint, siding, stucco, roofing and surrounding landscaping.',
              'Soft washing is a process, not simply “low PSI”',
              'A complete process considers the cleaning solution, concentration, dwell time, application pressure, rinse, runoff and the material being treated. Lower pressure can reduce mechanical risk, but chemistry can still affect plants, coatings or metals if it is poorly controlled. The safest approach is the least aggressive compatible method that achieves the cleaning goal while respecting the manufacturer and surface condition.',
              ['/learning-center/house-washing/soft-washing-vs-pressure-washing-a-house/','/learning-center/house-washing/is-soft-washing-safe-for-stucco-and-siding/','/learning-center/roof-cleaning/soft-washing-roof-vs-pressure-washing/']),
            'learning-center/house-washing/how-often-pressure-wash-house-florida/index.html': (
              'There is no universal schedule for washing every Jacksonville home. Northeast Florida humidity, shade, tree coverage, irrigation and the exterior material itself can make one side of a property soil much faster than another.',
              'Use visible conditions and material limits instead of a fixed calendar',
              'Green growth, pollen film, spider debris and noticeable dirt are practical triggers for inspection. Homes under trees or with shaded north-facing walls may need attention sooner than open, sunny properties. Washing too aggressively or too frequently can also expose weak paint, oxidation or aged components, so the goal is maintenance based on actual condition rather than an arbitrary number of months.',
              ['/learning-center/house-washing/why-green-algae-keeps-coming-back-on-siding/','/learning-center/house-washing/what-is-soft-washing/','/learning-center/house-washing/what-does-professional-house-wash-include/']),
            'learning-center/house-washing/can-you-pressure-wash-vinyl-siding/index.html': (
              'Vinyl siding on Jacksonville homes can develop green organic growth in humid, shaded areas while Florida sun creates a separate risk of fading and oxidation. Cleaning should remove compatible surface contamination without treating the siding like concrete.',
              'The biggest vinyl-siding mistake is confusing dirt with oxidation',
              'Powdery chalking, uneven fading and replacement panels can become more noticeable after the dirt is gone. Stronger pressure will not restore oxidized vinyl and can force water behind panels or damage weak accessories. A controlled wash should account for seams, vents, electrical fixtures, windows and the condition of the siding before the whole wall is treated.',
              ['/learning-center/house-washing/vinyl-siding-oxidation-house-washing/','/learning-center/house-washing/is-soft-washing-safe-for-stucco-and-siding/','/learning-center/house-washing/what-is-soft-washing/']),
            'learning-center/decks/deck-cleaning-jacksonville/index.html': (
              'Deck cleaning in Jacksonville can involve pressure-treated wood, older coated wood and composite products that have very different maintenance limits. Northeast Florida humidity, shade and rain can support organic buildup, but the material and existing finish should determine the process.',
              'A deck-cleaning plan should protect the surface you want to keep',
              'Wood can be scarred or furred by concentrated pressure, while composites may have manufacturer-specific cleaning limits and older coatings can fail unevenly. Before cleaning, inspect fasteners, splinters, loose boards, previous stain and the product type. If the deck will be stained afterward, cleaning should be coordinated with the coating manufacturer’s preparation and moisture requirements.',
              ['/learning-center/decks/deck-cleaning-before-staining/','/learning-center/fences/wood-vs-vinyl-fence-cleaning/','/learning-center/house-washing/pressure-washing-before-painting/']),
            'learning-center/patios/patio-cleaning-jacksonville/index.html': (
              'Patios in Jacksonville may be bare concrete, brick, pavers, natural stone or coated surfaces, so one cleaning method does not fit every backyard. Northeast Florida shade and humidity can produce organic buildup, while irrigation and furniture can create separate rust or mineral stains.',
              'Identify the patio material before choosing pressure or chemistry',
              'Concrete can tolerate a different mechanical process from a painted coating, paver joint system or softer stone. Furniture stains, grill grease, rust and irrigation deposits should be evaluated separately from ordinary dirt and algae. A good scope should also define whether adjoining walkways, pool decks, steps or screen-enclosure surfaces are included.',
              ['/learning-center/pool-areas/pool-deck-pool-cage-screen-enclosure-cleaning/','/learning-center/stains/rust-irrigation-stains/','/learning-center/comparisons/does-pressure-washing-remove-mold-mildew-algae/']),
            'learning-center/comparisons/does-pressure-washing-remove-mold-mildew-algae/index.html': (
              'Jacksonville’s warm, humid climate makes green and dark organic buildup a common exterior-cleaning issue. Whether pressure washing removes it safely depends on the surface: concrete, siding, roofs, fences and screens should not all receive the same mechanical force.',
              'Treat the organism and protect the substrate',
              'On durable flatwork, controlled pressure may be part of the process. On siding, roofs or screens, chemistry and lower pressure may do more of the cleaning work. The visible color can improve quickly, but recurring shade, moisture and vegetation can allow growth to return. Permanent discoloration, oxidation or material damage should not be mistaken for active organic buildup.',
              ['/learning-center/house-washing/what-is-soft-washing/','/learning-center/house-washing/why-green-algae-keeps-coming-back-on-siding/','/learning-center/comparisons/can-pressure-washing-damage-concrete/']),
            'learning-center/house-washing/pressure-washing-before-painting/index.html': (
              'Exterior cleaning before painting in Jacksonville should be coordinated with the coating system, not treated as an isolated wash. Northeast Florida humidity, afternoon rain and shaded walls can affect drying, while old paint, chalking and mildew influence preparation.',
              'Painting prep is about creating a sound coating surface, not just a clean-looking wall',
              'Washing can remove compatible dirt and organic buildup, but loose paint, failing caulk, oxidation and damaged substrate may need separate preparation. The painter or coating manufacturer should determine moisture, dry-time and surface-preparation requirements. Cleaning too aggressively can create new damage that remains visible beneath the finished paint.',
              ['/learning-center/decks/deck-cleaning-before-staining/','/learning-center/house-washing/what-does-professional-house-wash-include/','/learning-center/house-washing/can-you-pressure-wash-stucco/']),
            'learning-center/house-washing/soffit-fascia-cleaning-jacksonville/index.html': (
              'Soffits and fascia on Jacksonville homes collect spider debris, pollen, mildew and roof runoff, but they may also contain vents, painted surfaces, gutters and electrical components. Northeast Florida humidity can increase organic buildup while age and sun exposure affect the finish.',
              'Roofline cleaning should account for vents, coatings and water direction',
              'Soffit panels are not simply another wall surface. Vented sections, seams and attic openings make spray direction important, while painted fascia can show oxidation, peeling or previous water staining. Exterior gutter faces may be washed with the roofline but bonded tiger stripes can require a separate brightening process.',
              ['/learning-center/house-washing/what-does-professional-house-wash-include/','/learning-center/gutters/gutter-tiger-stripes/','/learning-center/house-washing/soft-washing-vs-pressure-washing-a-house/']),
            'learning-center/house-washing/why-green-algae-keeps-coming-back-on-siding/index.html': (
              'Green algae can return on Jacksonville siding because the conditions that supported the first growth often remain after cleaning. Northeast Florida humidity, shade, nearby vegetation, irrigation and slow-drying walls can make certain elevations soil faster than others.',
              'Recurring algae is usually a site-condition problem, not proof the previous wash failed',
              'A clean wall can begin collecting new spores and moisture immediately. North-facing walls, areas behind shrubs and sections hit by sprinklers may show growth first. Maintenance should therefore be based on the actual exposure of each side of the house. If discoloration returns almost immediately or looks chalky rather than green, oxidation or another surface condition may need to be evaluated separately.',
              ['/learning-center/house-washing/how-often-pressure-wash-house-florida/','/learning-center/house-washing/what-is-soft-washing/','/learning-center/house-washing/vinyl-siding-oxidation-house-washing/']),
            'learning-center/gutters/are-gutter-guards-worth-it-florida/index.html': (
              'Gutter guards can reduce the amount of large debris entering some Jacksonville gutters, but they do not make a gutter system maintenance-free. Northeast Florida pines, roof grit, small leaves and organic material can collect on top of guards or pass through openings.',
              'Judge gutter guards by the debris around the property and the maintenance they create',
              'A guard that works well under broad leaves may behave differently under pine needles or fine roof debris. Homeowners should consider how the guard can be inspected, whether it must be removed for cleaning, how water reaches the gutter during heavy rain and whether valleys dump concentrated flow onto the system. Overflow can still come from clogged outlets, poor pitch or undersized drainage even when the guards themselves look clean.',
              ['/learning-center/gutters/how-often-should-gutters-be-cleaned-florida/','/learning-center/gutters/clogged-downspout-signs/','/learning-center/gutters/best-gutter-cleaning-service-near-me/'])
          }

          assert len(upgrades) == 35, len(upgrades)
          marker='<!-- lc-depth-upgrade-remaining-20260817 -->'

          def strip_tags(value):
              value=re.sub(r'<script\b[^>]*>.*?</script>',' ',value,flags=re.S|re.I)
              value=re.sub(r'<style\b[^>]*>.*?</style>',' ',value,flags=re.S|re.I)
              value=re.sub(r'<[^>]+>',' ',value)
              return re.sub(r'\s+',' ',html.unescape(value)).strip()

          for filename,(local,heading,body,links) in upgrades.items():
              p=Path(filename)
              if not p.exists(): raise SystemExit(f'Missing target {filename}')
              s=p.read_text(encoding='utf-8')
              if marker in s: raise SystemExit(f'Already upgraded {filename}')

              qm=re.search(r'(<p class="quick-answer">.*?</p>)',s,re.S|re.I)
              if not qm: raise SystemExit(f'Missing quick answer {filename}')
              local_html=f'{marker}<p><strong>Jacksonville context:</strong> {local} <a href="/service-areas/jacksonville/">View Jacksonville service coverage</a>.</p>'
              s=s[:qm.end()]+local_html+s[qm.end():]

              link_items=''.join(f'<li><a href="{u}">{Path(u.rstrip("/")).name.replace("-"," ").title()}</a></li>' for u in links)
              block=(f'<h2>{heading}</h2><p>{body}</p>'
                     '<h2>What to verify before you approve the work</h2>'
                     '<ul class="checklist"><li><strong>Surface:</strong> Confirm the material and existing coating or damage before choosing a cleaning method.</li>'
                     '<li><strong>Scope:</strong> Make sure the quote states what is included, excluded and considered specialty treatment.</li>'
                     '<li><strong>Protection:</strong> Identify landscaping, fixtures, adjacent finishes and runoff paths that need attention.</li>'
                     '<li><strong>Expectations:</strong> Separate removable contamination from fading, oxidation, failed coatings or physical damage.</li></ul>'
                     '<h2>Related guides</h2><ul class="checklist">'+link_items+'</ul>'
                     '<p>For a property-specific recommendation, <a href="/contact/">request an exterior-cleaning estimate</a> and include wide photos plus close-ups of the main concern.</p>')

              note=re.search(r'<p class="article-note">',s,re.I)
              if note:
                  s=s[:note.start()]+block+s[note.start():]
              else:
                  related=re.search(r'<div class="related">',s,re.I)
                  if not related: raise SystemExit(f'Missing insertion point {filename}')
                  s=s[:related.start()]+block+s[related.start():]

              article_m=re.search(r'<div class="article-content"[^>]*>(.*?)(?:</div>\s*</article>)',s,re.S|re.I)
              if not article_m: raise SystemExit(f'Cannot measure body {filename}')
              wc=len(re.findall(r"[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)?",strip_tags(article_m.group(1))))

              script_re=re.compile(r'(<script\s+type="application/ld\+json"[^>]*>)(.*?)(</script>)',re.S|re.I)
              reps=[]
              for sm in script_re.finditer(s):
                  try: data=json.loads(sm.group(2))
                  except Exception as exc: raise SystemExit(f'Invalid JSON-LD {filename}: {exc}')
                  nodes=data.get('@graph') if isinstance(data,dict) and isinstance(data.get('@graph'),list) else ([data] if isinstance(data,dict) else [])
                  touched=False
                  for node in nodes:
                      if not isinstance(node,dict): continue
                      if node.get('@type')=='BlogPosting':
                          node['wordCount']=wc; node['dateModified']='2026-08-17'; touched=True
                      if node.get('@type')=='WebPage':
                          node['dateModified']='2026-08-17'; touched=True
                  if touched:
                      reps.append((sm.start(),sm.end(),sm.group(1)+json.dumps(data,ensure_ascii=False,separators=(',',':'))+sm.group(3)))
              for a,b,r in reversed(reps): s=s[:a]+r+s[b:]
              s=re.sub(r'(<meta property="article:modified_time" content=")[^"]*(")',r'\g<1>2026-08-17\2',s,count=1,flags=re.I)
              p.write_text(s,encoding='utf-8')
              print(f'upgraded {filename} -> {wc} words')

          # Structural validation on the 35 changed pages.
          for filename in upgrades:
              s=Path(filename).read_text(encoding='utf-8')
              if marker not in s: raise SystemExit(f'Marker missing {filename}')
              lc=set(re.findall(r'href="(/learning-center/[^"#]+/)"',s,re.I))
              if len(lc)<3: raise SystemExit(f'Need >=3 LC links {filename}: {len(lc)}')
              if 'href="/contact/"' not in s: raise SystemExit(f'CTA missing {filename}')
              if 'href="/service-areas/jacksonville/"' not in s: raise SystemExit(f'Local link missing {filename}')
              if '"@type":"FAQPage"' not in s: raise SystemExit(f'FAQ schema missing {filename}')
              if '<div class="faq"><h2>Common questions</h2>' not in s: raise SystemExit(f'Visible FAQ missing {filename}')
          print('PASS: 35 remaining Learning Center articles upgraded')
