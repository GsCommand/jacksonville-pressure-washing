name: Audit Learning Center FAQ schema parity
on:
  push:
    paths:
      - '.github/workflows/audit-learning-center-faq-schema.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit and synchronize FAQ schema
        shell: python
        run: |
          from pathlib import Path
          import json, re, html

          files = sorted(Path('learning-center').glob('*/*/index.html'))
          if len(files) != 53:
              raise SystemExit(f'Expected 53 Learning Center article pages, found {len(files)}')

          faq_block_re = re.compile(r'<div class="faq"><h2>Common questions</h2>(.*?)</div>', re.S | re.I)
          qa_re = re.compile(r'<details[^>]*>\s*<summary>(.*?)</summary>\s*<p>(.*?)</p>\s*</details>', re.S | re.I)
          script_re = re.compile(r'(<script\s+type="application/ld\+json"[^>]*>)(.*?)(</script>)', re.S | re.I)
          canonical_re = re.compile(r'<link\s+rel="canonical"\s+href="([^"]+)"', re.I)
          tag_re = re.compile(r'<[^>]+>')

          def textify(value):
              value = tag_re.sub('', value)
              value = html.unescape(value)
              return re.sub(r'\s+', ' ', value).strip()

          def visible_pairs(markup, path):
              m = faq_block_re.search(markup)
              if not m:
                  raise SystemExit(f'Missing visible Common questions accordion: {path}')
              pairs = [(textify(q), textify(a)) for q, a in qa_re.findall(m.group(1))]
              if not pairs:
                  raise SystemExit(f'No visible FAQ questions found: {path}')
              if len({q for q, _ in pairs}) != len(pairs):
                  raise SystemExit(f'Duplicate visible FAQ question found: {path}')
              return pairs

          def expected_entities(pairs):
              return [
                  {
                      '@type': 'Question',
                      'name': q,
                      'acceptedAnswer': {'@type': 'Answer', 'text': a}
                  }
                  for q, a in pairs
              ]

          changed = []
          added = []
          total_questions = 0

          for path in files:
              source = path.read_text(encoding='utf-8')
              pairs = visible_pairs(source, path)
              total_questions += len(pairs)
              wanted = expected_entities(pairs)

              scripts = list(script_re.finditer(source))
              if not scripts:
                  raise SystemExit(f'No JSON-LD found: {path}')

              parsed = []
              faq_locations = []
              for i, match in enumerate(scripts):
                  try:
                      data = json.loads(match.group(2))
                  except Exception as exc:
                      raise SystemExit(f'Invalid JSON-LD in {path}: {exc}')
                  parsed.append(data)
                  graph = data.get('@graph') if isinstance(data, dict) else None
                  nodes = graph if isinstance(graph, list) else ([data] if isinstance(data, dict) else [])
                  for j, node in enumerate(nodes):
                      if isinstance(node, dict) and node.get('@type') == 'FAQPage':
                          faq_locations.append((i, j, node, graph))

              if len(faq_locations) > 1:
                  raise SystemExit(f'Multiple FAQPage nodes found; manual review required: {path}')

              file_changed = False
              if faq_locations:
                  i, j, faq_node, graph = faq_locations[0]
                  current = faq_node.get('mainEntity')
                  if current != wanted:
                      faq_node['mainEntity'] = wanted
                      file_changed = True
                      changed.append(str(path))
              else:
                  canonical = canonical_re.search(source)
                  if not canonical:
                      raise SystemExit(f'Missing canonical needed for FAQ @id: {path}')
                  faq_node = {
                      '@type': 'FAQPage',
                      '@id': canonical.group(1).rstrip('/') + '/#faq',
                      'mainEntity': wanted
                  }
                  target_index = None
                  for i, data in enumerate(parsed):
                      if isinstance(data, dict) and isinstance(data.get('@graph'), list):
                          target_index = i
                          data['@graph'].append(faq_node)
                          break
                  if target_index is None:
                      raise SystemExit(f'No @graph available to add FAQPage: {path}')
                  file_changed = True
                  added.append(str(path))

              if file_changed:
                  replacements = []
                  for match, data in zip(scripts, parsed):
                      rendered = match.group(1) + json.dumps(data, ensure_ascii=False, separators=(',', ':')) + match.group(3)
                      replacements.append((match.start(), match.end(), rendered))
                  for start, end, rendered in reversed(replacements):
                      source = source[:start] + rendered + source[end:]
                  path.write_text(source, encoding='utf-8')

          # Second pass: exact visible/schema parity on every article.
          for path in files:
              source = path.read_text(encoding='utf-8')
              pairs = visible_pairs(source, path)
              wanted = expected_entities(pairs)
              faq_nodes = []
              for match in script_re.finditer(source):
                  data = json.loads(match.group(2))
                  graph = data.get('@graph') if isinstance(data, dict) else None
                  nodes = graph if isinstance(graph, list) else ([data] if isinstance(data, dict) else [])
                  faq_nodes.extend(node for node in nodes if isinstance(node, dict) and node.get('@type') == 'FAQPage')
              if len(faq_nodes) != 1:
                  raise SystemExit(f'Expected exactly one FAQPage after audit: {path}; found {len(faq_nodes)}')
              if faq_nodes[0].get('mainEntity') != wanted:
                  raise SystemExit(f'FAQ schema does not exactly match visible FAQ after audit: {path}')

          print(f'Audited {len(files)} Learning Center articles')
          print(f'Validated {total_questions} visible FAQ questions against schema')
          print(f'Corrected schema mismatches on {len(changed)} pages')
          print(f'Added missing FAQPage schema on {len(added)} pages')
          if changed:
              print('Corrected pages:')
              for p in changed: print(f'  - {p}')
          if added:
              print('Schema added:')
              for p in added: print(f'  - {p}')
          print('PASS: all 53 articles now have exact visible FAQ / FAQPage schema parity')
      - name: Commit fixes and self-delete workflow
        run: |
          rm .github/workflows/audit-learning-center-faq-schema.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learning-center .github/workflows/audit-learning-center-faq-schema.yml
          git commit -m 'Audit and sync Learning Center FAQ schema'
          git push
