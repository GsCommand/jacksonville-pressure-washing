name: Rescore upgraded Learning Center articles
on:
  push:
    paths:
      - '.github/workflows/rescore-upgraded-learning-center.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Score upgraded pages with original rubric
        shell: python
        run: |
          from pathlib import Path
          import re,json,html,itertools,collections

          targets=set([
          'learning-center/decks/deck-cleaning-before-staining/index.html',
          'learning-center/gutters/gutter-tiger-stripes/index.html',
          'learning-center/fences/wood-vs-vinyl-fence-cleaning/index.html',
          'learning-center/gutters/clogged-downspout-signs/index.html',
          'learning-center/gutters/gutter-cleaning-vs-gutter-brightening/index.html',
          'learning-center/roof-cleaning/can-you-pressure-wash-roof-shingles/index.html',
          'learning-center/roof-cleaning/metal-roof-cleaning-florida/index.html',
          'learning-center/roof-cleaning/tile-roof-cleaning-florida/index.html',
          'learning-center/gutters/interior-gutter-cleaning-vs-exterior-gutter-washing/index.html',
          'learning-center/house-washing/vinyl-siding-oxidation-house-washing/index.html',
          'learning-center/house-washing/what-does-professional-house-wash-include/index.html',
          'learning-center/driveways/how-to-remove-tire-marks-concrete-driveway/index.html',
          'learning-center/comparisons/can-pressure-washing-damage-concrete/index.html',
          'learning-center/fences/vinyl-fence-cleaning-florida/index.html',
          'learning-center/house-washing/can-you-pressure-wash-stucco/index.html',
          'learning-center/pool-areas/pool-cage-vs-screen-enclosure-cleaning/index.html',
          'learning-center/roof-cleaning/asphalt-shingle-roof-cleaning/index.html',
          'learning-center/roof-cleaning/how-long-does-roof-cleaning-last/index.html'])
          files=sorted(Path('learning-center').glob('*/*/index.html'))
          stop=set('the a an and or but for of in on to is are was were be been being with by from at as it this that these those your you our we us they their how what why when where who can should does do did will would could about into than vs near best guide florida jacksonville fl'.split())
          def strip_tags(s):
              s=re.sub(r'<script\b[^>]*>.*?</script>',' ',s,flags=re.S|re.I); s=re.sub(r'<style\b[^>]*>.*?</style>',' ',s,flags=re.S|re.I); s=re.sub(r'<[^>]+>',' ',s); return re.sub(r'\s+',' ',html.unescape(s)).strip()
          def words(s): return re.findall(r"[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)?",s.lower())
          def core(s): return {w for w in words(s) if len(w)>2 and w not in stop}
          def article(s):
              m=re.search(r'<div class="article-content"[^>]*>(.*?)(?:</div>\s*</article>)',s,re.S|re.I); return m.group(1) if m else s
          def simbody(s):
              b=article(s); b=re.sub(r'<div class="faq">.*?</div>',' ',b,flags=re.S|re.I); b=re.sub(r'<div class="related">.*?</div>',' ',b,flags=re.S|re.I); return strip_tags(b)
          def shingles(t,n=5):
              w=[x for x in words(t) if len(x)>1]; return set(tuple(w[i:i+n]) for i in range(max(0,len(w)-n+1)))
          def jac(a,b): return len(a&b)/len(a|b) if a and b else 0

          raw={str(p).replace('\\','/'):p.read_text(encoding='utf-8') for p in files}
          sh={k:shingles(simbody(v)) for k,v in raw.items()}
          maxsim={k:max((jac(sh[k],sh[o]),o) for o in raw if o!=k) for k in raw}
          paras={}
          pp=collections.defaultdict(set)
          for k,s in raw.items():
              ps=[]
              for x in re.findall(r'<p\b[^>]*>(.*?)</p>',article(s),re.S|re.I):
                  t=strip_tags(x).lower()
                  if len(words(t))>=12: ps.append(re.sub(r'\s+',' ',t))
              paras[k]=ps
              for p in set(ps): pp[p].add(k)
          rpt={k:sum(1 for p in set(paras[k]) if len(pp[p])>=2) for k in raw}
          titles=collections.defaultdict(list); metas=collections.defaultdict(list); h1s=collections.defaultdict(list)
          parsed={}
          for k,s in raw.items():
              title=strip_tags(re.search(r'<title>(.*?)</title>',s,re.S|re.I).group(1)); meta=html.unescape(re.search(r'<meta\s+name="description"\s+content="([^"]*)"',s,re.I).group(1)); h1=strip_tags(re.search(r'<h1\b[^>]*>(.*?)</h1>',s,re.S|re.I).group(1))
              titles[title.lower()].append(k); metas[meta.lower()].append(k); h1s[h1.lower()].append(k); parsed[k]=(title,meta,h1)

          results=[]
          for k in sorted(targets):
              s=raw[k]; a=article(s); text=strip_tags(a); title,meta,h1=parsed[k]; wc=len(words(text)); h2=len(re.findall(r'<h2\b',a,re.I)); lists=len(re.findall(r'<(?:ul|ol)\b',a,re.I)); tables=len(re.findall(r'<table\b',a,re.I)); imgs=len(re.findall(r'<img\b',a,re.I));
              hrefs=[x for x in re.findall(r'<a\b[^>]*href="([^"]+)"',a,re.I) if x.startswith('/') or 'jacksonvillepressurewashingfl.com' in x]
              uniq=sorted(set(hrefs)); lc=[x for x in uniq if x.startswith('/learning-center/')]; svc=[x for x in uniq if any(x.startswith(z) for z in ['/pressure-washing-jacksonville-fl/','/house-washing-jacksonville-fl/','/roof-cleaning-jacksonville-fl/','/gutter-cleaning-jacksonville-fl/','/service-areas/'])]; cta=[x for x in uniq if x.startswith('/contact')]
              scripts=re.findall(r'<script\s+type="application/ld\+json"[^>]*>(.*?)</script>',s,re.S|re.I); types=[]; fq=0; valid=True
              for z in scripts:
                  try:d=json.loads(z)
                  except: valid=False; continue
                  nodes=d.get('@graph',[]) if isinstance(d,dict) else []
                  for n in nodes:
                      if isinstance(n,dict):
                          t=n.get('@type'); types.extend(t if isinstance(t,list) else ([t] if t else [])); fq=len(n.get('mainEntity',[]) or []) if t=='FAQPage' else fq
              visible_fq=len(re.findall(r'<details[^>]*>\s*<summary>',a,re.S|re.I)); localhits=sum(1 for term in ['jacksonville','northeast florida','florida','duval','st. johns','clay county','nassau','ponte vedra','nocatee','orange park','fernandina'] if term in text.lower()); intro=' '.join(words(text)[:180]); tc=core(title); hc=core(h1); sc=core(Path(k).parent.name.replace('-',' ')); ic=core(intro)
              th=len(tc&hc)/max(1,len(tc|hc)); st=len(sc&tc)/max(1,len(sc)) if sc else 0; io=len(tc&ic)/max(1,len(tc)) if tc else 0
              tech=(3 if 'rel="canonical"' in s else 0)+(2 if 'index,follow' in s else 0)+(2 if h1 else 0)+(2 if valid else 0)+(2 if 'BlogPosting' in types else 0)+(2 if 'BreadcrumbList' in types else 0)+(2 if 'FAQPage' in types and fq==visible_fq and fq>0 else 0)
              intent=(4 if th>=.45 else 3 if th>=.25 else 1)+(2 if 28<=len(title)<=72 else 1)+(2 if 110<=len(meta)<=185 else 1 if 70<=len(meta)<=220 else 0)+(3 if st>=.55 else 2 if st>=.35 else 1)+(2 if 'class="quick-answer"' in a else 0)+(2 if io>=.45 else 1 if io>=.25 else 0)
              ms=maxsim[k][0]; rp=rpt[k]
              content=(5 if wc>=650 else 4 if wc>=500 else 2 if wc>=350 else 0)+(4 if h2>=5 else 3 if h2>=3 else 1 if h2>=2 else 0)+(3 if lists+tables>=2 else 2 if lists+tables>=1 else 0)+(3 if visible_fq>=3 else 2 if visible_fq>=2 else 0)+(5 if ms<.18 else 4 if ms<.25 else 2 if ms<.35 else 0)+(5 if rp<=1 else 4 if rp<=3 else 2 if rp<=6 else 0)
              links=(4 if len(uniq)>=4 else 3 if len(uniq)>=3 else 2 if len(uniq)>=2 else 0)+(4 if len(lc)>=2 else 2 if len(lc)==1 else 0)+(4 if len(svc)>=1 else 0)+(2 if len(cta)>=1 else 0)+1
              trust=(4 if 'Written and reviewed by Jacksonville Pressure Washing' in s else 0)+(2 if 'licensed and insured' in s.lower() else 0)+(3 if len(re.findall(r'href="https?://(?!jacksonvillepressurewashingfl\.com)',a,re.I))>=1 else 0)+(3 if localhits>=3 else 2 if localhits>=2 else 1 if localhits>=1 else 0)+(3 if imgs>=1 else 0)
              local=(3 if ('jacksonville' in title.lower() or 'florida' in title.lower()) else 2 if ('jacksonville' in h1.lower() or 'florida' in h1.lower()) else 0)+(3 if localhits>=3 else 2 if localhits>=2 else 1 if localhits>=1 else 0)+(2 if ('jacksonville' in intro or 'florida' in intro) else 0)+(2 if any('/service-areas/' in u for u in uniq) else 0)
              dup=(1 if len(titles[title.lower()])==1 else 0)+(1 if len(metas[meta.lower()])==1 else 0)+(1 if len(h1s[h1.lower()])==1 else 0)+(2 if ms<.25 else 1 if ms<.35 else 0)
              total=tech+intent+content+links+trust+local+dup
              results.append((total,k,wc,ms,rp,tech,intent,content,links,trust,local,dup,len(lc)))
          print('score\twords\tsim\trepeat\tT\tI\tC\tL\tE\tLOC\tD\tLC\tpath')
          for r in sorted(results): print(f'{r[0]}\t{r[2]}\t{r[3]:.3f}\t{r[4]}\t{r[5]}\t{r[6]}\t{r[7]}\t{r[8]}\t{r[9]}\t{r[10]}\t{r[11]}\t{r[12]}\t{r[1]}')
          print(f'MIN={min(r[0] for r in results)} AVG={sum(r[0] for r in results)/len(results):.1f} PASS90={sum(r[0]>=90 for r in results)}/{len(results)}')
      - name: Self-delete
        run: |
          rm .github/workflows/rescore-upgraded-learning-center.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/rescore-upgraded-learning-center.yml
          git commit -m 'Remove temporary Learning Center rescore'
          git push
