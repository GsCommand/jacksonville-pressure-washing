name: Add service area card images
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/add-service-area-images-trigger'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Copy HydroSeal service area hero images
        run: |
          mkdir -p images
          curl -L --fail --silent --show-error \
            https://raw.githubusercontent.com/GsCommand/hydrosealpavers-site/main/assets/hero/paversealing-jacksonville.webp \
            -o images/jacksonville-service-area.webp
          curl -L --fail --silent --show-error \
            https://raw.githubusercontent.com/GsCommand/hydrosealpavers-site/main/assets/hero/st-johns-paver-sealing-nocatee-driveway.webp \
            -o images/st-johns-county-service-area.webp
          curl -L --fail --silent --show-error \
            https://raw.githubusercontent.com/GsCommand/hydrosealpavers-site/main/assets/hero/paversealing-clay-county.png \
            -o images/clay-county-service-area.png

      - name: Add images to homepage service area cards
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '''.service-area-card{padding:0!important;overflow:hidden}.service-area-card__image{width:100%;height:205px;object-fit:cover;display:block}.service-area-card__body{padding:25px 27px 27px}.service-area-card__body h3{margin:0 0 8px}.service-area-card__body p{margin:0}@media(max-width:650px){.service-area-card__image{height:190px}}'''
          if '.service-area-card__image{' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          replacements = {
            '<a class="service-card" href="/service-areas/jacksonville/"><h3>Jacksonville</h3><p>Duval County homes, neighborhoods and commercial properties.</p></a>':
            '<a class="service-card service-area-card" href="/service-areas/jacksonville/"><img class="service-area-card__image" src="/images/jacksonville-service-area.webp" alt="Jacksonville exterior service area" loading="lazy" decoding="async"><div class="service-area-card__body"><h3>Jacksonville</h3><p>Duval County homes, neighborhoods and commercial properties.</p></div></a>',

            '<a class="service-card" href="/service-areas/st-johns-county/"><h3>St. Johns County</h3><p>Nocatee, Ponte Vedra, St. Johns and nearby communities.</p></a>':
            '<a class="service-card service-area-card" href="/service-areas/st-johns-county/"><img class="service-area-card__image" src="/images/st-johns-county-service-area.webp" alt="St. Johns County exterior service area" loading="lazy" decoding="async"><div class="service-area-card__body"><h3>St. Johns County</h3><p>Nocatee, Ponte Vedra, St. Johns and nearby communities.</p></div></a>',

            '<a class="service-card" href="/service-areas/clay-county/"><h3>Clay County</h3><p>Orange Park, Fleming Island, Oakleaf and surrounding areas.</p></a>':
            '<a class="service-card service-area-card" href="/service-areas/clay-county/"><img class="service-area-card__image" src="/images/clay-county-service-area.png" alt="Clay County exterior service area" loading="lazy" decoding="async"><div class="service-area-card__body"><h3>Clay County</h3><p>Orange Park, Fleming Island, Oakleaf and surrounding areas.</p></div></a>'
          }

          changed = 0
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
                  changed += 1
              elif new in s:
                  changed += 1
              else:
                  raise SystemExit('Could not find expected service-area card markup')

          if changed != 3:
              raise SystemExit(f'Expected 3 service area cards, got {changed}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html images/jacksonville-service-area.webp images/st-johns-county-service-area.webp images/clay-county-service-area.png
          git commit -m "Add service area images to homepage cards" || exit 0
          git push
