name: Standardize Learning Center FAQ heading structure
on:
  push:
    paths:
      - '.github/workflows/standardize-learning-center-faq-headings.yml'
permissions:
  contents: write
jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert Learning Center FAQs to H2 H3 paragraphs
        shell: python
        run: |
          from pathlib import Path
          import re, json, html

          root = Path('learning-center')
          files = sorted(p for p in root.rglob('index.html') if p != root / 'index.html')
          if len(files) != 53:
              raise SystemExit(f'Expected 53 Learning Center article pages, found {len(files)}')

          def faq_from_doc(text):
              scripts = re.findall(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', text, flags=re.I|re.S)
              found = []
              def walk(obj):
                  if isinstance(obj, dict):
                      t = obj.get('@type')
                      if t == 'FAQPage' or (isinstance(t, list) and 'FAQPage' in t):
                          found.append(obj)
                      for v in obj.values():
                          walk(v)
                  elif isinstance(obj, list):
                      for v in obj: walk(v)
              for raw in scripts:
                  try:
                      walk(json.loads(raw))
                  except Exception:
                      pass
              return found[0] if found else None

          def build_section(faq):
              items = faq.get('mainEntity') or []
              if not isinstance(items, list):
                  items = [items]
              bits = ['<section class="lc-common-questions"><h2>Common questions</h2>']
              count = 0
              for q in items:
                  if not isinstance(q, dict):
                      continue
                  question = q.get('name')
                  ans = q.get('acceptedAnswer') or {}
                  answer = ans.get('text') if isinstance(ans, dict) else None
                  if not question or not answer:
                      continue
                  bits.append(f'<h3>{html.escape(str(question), quote=False)}</h3><p>{html.escape(str(answer), quote=False)}</p>')
                  count += 1
              bits.append('</section>')
              return ''.join(bits), count

          changed = []
          missing_schema = []
          missing_questions = []
          for p in files:
              s = p.read_text(encoding='utf-8')
              faq = faq_from_doc(s)
              if not faq:
                  missing_schema.append(str(p))
                  continue
              new_section, qcount = build_section(faq)
              if qcount == 0:
                  missing_questions.append(str(p))
                  continue

              original = s
              # Current generated article format.
              s, n = re.subn(r'<div\s+class=["\']faq["\'][^>]*>.*?</div>', new_section, s, count=1, flags=re.I|re.S)
              # Section-based FAQ formats.
              if not n:
                  s, n = re.subn(r'<section\s+class=["\'][^"\']*faq[^"\']*["\'][^>]*>.*?</section>', new_section, s, count=1, flags=re.I|re.S)
              if not n:
                  s, n = re.subn(r'<section[^>]*>\s*<h2[^>]*>\s*(?:Frequently\s+asked\s+questions|Common\s+questions|FAQ(?:s)?)\s*</h2>.*?</section>', new_section, s, count=1, flags=re.I|re.S)
              # Existing plain FAQ block not wrapped in section/div: replace from H2 through the next H2/related block.
              if not n:
                  pat = r'<h2[^>]*>\s*(?:Frequently\s+asked\s+questions|Common\s+questions|FAQ(?:s)?)\s*</h2>.*?(?=<h2\b|<div\s+class=["\']related["\']|<section\s+class=["\'][^"\']*related|</(?:div|article)>)'
                  s, n = re.subn(pat, new_section, s, count=1, flags=re.I|re.S)
              # If schema exists but no visible FAQ block, insert before Related content or article close.
              if not n:
                  anchors = [
                      r'(?=<div\s+class=["\']related["\'])',
                      r'(?=<section\s+class=["\'][^"\']*related[^"\']*["\'])',
                      r'(?=</div>\s*</article>)',
                      r'(?=</article>)',
                  ]
                  for anchor in anchors:
                      s, n = re.subn(anchor, new_section, s, count=1, flags=re.I|re.S)
                      if n:
                          break
              if not n:
                  raise SystemExit(f'Could not locate insertion point for {p}')

              if s != original:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))

          if missing_schema:
              raise SystemExit('Missing FAQPage schema on: ' + ', '.join(missing_schema))
          if missing_questions:
              raise SystemExit('FAQPage schema has no usable questions on: ' + ', '.join(missing_questions))

          # Final verification: every article has one Common questions H2, H3/P visible questions matching FAQ schema count, and no accordion inside that section.
          problems = []
          total_questions = 0
          for p in files:
              s = p.read_text(encoding='utf-8')
              faq = faq_from_doc(s)
              items = faq.get('mainEntity') or []
              if not isinstance(items, list): items = [items]
              expected = sum(1 for q in items if isinstance(q, dict) and q.get('name') and isinstance(q.get('acceptedAnswer'), dict) and q['acceptedAnswer'].get('text'))
              m = re.search(r'<section\s+class=["\']lc-common-questions["\'][^>]*>(.*?)</section>', s, flags=re.I|re.S)
              if not m:
                  problems.append(f'{p}: missing lc-common-questions section')
                  continue
              block = m.group(1)
              h3s = len(re.findall(r'<h3\b', block, flags=re.I))
              ps = len(re.findall(r'<p\b', block, flags=re.I))
              if '<details' in block.lower() or '<summary' in block.lower():
                  problems.append(f'{p}: accordion markup remains')
              if '<h2>Common questions</h2>' not in '<section class="lc-common-questions">'+block+'</section>':
                  problems.append(f'{p}: Common questions H2 missing')
              if h3s != expected or ps != expected:
                  problems.append(f'{p}: expected {expected} questions, found {h3s} H3 / {ps} P')
              total_questions += expected
          if problems:
              raise SystemExit('\n'.join(problems))
          print(f'Validated {len(files)} articles, {len(changed)} changed, {total_questions} FAQ questions rendered as H3/P.')
      - name: Commit and self-delete workflow
        run: |
          rm .github/workflows/standardize-learning-center-faq-headings.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learning-center .github/workflows/standardize-learning-center-faq-headings.yml
          git commit -m 'Use H2 H3 FAQ structure on Learning Center articles'
          git push
