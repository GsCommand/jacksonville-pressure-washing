name: Learning Center batch 2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/learning-center-batch-2.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish remaining guides and update hub
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,html
          W=Path('.github/workflows/learning-center-batch-2.yml'); BASE='https://jacksonvillepressurewashingfl.com'; DATE='2026-08-17'
          sample=Path('learning-center/house-washing/what-is-soft-washing/index.html').read_text()
          NAV=re.search(r'(<header class="home-header">.*?</header>)',sample,re.S).group(1)
          STYLE=re.search(r'(<style>.*?</style>)',sample,re.S).group(1)
          SCRIPT=re.search(r'(<script>const t=.*?</script>)',sample,re.S).group(1)
          A=[
          {'cat':'gutters','slug':'gutter-cleaning-vs-gutter-brightening','title':'Gutter Cleaning vs. Gutter Brightening: What’s the Difference?','desc':'Learn the difference between removing debris from inside gutters and cleaning the stained exterior gutter face.','quick':'Gutter cleaning and gutter brightening solve different problems. Interior cleaning removes leaves, roof grit and debris so water can move through the channel and accessible downspouts. Brightening targets staining on the outside painted face of the gutter.','sections':[('Interior gutter cleaning is about drainage','The basic gutter-cleaning job focuses on material inside the gutter channel. Leaves, pine needles, roof granules and compacted debris can obstruct flow or collect around outlets. A clean exterior face does not prove that the inside is open, and a clean channel does not guarantee that the outside looks bright.'),('Brightening is an appearance service','Exterior gutter streaks can remain after a house wash or interior cleanout. Brightening uses a separate cleaning approach for the painted gutter face. The goal is cosmetic improvement, not drainage repair.'),('Oxidation changes what is possible','Older painted aluminum gutters may be chalky, faded or oxidized. Those coating conditions are different from removable dirt. Aggressive scrubbing or chemistry can create uneven appearance, so the paint condition should be evaluated before brightening.'),('Quote the two scopes separately','Homeowners comparing gutter-cleaning prices should ask whether the quote includes only interior debris removal, downspout attention, exterior face cleaning or full brightening. Clear scope language prevents two very different services from being compared as though they were identical.')], 'service':'/gutter-cleaning-jacksonville-fl/','service_name':'Gutter Cleaning','faqs':[('Does gutter cleaning include brightening?','Not automatically. Interior debris removal and exterior brightening are separate scopes unless the quote says otherwise.'),('Can a house wash remove gutter stripes?','It may remove general organic film, but bonded exterior streaks can require a dedicated brightening process.'),('Does gutter brightening improve drainage?','No. Drainage depends on the gutter channel, outlets and downspouts rather than the appearance of the exterior face.')], 'sources':[]},
          {'cat':'gutters','slug':'clogged-downspout-signs','title':'How to Tell if a Downspout Is Clogged Before Your Gutters Overflow','desc':'Signs of a clogged gutter outlet or downspout and why clearing the gutter channel alone may not restore drainage.','quick':'Common warning signs include water spilling over one section during rain, standing water near an outlet, little or no discharge from the bottom of a downspout, or repeated debris buildup around the same outlet.','sections':[('Overflow can point to more than one problem','Water spilling over the gutter edge can come from a clogged channel, blocked outlet, clogged downspout or a gutter that is holding water because of slope or damage. Cleaning should identify where the water stops moving instead of assuming every overflow is the same.'),('Watch the discharge point during rain','If one downspout produces little water while nearby roof areas are receiving rain, the restriction may be in the outlet or downspout. Splashing high on the gutter with little discharge below is another clue. Safe ground-level observation can provide useful information before service.'),('Debris can compact below the visible gutter','Leaves and roof grit can collect at elbows or transitions where they are not visible from above. Removing the top layer of debris is not enough if the downspout remains blocked farther down.'),('Drainage problems can also be installation problems','A gutter can be clean and still hold water if it is damaged, separated, undersized for the roof area or incorrectly pitched. Cleaning fixes debris-related restrictions; it does not replace gutter repair or redesign.')], 'service':'/gutter-cleaning-jacksonville-fl/','service_name':'Gutter Cleaning','faqs':[('Can a downspout be clogged even when the gutter looks clean?','Yes. Debris can lodge inside elbows or lower sections that are not visible from the gutter channel.'),('Does gutter cleaning include downspouts?','That depends on the quoted scope. Ask whether accessible outlets and downspouts are checked or flushed.'),('Will cleaning fix a gutter that holds water?','Only if debris is the cause. Pitch, damage or installation problems require repair rather than cleaning.')], 'sources':[]},
          {'cat':'fences','slug':'vinyl-fence-cleaning-florida','title':'Vinyl Fence Cleaning in Florida: How to Remove Green Algae and Mildew','desc':'Why Florida vinyl and PVC fences turn green, how cleaning differs from restoration and what to inspect before washing.','quick':'Green buildup on vinyl and PVC fences is commonly associated with organic growth on shaded or slow-drying surfaces. Cleaning should use a material-appropriate process rather than close-range pressure that can mark panels or force water and debris into joints.','sections':[('Why white fences show buildup quickly','Bright vinyl makes green film, pollen, irrigation residue and splashback easy to see. Shaded sides and panels near landscaping can stay damp longer, so one side of the fence may need attention before another.'),('Low pressure usually does more than enough','Vinyl does not need the same mechanical force as old concrete. Treatment and controlled rinsing can address ordinary organic buildup while reducing the chance of wand marks or damage around caps, gates and panel joints.'),('Not every stain is algae','Irrigation rust, paint transfer, oxidation, scuffs and embedded discoloration can look different from organic growth and may need specialty treatment. A normal fence wash should not be sold as guaranteed restoration of every mark.'),('Gates and hardware deserve inspection','Hinges, latches, decorative caps and nearby plants can be affected by cleaning solution or concentrated spray. A complete fence-cleaning plan includes these details instead of treating the fence as one uninterrupted flat surface.')], 'service':'/pressure-washing-jacksonville-fl/fence-cleaning/','service_name':'Fence Cleaning','faqs':[('Can you pressure wash a vinyl fence?','Vinyl can be cleaned, but aggressive close-range pressure is usually unnecessary and can create surface or joint problems.'),('Why does a vinyl fence turn green?','Shade, moisture, pollen and organic growth can create green film, especially in slow-drying areas.'),('Will cleaning remove irrigation rust?','Rust and mineral staining can require separate chemistry from ordinary organic fence cleaning.')], 'sources':[]},
          {'cat':'fences','slug':'wood-vs-vinyl-fence-cleaning','title':'Wood Fence vs. Vinyl Fence Cleaning: Why the Cleaning Method Changes','desc':'Compare wood and vinyl fence cleaning, including pressure risk, coatings, organic buildup and restoration expectations.','quick':'Wood and vinyl fences should not be cleaned the same way. Vinyl is a manufactured surface with seams and hardware; wood is porous, can raise grain or splinter, and may have stain, paint or weathering that changes how much pressure it can tolerate.','sections':[('Wood is porous and condition-sensitive','Age, species, grain, previous stain and sun exposure can make one wood fence very different from another. Too much pressure can fur or splinter the surface and create visible wand marks.'),('Vinyl is smoother but still not indestructible','PVC and vinyl panels can show organic film clearly and usually do not require aggressive pressure. Gates, caps, seams and oxidized or scuffed areas should be inspected before cleaning.'),('Cleaning is not the same as refinishing','A weathered gray wood fence may be clean and still look aged. Likewise, scratched or faded vinyl may remain imperfect after organic buildup is removed. Restoration, brightening, sanding, staining and painting are separate scopes.'),('Test the method before committing to the whole fence','An inconspicuous test area can reveal oxidation, coating failure, raised wood grain or unexpected color change. That is especially useful on older fences or surfaces with unknown previous treatment.')], 'service':'/pressure-washing-jacksonville-fl/fence-cleaning/','service_name':'Fence Cleaning','faqs':[('Which fence can take more pressure?','There is no universal answer. Material, age, coating and condition determine what is safe.'),('Can pressure washing damage wood grain?','Yes. Excessive pressure or close nozzle distance can fur, splinter or mark wood.'),('Does fence cleaning include staining?','Not unless specifically quoted. Cleaning and coating or refinishing are separate services.')], 'sources':[]},
          {'cat':'decks','slug':'deck-cleaning-jacksonville','title':'Deck Cleaning in Jacksonville: Wood, Composite and Trex Deck Cleaning','desc':'How deck-cleaning methods change for wood, composite and Trex products in Jacksonville’s outdoor environment.','quick':'Deck cleaning starts by identifying the product. Wood, capped composite and older composite decking can have very different manufacturer limits. A pressure setting that is acceptable for one deck can permanently mark another.','sections':[('Wood decks need condition-based cleaning','Wood species, age, previous stain and sun exposure affect how the surface responds. Excessive pressure can raise grain and leave lines. If the deck will be stained afterward, the cleaning method should also support the coating manufacturer’s preparation requirements.'),('Composite is not one universal material','Modern capped composite products can have manufacturer-approved washing limits, while older generations may carry stronger warnings against pressure washing. Brand and product line matter more than the generic word composite.'),('Trex publishes product-specific guidance','Trex states that some current product lines can be gently pressure washed with a fan tip within stated limits, while it does not recommend pressure washing certain earlier-generation products. That is a good example of why manufacturer instructions should be checked before cleaning.'),('Florida debris can support organic growth','Pollen, leaves, food residue and damp debris can collect in board texture and gaps. Regular removal of debris can reduce the material that supports mildew and mold-like growth on the surface.')], 'service':'/pressure-washing-jacksonville-fl/sidewalk-cleaning/','service_name':'Patio & Outdoor Surface Cleaning','faqs':[('Can Trex be pressure washed?','Some Trex product lines allow controlled pressure washing within manufacturer limits, while older lines may not. Identify the product first.'),('Can wood decks be damaged by a pressure washer?','Yes. Excessive pressure can raise grain, splinter wood or leave visible cleaning marks.'),('Should the deck manufacturer guide the method?','Yes. Product-specific care instructions should take priority over a generic pressure setting.')], 'sources':[('Trex care and cleaning guide','https://www.trex.com/customer-support/trex-owners/care-and-cleaning/')]},
          {'cat':'decks','slug':'deck-cleaning-before-staining','title':'How to Clean a Deck Before Staining','desc':'Why deck cleaning, drying, coating condition and manufacturer instructions matter before applying stain.','quick':'A deck should be clean, sound and appropriately dry before staining, but the exact preparation depends on the wood, existing coating and the stain manufacturer. Cleaning should remove compatible dirt and organic buildup without damaging the wood fibers.','sections':[('Start by identifying what is already on the wood','New bare wood, weathered unfinished wood and a deck with an old film-forming coating are different preparation jobs. Cleaning cannot make a failing coating disappear evenly without the appropriate stripping or prep process.'),('Do not use pressure to manufacture a new problem','Trying to erase every dark mark with a narrow high-pressure stream can fur the grain and create stripes that become more visible after stain is applied. Cleaning should prepare the surface, not scar it.'),('Drying time is condition-dependent','Weather, humidity, shade, wood moisture and the coating manufacturer all affect when staining can begin. Instead of relying on a universal number of hours, follow the stain maker’s moisture and preparation requirements.'),('Clean mildew before coating','Coating over active surface contamination can trap a visual problem beneath a new finish. The EPA also advises cleaning moldy surfaces and drying them before painting or caulking; the same basic principle of clean, dry preparation matters before exterior coating work.')], 'service':'/contact/','service_name':'Request an Exterior Cleaning Estimate','faqs':[('How long should a deck dry before staining?','Follow the stain manufacturer’s preparation and moisture requirements because weather, shade and wood condition change drying time.'),('Can I stain over mildew?','Surface contamination should be cleaned and the deck should be properly prepared before coating.'),('Should a deck be blasted clean with high pressure?','No. Excessive pressure can damage wood fibers and create marks that remain visible after staining.')], 'sources':[('EPA basic mold cleanup steps','https://www.epa.gov/mold/what-are-basic-mold-cleanup-steps')]},
          {'cat':'patios','slug':'patio-cleaning-jacksonville','title':'Patio Cleaning in Jacksonville: Concrete, Brick and Paver Patios','desc':'How Jacksonville patio cleaning changes for concrete, brick, pavers, coatings and specialty stains.','quick':'Patio cleaning is not one method because patio materials vary. Broom-finished concrete can tolerate a different process from clay brick, jointed pavers, painted surfaces or coated decorative concrete.','sections':[('Identify the patio material first','Concrete, brick and interlocking pavers can all look like durable hardscape, but joints, surface texture, coatings and prior sealing change the risk. A surface cleaner that works well on plain concrete may not be appropriate for every patio.'),('Paver joints need special attention','Pressure can remove loose joint sand from between pavers. If the patio has polymeric sand, sealer or unstable joints, cleaning should consider the condition of those materials before work begins.'),('Specialty stains need specialty treatment','Rust, irrigation staining, grease, leaf tannins and embedded discoloration may not disappear with general pressure cleaning. The American Cement Association notes that stain-removal methods for concrete should be selected according to the stain type.'),('Outdoor living areas have surrounding risks','Doors, screens, furniture, grills, pool water, landscaping and drainage paths can all sit close to a patio. Cleaning the surface is only part of the job; controlling spray and runoff matters too.')], 'service':'/pressure-washing-jacksonville-fl/sidewalk-cleaning/','service_name':'Sidewalk & Patio Cleaning','faqs':[('Can pavers be pressure washed?','They can be cleaned, but joint sand, sealer and paver condition should be evaluated before selecting pressure and technique.'),('Will pressure washing remove rust?','Not always. Rust often requires chemistry selected for the stain and surface.'),('Are concrete and brick patios cleaned the same way?','Not automatically. Material, joints, coatings and condition can require different methods.')], 'sources':[('American Cement Association concrete care FAQ','https://www.cement.org/cement-concrete/cement-concrete-faq/')]},
          {'cat':'comparisons','slug':'does-pressure-washing-remove-mold-mildew-algae','title':'Does Pressure Washing Remove Mold, Mildew and Algae From Concrete?','desc':'Understand the difference between removing visible organic buildup and solving the moisture conditions that allow it to return.','quick':'Pressure washing can remove visible surface buildup from compatible concrete, but mechanical removal alone does not change the moisture, shade or debris conditions that allowed growth to develop. Treatment and complete rinsing may be part of the cleaning plan.','sections':[('Concrete can hold organic film in texture','Broom-finished and porous concrete can collect dirt, pollen and moisture in surface texture. Even after loose material is removed, dark or green organic film may need treatment rather than repeated close-range pressure.'),('Mold, mildew and algae are not identical labels','Homeowners often use the terms interchangeably for dark or green exterior growth. From a cleaning standpoint, the important questions are whether the material is removable organic buildup, whether the surface can accept the chosen chemistry and whether there is an underlying moisture issue.'),('Cleaning does not eliminate future moisture','Shade, irrigation, roof runoff and slow drying can recreate favorable conditions after a clean surface is restored. Maintenance frequency therefore depends on the property rather than a permanent one-time treatment.'),('Indoor mold guidance is not an exterior-concrete recipe','The EPA emphasizes moisture control for mold problems and cautions against assuming that simply killing mold is enough. Exterior concrete cleaning is a different application, but the broader lesson still applies: visible cleanup and moisture conditions are separate issues.')], 'service':'/pressure-washing-jacksonville-fl/driveway-cleaning/','service_name':'Driveway & Concrete Cleaning','faqs':[('Can pressure alone remove algae from concrete?','It can remove visible buildup, but treatment may help address organic film in textured or porous surfaces.'),('Will algae come back after cleaning?','It can if shade, moisture and environmental conditions remain favorable.'),('Does exterior cleaning fix a moisture problem?','No. Drainage, leaks and irrigation issues should be addressed separately when they contribute to recurring growth.')], 'sources':[('EPA: A Brief Guide to Mold, Moisture and Your Home','https://www.epa.gov/mold/brief-guide-mold-moisture-and-your-home')]},
          {'cat':'house-washing','slug':'pressure-washing-before-painting','title':'Pressure Washing Before Painting: How Long Should a House Dry Before Painting?','desc':'How to think about exterior cleaning, drying, loose paint and manufacturer instructions before painting a Florida home.','quick':'Exterior surfaces should be clean and appropriately dry before painting, but there is no universal drying time for every Florida house. Material, weather, shade, humidity and the paint manufacturer’s moisture requirements determine when coating can begin.','sections':[('Cleaning is preparation, not paint repair','House washing can remove compatible dirt and organic buildup, but it does not restore peeling paint, failed caulk, rotten wood or damaged stucco. Those conditions should be repaired or prepared according to the painting specification.'),('Why a fixed number of hours can be misleading','A sunny masonry wall after a dry day can behave differently from shaded wood or stucco after humid weather. Rainfall, dew and overnight humidity can add moisture after cleaning. Paint-manufacturer requirements are more reliable than a generic internet countdown.'),('Loose paint changes the washing method','Aggressive pressure can remove paint that was already failing and can also damage sound surfaces if misused. If repainting is planned, the cleaner and painter should agree on what prep is expected rather than assuming washing alone creates a paint-ready substrate.'),('Moldy surfaces should be cleaned before coating','The EPA advises against painting or caulking over moldy surfaces and says surfaces should be cleaned and dried first. Exterior painting projects should also follow the coating manufacturer’s preparation instructions for the specific substrate.')], 'service':'/house-washing-jacksonville-fl/','service_name':'House Washing','faqs':[('How many hours after pressure washing can I paint?','There is no safe universal number. Follow the paint manufacturer’s moisture and preparation requirements for the material and weather conditions.'),('Can pressure washing remove loose paint?','It can disturb failing paint, but pressure washing is not a substitute for the complete scraping, repair and preparation required by a paint system.'),('Should mold be painted over?','The EPA advises cleaning moldy surfaces and drying them before painting or caulking.')], 'sources':[('EPA basic mold cleanup steps','https://www.epa.gov/mold/what-are-basic-mold-cleanup-steps')]},
          {'cat':'pool-areas','slug':'pool-cage-vs-screen-enclosure-cleaning','title':'Pool Cage vs. Screen Enclosure Cleaning: What’s Included and How They’re Cleaned','desc':'Compare pool-cage and screen-enclosure cleaning, including frames, screens, decks, organic buildup and pool-water protection.','quick':'Pool cage and screen enclosure are often used as overlapping Florida terms, but a quote should still define the surfaces included: aluminum frame, screen panels, doors, lower tracks, deck or patio, and nearby coping are separate cleaning areas.','sections':[('The enclosure is a system of different materials','Powder-coated aluminum, screen mesh, fasteners, doors and track areas do not all need the same pressure. Screens can tear or stretch, while oxidized frames may show chalking that routine washing does not restore.'),('The deck may be a separate surface','Concrete, pavers, painted decks and natural stone can sit inside the same enclosure. A quote for the cage or screen structure should clarify whether the floor or pool deck is included and which method will be used on it.'),('Pool water and runoff matter','Cleaning solution and dirty rinse water can travel toward the pool. Spray direction, dilution, drainage and protection of nearby furnishings and landscaping should be part of the job plan.'),('Oxidation is not ordinary dirt','White or chalky residue on aluminum can be coating oxidation rather than organic buildup. A standard enclosure wash may clean dirt and growth without restoring an oxidized finish, so those expectations should be separated before work begins.')], 'service':'/house-washing-jacksonville-fl/pool-cage-cleaning/','service_name':'Pool Cage Cleaning','faqs':[('Is a pool cage the same as a screen enclosure?','In Florida the terms are often used for similar screened structures, but the quoted scope should identify exactly which frames, screens and floor surfaces are included.'),('Can screen mesh be pressure washed?','Screens require controlled technique because excessive pressure can stretch, tear or detach mesh.'),('Does pool cage cleaning include the deck?','Only if the quote includes it. The enclosure frame, screen panels and pool deck can be separate service areas.')], 'sources':[]}
          ]
          def render(a):
            path=f"/learning-center/{a['cat']}/{a['slug']}/"; url=BASE+path
            sec=''.join(f'<h2>{html.escape(h)}</h2><p>{html.escape(t)}</p>' for h,t in a['sections'])
            src=''
            if a['sources']: src='<h2>Sources &amp; manufacturer guidance</h2><ul class="sources">'+''.join(f'<li><a href="{u}" rel="noopener">{html.escape(n)}</a></li>' for n,u in a['sources'])+'</ul>'
            faq='<div class="faq"><h2>Frequently asked questions</h2>'+''.join(f'<details><summary>{html.escape(q)}</summary><p>{html.escape(ans)}</p></details>' for q,ans in a['faqs'])+'</div>'
            body=f'<p class="quick-answer"><strong>Quick answer:</strong> {html.escape(a["quick"])}</p>{sec}<p class="article-note">The safest cleaning decision starts with the material, existing damage, coating condition, access and the type of staining present.</p>{src}<div class="related"><h2>Related Jacksonville service</h2><p><a href="{a["service"]}">{html.escape(a["service_name"])} →</a></p><p><a href="/learning-center/">Browse the Learning Center →</a></p></div>{faq}'
            wc=len(re.findall(r'\b\w+\b',re.sub('<[^>]+>',' ',body)))
            graph=[{'@type':'WebPage','@id':url+'#webpage','url':url,'name':a['title'],'description':a['desc'],'inLanguage':'en-US','isPartOf':{'@id':BASE+'/#website'},'mainEntity':{'@id':url+'#article'},'breadcrumb':{'@id':url+'#breadcrumb'},'datePublished':DATE,'dateModified':DATE},{'@type':'BlogPosting','@id':url+'#article','mainEntityOfPage':{'@id':url+'#webpage'},'headline':a['title'],'description':a['desc'],'datePublished':DATE,'dateModified':DATE,'author':{'@id':BASE+'/#business'},'publisher':{'@id':BASE+'/#business'},'articleSection':a['cat'].replace('-',' ').title(),'inLanguage':'en-US','isAccessibleForFree':True,'wordCount':wc},{'@type':'BreadcrumbList','@id':url+'#breadcrumb','itemListElement':[{'@type':'ListItem','position':1,'name':'Home','item':BASE+'/'},{'@type':'ListItem','position':2,'name':'Learning Center','item':BASE+'/learning-center/'},{'@type':'ListItem','position':3,'name':a['title'],'item':url}]},{'@type':'FAQPage','@id':url+'#faq','mainEntity':[{'@type':'Question','name':q,'acceptedAnswer':{'@type':'Answer','text':ans}} for q,ans in a['faqs']]}]
            return f'''<!doctype html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{html.escape(a['title'])}</title><meta name="description" content="{html.escape(a['desc'],quote=True)}"><meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1"><meta name="author" content="Jacksonville Pressure Washing"><link rel="canonical" href="{url}"><link rel="alternate" type="text/plain" href="/llms.txt" title="Jacksonville Pressure Washing AI retrieval reference"><meta property="og:type" content="article"><meta property="og:site_name" content="Jacksonville Pressure Washing"><meta property="og:title" content="{html.escape(a['title'],quote=True)}"><meta property="og:description" content="{html.escape(a['desc'],quote=True)}"><meta property="og:url" content="{url}"><meta property="article:published_time" content="{DATE}"><meta property="article:modified_time" content="{DATE}"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/header.css">{STYLE}<script type="application/ld+json">{json.dumps({'@context':'https://schema.org','@graph':graph},separators=(',',':'))}</script></head><body>{NAV}<main><div class="article-shell"><article class="article-card"><nav class="blog-breadcrumb"><a href="/">Home</a><span>›</span><a href="/learning-center/">Learning Center</a><span>›</span><span>{html.escape(a['title'])}</span></nav><header class="article-header"><p class="article-category">{html.escape(a['cat'].replace('-',' ').title())}</p><h1>{html.escape(a['title'])}</h1><p class="article-dek">{html.escape(a['desc'])}</p><p class="article-meta">Updated August 17, 2026 · Jacksonville Pressure Washing field guide</p><p class="article-review">Written and reviewed by Jacksonville Pressure Washing, a licensed and insured exterior-cleaning company serving Jacksonville and surrounding Northeast Florida communities.</p></header><div class="article-content">{body}</div></article></div></main>{SCRIPT}</body></html>'''
          new=[]
          for a in A:
            f=Path('learning-center')/a['cat']/a['slug']/'index.html'; f.parent.mkdir(parents=True,exist_ok=True)
            if f.exists(): raise SystemExit(f'already exists {f}')
            f.write_text(render(a)); new.append(BASE+f'/learning-center/{a["cat"]}/{a["slug"]}/')
          sp=Path('sitemap.xml'); s=sp.read_text(); urls=re.findall(r'<loc>(.*?)</loc>',s)
          for u in new:
            if u not in urls: urls.append(u)
          sp.write_text('<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'+''.join(f'  <url><loc>{u}</loc></url>\n' for u in urls)+'</urlset>\n')
          # Add one hub section containing all 20 new demand-led guides.
          hub=Path('learning-center/index.html'); hs=hub.read_text()
          if 'data-demand-guides="2026-08-17"' not in hs:
            all_new=[
            ('What Is Soft Washing? How Soft Washing Works on Florida Homes','/learning-center/house-washing/what-is-soft-washing/'),('How Often Should You Pressure Wash Your House in Florida?','/learning-center/house-washing/how-often-pressure-wash-house-florida/'),('Can You Pressure Wash Vinyl Siding?','/learning-center/house-washing/can-you-pressure-wash-vinyl-siding/'),('Can You Pressure Wash Stucco?','/learning-center/house-washing/can-you-pressure-wash-stucco/'),('How Long Does Roof Cleaning Last in Florida?','/learning-center/roof-cleaning/how-long-does-roof-cleaning-last/'),('Can You Pressure Wash Roof Shingles?','/learning-center/roof-cleaning/can-you-pressure-wash-roof-shingles/'),('Asphalt Shingle Roof Cleaning','/learning-center/roof-cleaning/asphalt-shingle-roof-cleaning/'),('Metal Roof Cleaning in Florida','/learning-center/roof-cleaning/metal-roof-cleaning-florida/'),('Tile Roof Cleaning in Florida','/learning-center/roof-cleaning/tile-roof-cleaning-florida/'),('What Are Gutter Tiger Stripes?','/learning-center/gutters/gutter-tiger-stripes/'),('Gutter Cleaning vs. Gutter Brightening','/learning-center/gutters/gutter-cleaning-vs-gutter-brightening/'),('How to Tell if a Downspout Is Clogged','/learning-center/gutters/clogged-downspout-signs/'),('Vinyl Fence Cleaning in Florida','/learning-center/fences/vinyl-fence-cleaning-florida/'),('Wood Fence vs. Vinyl Fence Cleaning','/learning-center/fences/wood-vs-vinyl-fence-cleaning/'),('Deck Cleaning in Jacksonville','/learning-center/decks/deck-cleaning-jacksonville/'),('How to Clean a Deck Before Staining','/learning-center/decks/deck-cleaning-before-staining/'),('Patio Cleaning in Jacksonville','/learning-center/patios/patio-cleaning-jacksonville/'),('Does Pressure Washing Remove Mold, Mildew and Algae From Concrete?','/learning-center/comparisons/does-pressure-washing-remove-mold-mildew-algae/'),('Pressure Washing Before Painting','/learning-center/house-washing/pressure-washing-before-painting/'),('Pool Cage vs. Screen Enclosure Cleaning','/learning-center/pool-areas/pool-cage-vs-screen-enclosure-cleaning/')]
            cards=''.join(f'<a href="{u}" style="display:block;padding:18px;border:1px solid #dce5ea;border-radius:18px;background:#fff;text-decoration:none;color:#0b4a67;font-weight:850">{html.escape(t)}</a>' for t,u in all_new)
            section=f'<section data-demand-guides="2026-08-17" style="padding:70px 0;background:#f4f7f9"><div class="shell"><p class="eyebrow">New homeowner guides</p><h2>High-demand pressure washing questions</h2><p>New guides built around Jacksonville search demand, service-intent gaps and common homeowner research questions.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:26px">{cards}</div></div></section>'
            hs=hs.replace('</main>',section+'</main>')
            hub.write_text(hs)
          W.unlink()
          PY
      - name: Commit
        run: |
          git config user.name "Greg Soucy"
          git config user.email "GREG@COMMANDLAYER.ORG"
          git add -A
          git commit -m "Publish second 10 Learning Center guides and update hub"
          git push
