    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create city pages and eight Learning Center guides
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, html

          DOMAIN='https://jacksonvillepressurewashingfl.com'
          DATE='2026-08-17'

          NAV='''<header class="home-header"><div class="home-nav-wrap"><div class="home-topbar"><a class="home-logo-box" href="/" aria-label="Jacksonville Pressure Washing home"><img src="/pressure-washing-logo.png" alt="Jacksonville Pressure Washing" width="342" height="148"></a><div class="home-top-spacer"></div><div class="home-contact-stack"><div class="home-call-text"><span class="home-contact-icons" aria-hidden="true"><span class="phone-icon">☎</span><span class="text-icon">💬</span></span><span class="home-number">Call or Text <a href="tel:+19045375000">904.537.5000</a></span></div><div class="home-contact-actions"><a class="btn primary" href="/contact/">Get Your Free Estimate</a></div></div><button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button></div><nav class="home-menubar"><div class="drop"><button class="drop-toggle">Pressure Washing</button><div class="dropdown"><a href="/service-areas/jacksonville/">Pressure Washing &amp; Power Washing</a><a href="/pressure-washing-jacksonville-fl/driveway-cleaning/">Driveway Cleaning</a><a href="/pressure-washing-jacksonville-fl/sidewalk-cleaning/">Sidewalk Cleaning</a><a href="/pressure-washing-jacksonville-fl/pool-deck-cleaning/">Pool Deck Cleaning</a><a href="/pressure-washing-jacksonville-fl/fence-cleaning/">Fence Cleaning</a></div></div><div class="drop"><button class="drop-toggle">House Washing</button><div class="dropdown"><a href="/house-washing-jacksonville-fl/">House Washing</a><a href="/roof-cleaning-jacksonville-fl/">Roof Washing</a><a href="/house-washing-jacksonville-fl/soft-washing/">Soft Washing</a><a href="/house-washing-jacksonville-fl/pool-cage-cleaning/">Pool Cage Cleaning</a><a href="/house-washing-jacksonville-fl/screen-enclosure-cleaning/">Screen Enclosure Cleaning</a></div></div><div class="drop"><button class="drop-toggle">Gutters</button><div class="dropdown"><a href="/gutter-cleaning-jacksonville-fl/">Gutter Cleaning</a><a href="/gutter-cleaning-jacksonville-fl/gutter-brightening/">Gutter Brightening</a><a href="/gutter-cleaning-jacksonville-fl/gutter-cleaning-cost/">Gutter Cleaning Cost</a></div></div><div class="drop"><button class="drop-toggle">Service Areas</button><div class="dropdown"><a href="/service-areas/jacksonville/">Jacksonville</a><a href="/service-areas/st-johns-county/">St. Johns County</a><a href="/service-areas/clay-county/">Clay County</a><a href="/service-areas/nassau-county/">Nassau County</a><a href="/service-areas/orange-park/">Orange Park</a><a href="/service-areas/fernandina-beach/">Fernandina Beach</a></div></div><a href="/learning-center/">Learning Center</a><a href="/faq/">FAQ</a></nav></div></header>'''
          JS='''<script>const t=document.querySelector('.home-header .nav-toggle'),m=document.querySelector('.home-menubar');t?.addEventListener('click',()=>{const o=m.classList.toggle('open');t.setAttribute('aria-expanded',o)});document.querySelectorAll('.home-menubar .drop-toggle').forEach(b=>b.addEventListener('click',e=>{if(window.innerWidth<=980){e.preventDefault();b.parentElement.classList.toggle('open')}}));</script>'''

          AREA_CSS='''.area-shell{width:min(1180px,calc(100% - 40px));margin:auto}.area-kicker{display:block;margin-bottom:11px;color:#0f6ea8;font-size:12px;font-weight:1000;letter-spacing:1.9px;text-transform:uppercase}.area-jump{position:relative;z-index:4;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:-22px;padding:16px;border-radius:28px;background:#f0f5f7;box-shadow:0 14px 34px rgba(7,55,81,.08)}.area-jump a{display:block;height:100%;padding:20px;border:1px solid #dce6eb;border-radius:19px;background:#fff;text-decoration:none;color:inherit}.area-jump strong{display:block;margin-bottom:4px;color:#0b4a67;font-size:20px}.area-jump span{color:#536475;font-size:13px;line-height:1.45}.area-section{padding:84px 0}.area-section--soft{background:#f4f7f9}.area-section h2{margin:0 0 15px;color:#0b2d4a;font-size:clamp(32px,4vw,51px);line-height:1.05}.area-lead{max-width:950px;margin:0;color:#536475;font-size:17px;line-height:1.76}.area-split{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center;margin-top:34px}.area-split--reverse .area-media{order:2}.area-media{min-height:420px;overflow:hidden;border-radius:27px;background:#e8eef1;box-shadow:0 18px 42px rgba(11,45,74,.12)}.area-media img{width:100%;height:100%;min-height:420px;object-fit:cover;display:block}.area-copy h3{margin:0 0 13px;color:#0b2d4a;font-size:30px}.area-copy p,.area-copy li{color:#536475;font-size:16px;line-height:1.72}.area-copy a{color:#0f6ea8;font-weight:850}.area-grid,.area-process{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}.area-card,.area-step{padding:27px;border:1px solid #dce5ea;border-radius:24px;background:#fff;box-shadow:0 14px 34px rgba(11,45,74,.06)}.area-card h3{margin:0 0 10px;color:#0b2d4a;font-size:24px}.area-card p{margin:0;color:#536475;line-height:1.65}.area-step b{display:grid;place-items:center;width:40px;height:40px;margin-bottom:13px;border-radius:50%;background:#0b4a67;color:#fff}.area-step strong{display:block;margin-bottom:6px;color:#0b2d4a;font-size:19px}.area-step span{display:block;color:#536475;line-height:1.58;font-size:14px}.area-links{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;margin-top:30px}.area-links>div{padding:28px;border-radius:24px;background:#eef3f5}.area-links h3{margin:0 0 14px;color:#0b2d4a}.area-links nav{display:grid;gap:10px}.area-links a{color:#0f6ea8;font-weight:850;text-decoration:none}.area-faq{max-width:950px;margin-top:28px}.area-faq details{border-top:1px solid #dce5ea;padding:4px 0}.area-faq summary{cursor:pointer;padding:17px 0;color:#0b2d4a;font-weight:900;font-size:18px}.area-faq p{margin:0 0 19px;color:#536475;line-height:1.68}.area-cta{padding:78px 0;background:linear-gradient(135deg,#0f6ea8,#0b2d4a);color:#fff}.area-cta h2{margin:0 0 12px;color:#fff;font-size:clamp(34px,4vw,51px)}.area-cta p{max-width:800px;margin:0;color:#dceef6;font-size:17px;line-height:1.65}@media(max-width:980px){.area-jump{grid-template-columns:repeat(2,1fr)}.area-split,.area-links{grid-template-columns:1fr}.area-split--reverse .area-media{order:0}.area-grid,.area-process{grid-template-columns:1fr 1fr}.area-media,.area-media img{min-height:350px}}@media(max-width:650px){.area-shell{width:calc(100% - 24px)}.area-jump{grid-template-columns:1fr;margin-top:0;border-radius:0}.area-section{padding:62px 0}.area-grid,.area-process{grid-template-columns:1fr}.area-media,.area-media img{min-height:280px}}'''

          def area_page(slug, city, county, hero, eyebrow, intro, local_note, nearby):
              url=f'{DOMAIN}/service-areas/{slug}/'
              title=f'Pressure Washing {city} FL | House, Roof & Driveway Cleaning'
              desc=f'Pressure washing in {city}, FL for houses, roofs, driveways, concrete, gutters, fences, pool areas and compatible exterior surfaces. Licensed and insured.'
              faq=[
                (f'What pressure washing services are available in {city}?','Service can include pressure washing, house washing, roof cleaning, driveway and concrete cleaning, gutter cleaning, fence cleaning, pool-area cleaning and other compatible exterior surfaces within the quoted scope.'),
                (f'Do you provide house washing in {city}?','Yes. Compatible stucco, siding, soffits, fascia, trim and painted exterior surfaces can be evaluated for lower-pressure house washing based on material and condition.'),
                (f'Do you clean roofs in {city}?','Yes. Compatible asphalt-shingle, tile and metal roofs can be evaluated for roof cleaning using roof-specific methods rather than treating the roof like concrete.'),
                (f'Can driveway and house washing be quoted together?','Yes. Multiple exterior services can be included in one property quote when the requested surfaces and scope are provided.'),
                (f'Do you clean gutters in {city}?','Yes. Gutter cleaning can include interior debris removal and accessible downspout checks within the quoted scope.'),
                (f'How do I get a {city} pressure-washing quote?','Use the quote page and provide the property address, requested surfaces, wide photos and close-up photos of heavy staining or access issues when available.')
              ]
              schema={"@context":"https://schema.org","@graph":[
                {"@type":"WebPage","@id":url+"#webpage","url":url,"name":title,"description":desc,"isPartOf":{"@id":DOMAIN+"/#website"},"about":{"@id":DOMAIN+"/#business"},"inLanguage":"en-US","mainEntity":{"@id":url+"#service"},"breadcrumb":{"@id":url+"#breadcrumb"}},
                {"@type":"Service","@id":url+"#service","name":f"Pressure Washing and Exterior Cleaning in {city}","provider":{"@id":DOMAIN+"/#business"},"serviceType":["Pressure Washing","House Washing","Roof Cleaning","Driveway Cleaning","Gutter Cleaning","Fence Cleaning","Pool Area Cleaning"],"areaServed":{"@type":"City","name":f"{city}, FL"},"url":url,"inLanguage":"en-US"},
                {"@type":"BreadcrumbList","@id":url+"#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":DOMAIN+"/"},{"@type":"ListItem","position":2,"name":"Service Areas","item":DOMAIN+"/service-areas/"},{"@type":"ListItem","position":3,"name":city,"item":url}]},
                {"@type":"FAQPage","@id":url+"#faq","mainEntity":[{"@type":"Question","name":q,"acceptedAnswer":{"@type":"Answer","text":a}} for q,a in faq]}
              ]}
              faq_html=''.join(f'<details><summary>{html.escape(q)}</summary><p>{html.escape(a)}</p></details>' for q,a in faq)
              return f'''<!doctype html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{html.escape(title)}</title><meta name="description" content="{html.escape(desc)}"><meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1"><link rel="canonical" href="{url}"><link rel="alternate" type="text/plain" href="/llms.txt" title="Jacksonville Pressure Washing AI retrieval reference"><link rel="preload" as="image" href="{hero}"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/header.css"><meta property="og:type" content="website"><meta property="og:site_name" content="Jacksonville Pressure Washing"><meta property="og:title" content="{html.escape(title)}"><meta property="og:description" content="{html.escape(desc)}"><meta property="og:url" content="{url}"><meta property="og:image" content="{DOMAIN}{hero}"><style>{AREA_CSS}</style><script type="application/ld+json">{json.dumps(schema,separators=(',',':'))}</script></head><body>{NAV}<main><section class="home-photo-banner" aria-label="{city} pressure washing"><img src="{hero}" alt="Pressure washing service for {city} Florida"><div class="home-photo-overlay"><div class="hero-glass"><p class="eyebrow">{eyebrow}</p><h1>Pressure Washing in {city}, FL</h1><p>{intro}</p><div class="actions"><a class="btn primary" href="/contact/">Get Your Free Estimate</a></div></div></div></section><div class="area-shell"><div class="area-jump"><a href="/pressure-washing-jacksonville-fl/driveway-cleaning/"><strong>Driveway Cleaning</strong><span>Concrete, sidewalks and flatwork</span></a><a href="/house-washing-jacksonville-fl/"><strong>House Washing</strong><span>Stucco, siding, soffits and trim</span></a><a href="/roof-cleaning-jacksonville-fl/"><strong>Roof Cleaning</strong><span>Shingle, tile and compatible roofing</span></a><a href="/gutter-cleaning-jacksonville-fl/"><strong>Gutter Cleaning</strong><span>Interior debris and accessible downspouts</span></a></div></div><section class="area-section"><div class="area-shell"><span class="area-kicker">{city} exterior cleaning</span><h2>One property can have several surfaces that need completely different cleaning methods</h2><p class="area-lead">{local_note}</p><div class="area-split"><div class="area-media"><img src="/images/jacksonville-pressure-washing-driveway.webp" alt="Driveway pressure washing service" loading="lazy"></div><div class="area-copy"><h3>Pressure washing for durable concrete and flatwork</h3><p>Driveways, sidewalks, walkways and compatible patios are the surfaces most homeowners associate with pressure washing. Even durable concrete needs even cleaning technique and separate evaluation for oil, rust, irrigation stains, tire marks and other bonded discoloration.</p><p><a href="/pressure-washing-jacksonville-fl/driveway-cleaning/">Driveway Cleaning</a> and <a href="/pressure-washing-jacksonville-fl/sidewalk-cleaning/">Sidewalk &amp; Patio Cleaning</a> explain those services in more detail.</p></div></div></div></section><section class="area-section area-section--soft"><div class="area-shell"><span class="area-kicker">House, roof, gutters and outdoor surfaces</span><h2>More pressure is not the answer on every exterior material</h2><div class="area-grid"><div class="area-card"><h3>House Washing</h3><p>Compatible stucco, siding, soffits, fascia, trim and painted surfaces are evaluated for lower-pressure cleaning based on material and condition.</p></div><div class="area-card"><h3>Roof Cleaning</h3><p>Roof material, staining, pitch and condition determine the appropriate cleaning plan for compatible shingle, tile and metal roofs.</p></div><div class="area-card"><h3>Gutter Cleaning</h3><p>Interior debris removal and accessible downspout checks help restore roof drainage without confusing interior cleaning with exterior brightening.</p></div><div class="area-card"><h3>Fence Cleaning</h3><p>Vinyl, PVC and other compatible fence materials require attention to organic buildup, oxidation, coatings and material condition.</p></div><div class="area-card"><h3>Pool Areas</h3><p>Pool decks, cages and screen enclosures combine multiple materials and should be cleaned according to the surface rather than one pressure setting.</p></div><div class="area-card"><h3>Commercial Surfaces</h3><p>Compatible sidewalks, entries, concrete and exterior surfaces can be evaluated for commercial pressure washing within the requested scope.</p></div></div></div></section><section class="area-section"><div class="area-shell"><span class="area-kicker">How quotes are built</span><h2>A clear scope starts with the surfaces, access and staining</h2><div class="area-process"><div class="area-step"><b>1</b><strong>Show the property</strong><span>Provide the address plus wide photos showing the house, roofline, driveway or requested exterior surfaces.</span></div><div class="area-step"><b>2</b><strong>Show problem areas</strong><span>Close-up photos of rust, oil, algae, oxidation, heavy gutter debris or difficult access help define the scope.</span></div><div class="area-step"><b>3</b><strong>Match the method</strong><span>The cleaning approach is selected around the actual material and condition rather than using one pressure level everywhere.</span></div></div><div class="area-links"><div><h3>Related services</h3><nav><a href="/house-washing-jacksonville-fl/">House Washing</a><a href="/roof-cleaning-jacksonville-fl/">Roof Cleaning</a><a href="/pressure-washing-jacksonville-fl/driveway-cleaning/">Driveway Cleaning</a><a href="/gutter-cleaning-jacksonville-fl/">Gutter Cleaning</a></nav></div><div><h3>Nearby coverage</h3><nav>{nearby}</nav></div></div><div class="area-faq"><h2>Frequently asked questions</h2>{faq_html}</div></div></section><section class="area-cta"><div class="area-shell"><h2>Get a {city} exterior-cleaning quote</h2><p>Send the property address, requested surfaces and photos so the scope can be evaluated before scheduling.</p><div class="actions"><a class="btn light" href="/contact/">Get Your Free Estimate</a></div></div></section></main>{JS}</body></html>'''

          areas=[
            ('orange-park','Orange Park','Clay County','/images/clay-county-service-area.png','Orange Park • Clay County','Pressure washing, house washing, roof cleaning, driveway cleaning, gutters, fences and compatible exterior cleaning in Orange Park.','Orange Park properties can combine concrete driveways, stucco or siding, shingle roofs, gutters, fences and screened outdoor spaces. Shade, humidity, irrigation and ordinary exterior exposure can produce very different staining on those materials, so the cleaning method should change with the surface.','<a href="/service-areas/clay-county/">Clay County</a><a href="/service-areas/jacksonville/">Jacksonville</a><a href="/service-areas/st-johns-county/">St. Johns County</a>'),
            ('fernandina-beach','Fernandina Beach','Nassau County','/nocatee-roof-washing.webp','Fernandina Beach • Nassau County','Pressure washing, house washing, roof cleaning, driveways, gutters, fences and compatible exterior cleaning in Fernandina Beach.','Fernandina Beach properties can combine coastal weather exposure, shade, tree debris, concrete, siding or stucco, roofs, gutters and outdoor living areas. Organic buildup and staining do not respond the same way on every material, so surface condition and manufacturer guidance matter.','<a href="/service-areas/nassau-county/">Nassau County</a><a href="/service-areas/jacksonville/">Jacksonville</a><a href="/service-areas/st-johns-county/">St. Johns County</a>')
          ]
          for slug,city,county,hero,eyebrow,intro,note,nearby in areas:
              p=Path('service-areas')/slug/'index.html'; p.parent.mkdir(parents=True,exist_ok=True); p.write_text(area_page(slug,city,county,hero,eyebrow,intro,note,nearby),encoding='utf-8')

          ARTICLE_CSS='''body{background:#edf4f8}.article-shell{width:min(980px,calc(100% - 36px));margin:0 auto;padding:28px 0 70px}.article-card{background:#fff;border:1px solid #dce6ec;box-shadow:0 18px 50px rgba(8,47,73,.08);padding:34px 42px 44px}.blog-breadcrumb{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 25px;color:#6b7e8a;font-size:.8rem}.blog-breadcrumb a,.article-content a{color:#0877b9;text-decoration:none}.article-header{padding-bottom:25px;border-bottom:1px solid #e3eaee}.article-category{margin:0 0 10px;color:#0877b9;font-size:.76rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.article-header h1{max-width:840px;margin:0 0 12px;color:#082f49;font-size:clamp(2.15rem,5vw,3.55rem);line-height:1.04}.article-dek{max-width:800px;color:#4e6574;font-size:1.08rem;line-height:1.65}.article-meta,.article-review{color:#70828d;font-size:.86rem}.article-content{font-size:1.02rem;line-height:1.78;color:#253f4e}.article-content h2{margin:38px 0 12px;color:#082f49;font-size:1.7rem}.article-content h3{margin:27px 0 8px;color:#0b4a67}.quick-answer{margin:28px 0 12px;padding:18px 20px;border-left:4px solid #0877b9;background:#f4f8fb}.checklist li{margin:10px 0}.article-note{padding:17px 19px;border-radius:12px;background:#eef6fa}.related{margin-top:36px;padding-top:28px;border-top:1px solid #e0e8ed}.faq details{border-top:1px solid #dce5ea}.faq summary{cursor:pointer;padding:15px 0;font-weight:900;color:#0b4a67}.faq p{margin-top:0}@media(max-width:650px){.article-shell{width:calc(100% - 20px)}.article-card{padding:24px 18px 32px}}'''

          articles=[
          dict(cat='Concrete',slug='comparisons/can-pressure-washing-damage-concrete',title='Can Pressure Washing Damage Concrete? Etching, Lines and Surface-Cleaner Marks Explained',desc='Learn how pressure washing can damage concrete, what etching and cleaning lines look like, and why concrete age, condition, pressure and technique matter.',quick='Yes. Concrete is durable, but excessive pressure, a nozzle held too close, uneven surface-cleaner technique or cleaning concrete before it has adequately cured can leave permanent marks. Professional concrete cleaning is about controlled pressure and even technique—not simply using the strongest machine setting.',sections=[('Why concrete can still be damaged','Concrete looks extremely hard, but its visible surface can be altered. A concentrated pressure-washer jet can cut a brighter line into the surface, expose aggregate, roughen weak areas or create a pattern that remains visible after the concrete dries. Older concrete can also have pre-existing wear, scaling, patching or coatings that respond differently from the surrounding slab.'),('What pressure-washer etching looks like','Etching commonly appears as pale wand lines, arcs, stripes or roughened areas that follow the operator’s movement. Surface-cleaner mistakes can show up as circular overlaps or bands when travel speed and cleaning distance are inconsistent. Once the cement paste at the surface has been mechanically removed, another cleaning pass does not put it back.'),('Pressure is only one part of the equation','Nozzle type, distance, flow, dwell time, surface-cleaner setup and the condition of the slab all matter. A wider fan pattern used at a sensible distance spreads force over a larger area. A narrow tip held close concentrates force. The safest setup is the least aggressive combination that achieves uniform cleaning.'),('New concrete deserves extra caution','Recently placed concrete continues developing strength after it is poured. The appropriate wait before pressure washing depends on the concrete mix, cure conditions and the recommendations of the installer or concrete professional. When the slab is new, verify the cure requirement instead of assuming it can be cleaned like mature concrete.'),('Stains can tempt people into using too much pressure','Oil, rust, irrigation stains, tire marks and deeply embedded discoloration may require chemistry or stain-specific treatment. Increasing pressure is not a universal stain-removal strategy and can damage the slab while leaving the stain behind.')],faqs=[('Can a pressure washer permanently mark concrete?','Yes. Excessive pressure or concentrated spray can etch the visible surface and leave lines or roughened areas.'),('Do surface cleaners prevent damage?','They can improve consistency, but incorrect height, overlap, speed or pressure can still create visible patterns.'),('Should stronger pressure be used on oil or rust?','Not automatically. Oil, rust and irrigation stains often require stain-specific treatment rather than simply more pressure.')],related='/pressure-washing-jacksonville-fl/driveway-cleaning/',related_name='Driveway & Concrete Cleaning'),
          dict(cat='House Washing',slug='house-washing/what-does-professional-house-wash-include',title='What Does a Professional House Wash Include? Siding, Soffits, Fascia & Trim',desc='A Jacksonville homeowner guide to what a professional house wash can include, from siding and stucco to soffits, fascia, trim and exterior buildup.',quick='A professional house wash should start with the material and agreed scope. Compatible siding or stucco, soffits, fascia, trim and exterior architectural details may be included, while windows, gutters, oxidation restoration, specialty stain removal and detached structures should be clarified instead of assumed.',sections=[('The house exterior is more than the main wall surface','A typical exterior can combine stucco, vinyl siding, fiber-cement siding, brick accents, painted trim, soffits, fascia, gutters, doors, vents, light fixtures and screened areas. These materials do not all tolerate the same chemistry or pressure. The cleaning plan should identify what is actually being washed before work begins.'),('Siding and stucco are the core of most house-wash scopes','House washing generally focuses on organic exterior buildup such as algae, mildew-like growth, pollen, dirt and spider debris on compatible building surfaces. Lower-pressure application and rinsing are often more appropriate than treating siding or painted stucco like a concrete driveway.'),('Soffits, fascia and trim need careful spray direction','Soffit vents, seams, electrical items, cameras and openings deserve attention because water should not be driven into the building envelope. Fascia and painted trim may also have oxidation, failing paint or existing damage that normal washing will not restore.'),('Not every stain is normal house-wash dirt','Rust, irrigation staining, oxidation, artillery fungus, paint failure, mineral deposits and deeply bonded marks may require separate evaluation. A good scope distinguishes ordinary organic cleaning from restoration or specialty stain treatment so expectations are clear.'),('The quote should define exclusions and add-ons','Homeowners should know whether exterior gutter faces, screens, pool cages, detached garages, patios, windows and roof cleaning are included or separate. Clear scope is more useful than a vague promise to “wash the whole house.”')],faqs=[('Does house washing include soffits and fascia?','It can. The quote should state whether compatible soffits, fascia and trim are included in the agreed scope.'),('Does a house wash remove oxidation?','Normal house washing is not an oxidation-restoration process. Chalky or faded finishes may require separate restoration.'),('Is roof cleaning part of a house wash?','Usually it should be treated as a separate service because roofing requires roof-specific evaluation and cleaning methods.')],related='/house-washing-jacksonville-fl/',related_name='House Washing'),
          dict(cat='House Washing',slug='house-washing/why-green-algae-keeps-coming-back-on-siding',title='Why Does Green Algae Keep Coming Back on Florida House Siding?',desc='Why green organic growth returns on Florida siding and stucco, and how shade, moisture, landscaping and surface condition affect cleaning frequency.',quick='Green exterior growth returns when the environmental conditions that support it return. Shade, humidity, nearby vegetation, sprinkler overspray and slow-drying walls can make one side of a Florida home show buildup sooner than another. Cleaning removes the visible growth; it does not change the property’s sun, shade or moisture exposure.',sections=[('Shade and slow drying are major factors','Exterior walls that receive less direct sun often stay damp longer after rain, dew or irrigation. That extended moisture window can make shaded elevations develop green buildup sooner than walls that dry rapidly.'),('Landscaping can change the microclimate around a wall','Dense shrubs and trees can reduce airflow, hold moisture near the building and deposit pollen or organic debris on siding and stucco. This does not mean landscaping is a problem; it simply helps explain why buildup can be heavier in certain areas.'),('Sprinkler overspray can keep surfaces wet','Irrigation aimed toward walls, fences or shaded concrete can repeatedly add moisture. It may also leave mineral or rust staining that is different from ordinary green organic growth and may need separate treatment.'),('Cleaning frequency should be condition based','There is no single schedule that fits every Florida home. A sunny, open property may stay cleaner longer than a wooded or heavily shaded property. Instead of washing on a fixed calendar, watch for visible growth, heavy pollen film, spider debris and areas that remain damp.'),('Why aggressive pressure does not prevent regrowth','More pressure does not change the environment around the home. It can also damage siding, paint or stucco. The goal is to remove compatible buildup with a surface-appropriate method and then allow normal weather exposure to dictate when maintenance is needed again.')],faqs=[('Why is the north or shaded side of my house greener?','Shaded walls often dry more slowly, which can support faster recurrence of organic exterior buildup.'),('Will higher pressure keep algae away longer?','No. More pressure does not change shade, humidity or moisture exposure and can damage sensitive surfaces.'),('Can sprinkler overspray contribute to buildup?','Yes. Repeated wetting can keep surfaces damp and may also introduce separate mineral or irrigation staining.')],related='/house-washing-jacksonville-fl/',related_name='House Washing'),
          dict(cat='House Washing',slug='house-washing/vinyl-siding-oxidation-house-washing',title='Vinyl Siding Oxidation: Why a House Wash Can Reveal Chalky or Faded Areas',desc='Learn what vinyl siding oxidation looks like, why washing can reveal uneven fading, and why normal house washing is different from oxidation restoration.',quick='Chalky residue on older vinyl siding is often oxidation from weathering of the surface. A normal house wash can remove dirt and organic buildup around that oxidation, making fading or chalkiness easier to see. Washing does not necessarily cause the oxidation, and ordinary house washing is not the same as oxidation restoration.',sections=[('What vinyl siding oxidation looks like','Oxidized siding can feel chalky or leave a powdery residue when rubbed. Color may look lighter or uneven, especially on sun-exposed elevations. The condition can vary from panel to panel depending on age, orientation and previous cleaning.'),('Why the siding may look different after washing','Dirt, algae and atmospheric film can partially mask faded or chalky areas. Once that surface contamination is removed, the underlying weathering can become more obvious. This is why a pre-cleaning inspection matters on older or heavily sun-exposed vinyl.'),('Pressure can create additional problems','Aggressive close-range pressure can leave cleaning marks, force water behind panels or disturb a chalky finish unevenly. Lower-pressure washing reduces mechanical force, but the existing oxidation still needs to be recognized before the project begins.'),('Oxidation restoration is a different service','Restoring an oxidized exterior may require specialized products, hand or controlled mechanical work and much more labor than a maintenance house wash. Homeowners should not assume that removing algae automatically restores original color.'),('How to set expectations before cleaning','Photograph chalky areas, test an inconspicuous section when needed and distinguish normal organic cleaning from faded finish restoration. That keeps a successful cleaning project from being judged against a restoration goal that was never part of the scope.')],faqs=[('Does house washing cause vinyl siding oxidation?','Oxidation is generally a weathering condition. Cleaning can make existing chalkiness or fading easier to see once dirt and organic buildup are removed.'),('Can pressure washing streak oxidized siding?','Yes. Aggressive or uneven mechanical cleaning can disturb a chalky surface and create visible differences.'),('Is oxidation removal included in a normal house wash?','Not usually. Oxidation restoration is a different process and should be quoted separately when offered.')],related='/house-washing-jacksonville-fl/',related_name='House Washing'),
          dict(cat='Gutters',slug='gutters/are-gutter-guards-worth-it-florida',title='Are Gutter Guards Worth It in Florida—and Do They Still Need Cleaning?',desc='A Florida homeowner guide to gutter guards, leaves, pine needles, roof debris and why guarded gutters still require inspection and maintenance.',quick='Gutter guards can reduce the amount and size of debris entering a gutter, but they do not make the system maintenance-free. Pine needles, seed pods, roof granules, small debris and material sitting on top of the guard can still affect drainage. The value of guards depends on the roof, tree cover, guard type and willingness to inspect them.',sections=[('What gutter guards are designed to do','Most guard systems attempt to keep larger debris out while allowing rainwater to enter the gutter. Designs vary widely, including screens, mesh products and surface-tension systems. Performance depends on the specific product and installation.'),('Florida tree debris can still create maintenance','Leaves, pine needles, seed pods and small organic debris can collect on top of guards or work into openings. Roof granules and fine particles can also reach the gutter channel. A covered system can therefore need less frequent interior cleaning without becoming inspection-free.'),('Clogged downspouts are still possible','If small debris reaches the gutter or if an outlet is restricted, the downspout can still become a drainage problem. Overflow at one area, water spilling behind the gutter or standing water after rainfall are signs that the system deserves inspection.'),('Guards can make cleaning easier—or harder','Some systems lift or remove easily for service; others make access more involved. Before installing guards, homeowners should understand how the product will be inspected and cleaned later, not just how it performs on installation day.'),('When guards may make the most sense','Properties under heavy tree cover may benefit from reducing large debris entry, especially when gutters fill quickly. Homes with little overhead debris may see a smaller maintenance benefit. The decision should be based on the actual property rather than assuming every Florida roof needs the same system.')],faqs=[('Do gutter guards eliminate gutter cleaning?','No. They may reduce debris entry, but the gutter, guard surface and downspouts still need inspection and periodic maintenance.'),('Can pine needles get through gutter guards?','Depending on the guard design, small needles and fine debris may pass through or collect on top.'),('Should gutters be cleaned before guards are installed?','The gutter channel and downspouts should be in good working condition before a guard system is installed.')],related='/gutter-cleaning-jacksonville-fl/',related_name='Gutter Cleaning'),
          dict(cat='Gutters',slug='gutters/interior-gutter-cleaning-vs-exterior-gutter-washing',title='Interior Gutter Cleaning vs. Exterior Gutter Washing: What’s the Difference?',desc='Learn the difference between removing debris from inside gutters and washing or brightening exterior gutter faces in Jacksonville and Northeast Florida.',quick='Interior gutter cleaning and exterior gutter washing solve different problems. Interior cleaning removes leaves, pine needles and debris that interfere with drainage. Exterior washing addresses dirt and organic film on the visible gutter face. Tiger stripes and bonded oxidation may require a separate brightening or restoration process.',sections=[('Interior cleaning is about drainage','The inside of the gutter channel collects roof debris, leaves, pine needles and sediment. The service goal is to remove material that blocks the water path and to check accessible downspout openings within the quoted scope.'),('Exterior gutter washing is cosmetic maintenance','The visible face of the gutter can collect dirt, algae, pollen and spider debris. Washing the exterior can improve appearance, but it does not mean the inside channel has been cleaned.'),('Tiger stripes are a separate problem','Dark vertical lines on gutter faces can be more strongly bonded than ordinary surface dirt. These “tiger stripes” can involve electrostatic bonding and oxidation-related staining, so a normal house wash may improve them without fully removing them.'),('Gutter brightening is more specialized','Brightening typically uses dedicated chemistry and more focused hand or controlled application than routine exterior washing. The condition of the finish matters because older painted gutters can be oxidized or worn.'),('Ask what is included before comparing quotes','Two companies can both advertise “gutter cleaning” while selling different scopes. One may mean interior debris removal, another exterior washing, and another a combination. The quote should say whether the channel, downspouts, gutter faces and brightening are included.')],faqs=[('Does gutter cleaning include washing the outside?','Not automatically. Interior debris removal and exterior washing should be listed separately in the scope.'),('What are gutter tiger stripes?','They are dark vertical streaks that can bond more strongly to the gutter finish than ordinary dirt and may require dedicated brightening chemistry.'),('Does exterior gutter washing clear downspouts?','No. Exterior cosmetic washing does not remove internal downspout blockages.')],related='/gutter-cleaning-jacksonville-fl/',related_name='Gutter Cleaning'),
          dict(cat='House Washing',slug='house-washing/soffit-fascia-cleaning-jacksonville',title='Soffit & Fascia Cleaning in Jacksonville: Algae, Mildew and Spider Webs',desc='How soffits, fascia and roofline trim are cleaned in Jacksonville, including vents, painted finishes, organic buildup and spider debris.',quick='Soffits and fascia can usually be cleaned as part of a compatible house-washing scope, but they should not be blasted with the same pressure used on concrete. Vented soffits, painted finishes, cameras, lights and roofline openings require controlled spray direction and lower mechanical force.',sections=[('Why soffits collect visible buildup','Soffits sit under roof overhangs where direct rainfall may not rinse the surface evenly. Spider webs, insect debris, pollen and organic film can collect along corners, vents and trim. Shaded rooflines may also stay damp longer.'),('Vented soffits change the cleaning approach','Perforated and vented soffit panels are designed to move air into the roof assembly. Cleaning should avoid forcing large amounts of water upward through those openings. Spray direction and distance matter as much as pressure.'),('Fascia is often a painted finish','Fascia boards and metal fascia wraps can have fading, oxidation, peeling paint or pre-existing staining. Normal exterior washing can remove compatible surface buildup, but it will not restore failed paint or reverse weathering.'),('Roofline details need inspection','Cameras, exterior lights, outlets, loose panels, bird nests, open seams and damaged caulk should be identified before washing. The goal is to clean the surface without turning a cosmetic maintenance job into a water-entry or electrical problem.'),('House washing should define the roofline scope','If soffits, fascia and trim are important to the homeowner, they should be explicitly included in the estimate. This is especially useful on two-story homes or properties with deep overhangs where access changes the work involved.')],faqs=[('Can soffits be pressure washed?','They should generally be cleaned with lower mechanical force and careful spray direction, especially when panels are vented.'),('Will washing fix peeling fascia paint?','No. Cleaning can reveal loose or failing paint, but repainting or coating restoration is a separate project.'),('Are spider webs included in house washing?','Compatible exterior spider debris can often be addressed within a house-washing scope, but the quote should define what areas are included.')],related='/house-washing-jacksonville-fl/',related_name='House Washing'),
          dict(cat='Concrete',slug='driveways/how-to-remove-tire-marks-concrete-driveway',title='How to Remove Tire Marks From a Concrete Driveway',desc='Why black tire marks can bond to concrete, how they differ from ordinary dirt, and what Jacksonville homeowners should know before pressure washing them.',quick='Tire marks are not always loose dirt. Heat, rubber compounds, sealers and the concrete surface can create bonded dark marks that need detergent, dwell time and controlled agitation in addition to normal concrete cleaning. Some discoloration may remain if the mark has reacted with a coating or penetrated the surface.',sections=[('Why tire marks can be stubborn','Vehicle tires heat during driving and can leave rubber and plasticizer residue where the vehicle turns or parks. On porous concrete the mark can sit in the surface texture; on sealed concrete it may interact with the coating instead.'),('Start by identifying the surface','Bare concrete, painted floors, acrylic-sealed concrete and other coatings should not automatically receive the same chemistry or pressure. If a driveway is sealed or coated, the product manufacturer’s maintenance guidance should take priority.'),('Detergent and dwell time can matter more than pressure','A compatible cleaner can help loosen traffic film and rubber so less mechanical force is required. Controlled brushing or agitation may be useful on localized marks. Jumping directly to a concentrated pressure-washer tip risks etching the concrete around a mark that still does not fully disappear.'),('Surface-cleaner passes should stay even','After localized pretreatment, the broader driveway can be cleaned uniformly. Inconsistent speed, overlap or pressure can leave obvious stripes that are more distracting than the original tire mark.'),('Know when a shadow may remain','Older rubber marks, chemical reactions with sealers and deeply embedded discoloration can leave a residual shadow. A professional quote should distinguish normal concrete cleaning from coating repair, stripping or restoration.')],faqs=[('Will pressure washing remove tire marks from concrete?','It can improve many marks, but bonded rubber or reactions with sealers may require detergent, agitation or separate restoration.'),('Should I use a zero-degree tip on tire marks?','No. A concentrated tip can permanently etch concrete and create a lighter line around the stain.'),('Can tire marks damage concrete sealers?','Tire compounds can interact with some coatings. If the driveway is sealed, identify the coating before choosing chemicals or aggressive cleaning.')],related='/pressure-washing-jacksonville-fl/driveway-cleaning/',related_name='Driveway & Concrete Cleaning')
          ]

