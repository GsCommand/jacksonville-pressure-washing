name: Update House Washing Hero New

on:
  push:
    paths:
      - '.github/workflows/update-house-washing-hero-new.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update house washing hero image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('House-Washing-Jacksonville-FL/index.html')
          s = p.read_text()
          old = '<img src="/images/house-washing.webp" alt="House washing service in Jacksonville, Florida">'
          new = '<img src="/images/jackosnville-houe-washing.jpeg" alt="House washing service in Jacksonville, Florida">'
          if old not in s:
              raise SystemExit('Expected house washing hero image markup not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit update and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add House-Washing-Jacksonville-FL/index.html
          git rm .github/workflows/update-house-washing-hero-new.yml
          git commit -m 'Update house washing hero image'
          git push
